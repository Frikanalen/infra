#
# This playbook initializes templates used by our Terraform automation.
#
# We initialize each configured template on every machine, and the machines are
# then cloned, referencing templates by name rather than numeric `VMID`,
# meaning templates are available on local disk (at time of writing,
# there's no shared storage, something I'd like to address...).
#
# When we do get performant shared storage in place, we can simply use one
# single template across each cluster.
#
---
- name: Create Ubuntu cloud-init templates on Proxmox
  hosts: proxmox
  gather_facts: false
  become: true

  vars:
    storage_name: "local-lvm"
    bridge_name: "vmbr0"
    image_directory: "/var/lib/vz/template/iso"

    # The VMID is the prefix followed by the single-digit Proxmox node number.
    # For example, Ubuntu 24.04 is 9001 on vm1 and 9004 on vm4. VMIDs must be
    # unique across the Proxmox cluster even though the disks are node-local.
    cloud_templates:
      - name: "ubuntu-24.04-cloud"
        vmid_prefix: 900
        image_filename: "noble-server-cloudimg-amd64.img"
        image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
      - name: "ubuntu-22.04-cloud"
        vmid_prefix: 910
        image_filename: "jammy-server-cloudimg-amd64.img"
        image_url: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"

  tasks:
    - name: Validate Proxmox node naming convention
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^vm[0-9]$')
        fail_msg: >-
          Template VMIDs require a single-digit node name such as vm1.
          Update the VMID allocation before adding differently named nodes.

    - name: Ensure cloud image directory exists
      ansible.builtin.file:
        path: "{{ image_directory }}"
        state: directory
        mode: "0755"

    - name: List VMs on this Proxmox node
      ansible.builtin.command: >-
        pvesh get /nodes/{{ inventory_hostname }}/qemu --output-format json
      register: proxmox_vms
      changed_when: false

    - name: Record existing VMs and templates
      ansible.builtin.set_fact:
        existing_vm_names: >-
          {{ (proxmox_vms.stdout | from_json) | map(attribute='name') | list }}
        existing_template_names: >-
          {{ (proxmox_vms.stdout | from_json)
             | selectattr('template', 'defined')
             | selectattr('template', 'equalto', 1)
             | map(attribute='name')
             | list }}

    - name: Refuse conflicting non-template VMs
      ansible.builtin.assert:
        that:
          - item.name not in existing_vm_names or item.name in existing_template_names
        fail_msg: >-
          {{ item.name }} exists on {{ inventory_hostname }}, but it is not a
          template. Resolve that VM before running this playbook again.
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Download cloud images for missing templates
      ansible.builtin.get_url:
        url: "{{ item.image_url }}"
        dest: "{{ image_directory }}/{{ item.image_filename }}"
        mode: "0644"
        force: false
      when: item.name not in existing_template_names
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create missing base VMs
      ansible.builtin.command: >-
        qm create {{ item.vmid_prefix }}{{ inventory_hostname[-1] }}
        --name {{ item.name }}
        --memory 2048
        --cores 2
        --net0 virtio,bridge={{ bridge_name }}
        --serial0 socket
        --ostype l26
      when: item.name not in existing_template_names
      changed_when: true
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Import cloud image disks
      ansible.builtin.command: >-
        qm importdisk
        {{ item.vmid_prefix }}{{ inventory_hostname[-1] }}
        {{ image_directory }}/{{ item.image_filename }}
        {{ storage_name }}
      when: item.name not in existing_template_names
      changed_when: true
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Attach imported disks and set boot options
      ansible.builtin.command: >-
        qm set {{ item.vmid_prefix }}{{ inventory_hostname[-1] }}
        --scsihw virtio-scsi-pci
        --scsi0
        {{ storage_name }}:vm-{{ item.vmid_prefix }}{{ inventory_hostname[-1] }}-disk-0
        --boot c
        --bootdisk scsi0
      when: item.name not in existing_template_names
      changed_when: true
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Convert VMs to templates
      ansible.builtin.command: >-
        qm template {{ item.vmid_prefix }}{{ inventory_hostname[-1] }}
      when: item.name not in existing_template_names
      changed_when: true
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"

    - name: List VMs after provisioning templates
      ansible.builtin.command: >-
        pvesh get /nodes/{{ inventory_hostname }}/qemu --output-format json
      register: provisioned_proxmox_vms
      changed_when: false

    - name: Verify cloud templates exist on this node
      ansible.builtin.assert:
        that:
          - >-
            item.name in ((provisioned_proxmox_vms.stdout | from_json)
            | selectattr('template', 'defined')
            | selectattr('template', 'equalto', 1)
            | map(attribute='name')
            | list)
        fail_msg: >-
          {{ item.name }} was not found as a template on {{ inventory_hostname }}.
      loop: "{{ cloud_templates }}"
      loop_control:
        label: "{{ item.name }}"
