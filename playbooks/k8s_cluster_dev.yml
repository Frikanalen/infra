---
# Forms the kubedev MicroK8s cluster and installs the host-level
# prerequisites every node needs.
#
# This is the part that happens once in a cluster's life. The platform
# services that get re-run routinely -- ingress, DNS, monitoring, database
# operators, Argo CD -- live in playbooks/k8s_platform_dev.yml, so changing
# one of those no longer walks cluster formation first.
#
#   ansible-playbook playbooks/k8s_cluster_dev.yml
#
# Tags: bootstrap (everything here), plus seed / join / kubectl / helm / nfs.
# "join" needs the seed play's facts, so select "bootstrap" to re-form or
# extend the cluster rather than "join" on its own.

- name: Seed the kubedev cluster
  hosts: dev-kube-1
  become: true
  tags: [bootstrap, seed]
  vars:
    microk8s_cluster_expected_members: "{{ groups['kubedev'] }}"
  roles:
    - microk8s_cluster_seed

- name: Join the remaining kubedev nodes
  hosts: kubedev:!dev-kube-1
  become: true
  tags: [bootstrap, join]
  vars:
    microk8s_seed_host: dev-kube-1
  roles:
    - microk8s_cluster_join

- name: Install node prerequisites across kubedev
  hosts: kubedev
  become: true
  tags: [bootstrap]
  roles:
    - role: microk8s_kubectl
      tags: [kubectl]
    - role: k8s_base_helm
      tags: [helm]
    # nfs-common only -- nfs_client_mounts is deliberately left unset here.
    # roles/media_server mounts the archive as a raw k8s NFS volume, which
    # kubelet mounts per-pod on whichever node it lands on; it just needs
    # mount.nfs present on every node, not a host-level fstab entry.
    - role: nfs_client
      tags: [nfs]
