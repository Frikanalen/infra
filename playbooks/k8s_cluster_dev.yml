# Form HA cluster for kubedev
- hosts: dev-kube-1
  become: true
  tags: [cluster, seed]
  roles:
    - microk8s_cluster_seed

- hosts: kubedev:!dev-kube-1
  become: true
  tags: [cluster, join]
  vars:
    microk8s_seed_host: dev-kube-1
  roles:
    - microk8s_cluster_join

- hosts: kubedev
  become: true
  tags: [cluster, kubectl]
  roles:
    - microk8s_kubectl
    - k8s_base_helm
    # nfs-common only -- nfs_client_mounts is deliberately left unset here.
    # roles/media_server mounts the archive as a raw k8s NFS volume, which
    # kubelet mounts per-pod on whichever node it lands on; it just needs
    # mount.nfs present on every node, not a host-level fstab entry.
    - nfs_client

- hosts: dev-kube-1
  tags: [ingress]
  vars:
    metallb_ingress_ip: "192.168.3.90/30"
    traefik_loadbalancer_ip: "192.168.3.90"
    traefik_public_ip: "158.36.191.229"
    traefik_rfc2136_tsig_secret: "{{ vault_dns_tsig_secret }}"
    external_dns_default_target: "158.36.191.229"
    argocd_gitops_application_name: rook-ceph
    argocd_gitops_repo_path: apps/rook-ceph
  roles:
    - metallb
    - traefik
    - external_dns
    - kubegres
    - argocd
    - argocd_gitops
    - argocd_image_updater
