---
#
# Host-specific provisioning for storage hosts (file01): everything here is
# particular to this class of host, unlike playbooks/site.yml's shared
# roles.
#
- name: Provision NFS export of the media archive
  hosts: storage
  become: true
  gather_facts: true
  roles:
    - media_staging_reset
    - db_backup_retention
    - role: chwiki_images
      tags: [chwiki_images]
    - role: fk_archive_utils
      tags: [fk_archive_utils]
    - role: nfs_server
      tags: [nfs]
