---
# Deploy Argo CD application definitions to production.
#
#   ansible-playbook playbooks/k8s_apps_prod.yml
#   ansible-playbook playbooks/k8s_apps_prod.yml --tags frontend
#
# Tags: apps (everything here), plus one per component. Versions come from
# app_versions in group_vars/prod.yml.
- name: Deploy applications to the production cluster
  hosts: kubeprod_admin
  tags: [apps]
  vars:
    argocd_namespace: "argocd"
    # Reuses the same credentials as the Kubegres django-postgres database
    # (see roles/cnpg_cluster) so a later cutover is just a DATABASE_URL
    # hostname change, not a credential rotation.
    cnpg_cluster_app_password: "{{ vault_prod_django_postgres_django_password }}"
    cnpg_cluster_superuser_password: "{{ vault_prod_django_postgres_super_password }}"
  roles:
    - role: django_db_secret
      tags: [django]
      vars:
        django_db_secret_super_password: "{{ vault_prod_django_postgres_super_password }}"
        django_db_secret_replication_password: "{{ vault_prod_django_postgres_replication_password }}"
        django_db_secret_django_password: "{{ vault_prod_django_postgres_django_password }}"

    - role: argocd_app
      tags: [django]
      vars:
        argocd_app: "{{ frikanalen_apps.django }}"

    # Waits for ArgoCD to sync the Kubegres resource the django app just
    # declared, then patches on the backup config -- must follow it directly,
    # not just be somewhere after it.
    - role: kubegres_backup
      tags: [django, kubegres_backup, database]

    # Stands up the CloudNativePG "pgcluster" Cluster as a migration target
    # alongside the existing Kubegres database. Data migration itself is
    # manual; see roles/cnpg_cluster. Requires the cnpg operator from
    # playbooks/k8s_platform_prod.yml -- which prod has not run yet.
    - role: cnpg_cluster
      tags: [cnpg_cluster, database]

    - role: argocd_app
      tags: [frontend]
      vars:
        argocd_app: "{{ frikanalen_apps.frontend }}"

    - role: argocd_app
      tags: [graphics]
      vars:
        argocd_app: "{{ frikanalen_apps.graphics }}"

    - role: argocd_app
      tags: [schedule]
      vars:
        argocd_app: "{{ frikanalen_apps.schedule }}"

    - role: argocd_app
      tags: [playout]
      vars:
        argocd_app: "{{ frikanalen_apps.playout }}"

    - role: argocd_app
      tags: [stream]
      vars:
        argocd_app: "{{ frikanalen_apps.stream }}"

    # Generates the archive key and provisions the file01 account; must precede
    # the ingest app, which reads the key back to roll the pod on rotation.
    - role: ingest_archive_account
      tags: [ingest, ingest_account]

    - role: ingest_api_secret
      tags: [ingest, ingest_app]
      vars:
        ingest_api_token: "{{ vault_prod_ingest_api_token }}"

    - role: argocd_app
      tags: [ingest, ingest_app]
      vars:
        argocd_app: "{{ frikanalen_apps.ingest }}"

    - role: media_server
      tags: [media_server]
