---
# What prod's apps need beyond their Argo CD Applications: database, the
# archive account, playout's live credential and the media server.
#
#   ansible-playbook playbooks/k8s_apps_prod.yml
#   ansible-playbook playbooks/k8s_apps_prod.yml --tags ingest
#
# The Applications themselves, with their versions and values, are no longer
# here: they are files in the clusters repo (clusters/prod/apps), synced by
# the "prod" root Application from k8s_platform_prod.yml. To release to prod,
# change the version in that repo.
- name: Deploy applications to the production cluster
  hosts: kubeprod_admin
  tags: [apps]
  vars:
    argocd_namespace: "argocd"
    cnpg_cluster_app_password: "{{ vault_prod_django_postgres_django_password }}"
    cnpg_cluster_superuser_password: "{{ vault_prod_django_postgres_super_password }}"
    # Backups to Garage on file01 (roles/garage), one bucket per environment.
    cnpg_cluster_backup_bucket: cnpg-prod
    cnpg_cluster_backup_s3_key_id: "{{ vault_prod_cnpg_s3_key_id }}"
    cnpg_cluster_backup_s3_secret_key: "{{ vault_prod_cnpg_s3_secret_key }}"
  roles:
    # django_db_secret and ingest_api_secret are gone from here: their
    # Secrets come from OpenBao (clusters/prod/secrets). cnpg_cluster,
    # ingest_archive_account and playout_live_secret skip or redirect their
    # Secret writes to OpenBao because app_secrets_from_openbao is on.

    # The CloudNativePG "pgcluster" Cluster Django runs on; see
    # roles/cnpg_cluster and docs/cnpg.md. Requires the cnpg operator from
    # playbooks/k8s_platform_prod.yml.
    - role: cnpg_cluster
      tags: [cnpg_cluster, database]

    # Issues playout's MediaMTX reader credential through Django and stores
    # it in OpenBao, from where ESO delivers it to playout.
    - role: playout_live_secret
      tags: [playout, playout_live]

    - role: ingest_archive_account
      tags: [ingest, ingest_account]

    - role: ingest_archive_mount
      tags: [ingest, ingest_app]

    - role: media_server
      tags: [media_server]
