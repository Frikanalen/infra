---
# Deploy Argo CD application definitions to production.
#
#   ansible-playbook playbooks/k8s_apps_prod.yml
#   ansible-playbook playbooks/k8s_apps_prod.yml --tags frontend
#
# Tags: apps (everything here), plus one per component. Versions come from
# app_versions in group_vars/prod.yml.
- name: Deploy applications to the production cluster
  hosts: prod
  tags: [apps]
  vars:
    argocd_django_db_super_password: "{{ vault_prod_django_postgres_super_password }}"
    argocd_django_db_replication_password: "{{ vault_prod_django_postgres_replication_password }}"
    argocd_django_db_django_password: "{{ vault_prod_django_postgres_django_password }}"
    argocd_ingest_api_token: "{{ vault_prod_ingest_api_token }}"
    argocd_namespace: "argocd"
    # Reuses the same credentials as the Kubegres django-postgres database
    # (see roles/cnpg_cluster) so a later cutover is just a DATABASE_URL
    # hostname change, not a credential rotation.
    cnpg_cluster_app_password: "{{ vault_prod_django_postgres_django_password }}"
    cnpg_cluster_superuser_password: "{{ vault_prod_django_postgres_super_password }}"
  roles:
    - role: argocd_django
      tags: [django]

    # Waits for ArgoCD to sync the Kubegres resource argocd_django just
    # declared, then patches on the backup config -- must follow
    # argocd_django directly, not just be somewhere after it. Selecting
    # either tag alone therefore does the wrong thing; use --tags database.
    - role: kubegres_backup
      tags: [django, kubegres_backup, database]

    # Stands up the CloudNativePG "pgcluster" Cluster as a migration target
    # alongside the existing Kubegres database. Data migration itself is
    # manual; see roles/cnpg_cluster. Requires the cnpg operator from
    # playbooks/k8s_platform_prod.yml -- which prod has not run yet.
    - role: cnpg_cluster
      tags: [cnpg_cluster, database]

    - role: argocd_frontend
      tags: [frontend]

    - role: argocd_graphics
      tags: [graphics]

    - role: argocd_schedule
      tags: [schedule]

    - role: argocd_playout
      tags: [playout]

    - role: argocd_stream
      tags: [stream]

    # Generates the archive key and provisions the file01 account; must precede
    # argocd_ingest, which reads the key back to roll the pod on rotation.
    - role: ingest_archive_account
      tags: [ingest]

    - role: argocd_ingest
      tags: [ingest]

    - role: media_server
      tags: [media_server]
