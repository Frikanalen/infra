---
#
# Takes down the old host cron job on dev-kube-1 that refreshed the staging
# database from prod over kubectl port-forwards, and deletes the prod
# cluster-admin kubeconfig it kept there. The refresh itself now runs in
# Kubernetes: see roles/staging_db_sync/defaults/main.yml.
- name: Retire the host-based staging database refresh
  hosts: kubedev_admin
  become: true
  gather_facts: false
  roles:
    - staging_db_sync
