---
# Deploy Argo CD application definitions to staging.
#
#   ansible-playbook playbooks/k8s_apps_staging.yml
#   ansible-playbook playbooks/k8s_apps_staging.yml --tags frontend
#
# Tags: apps (everything here), plus one per component. Versions come from
# app_versions in group_vars/staging.yml.
- name: Deploy applications to the staging cluster
  hosts: kubedev_admin
  tags: [apps]
  vars:
    argocd_namespace: argocd
    # Reuses the same credentials as the Kubegres django-postgres database
    # (see roles/cnpg_cluster) so a later cutover is just a DATABASE_URL
    # hostname change, not a credential rotation.
    cnpg_cluster_app_password: "{{ vault_dev_django_postgres_django_password }}"
    cnpg_cluster_superuser_password: "{{ vault_dev_django_postgres_super_password }}"
    # Backups to Garage on file01 (roles/garage), one bucket per environment.
    cnpg_cluster_backup_bucket: cnpg-staging
    cnpg_cluster_backup_s3_key_id: "{{ vault_dev_cnpg_s3_key_id }}"
    cnpg_cluster_backup_s3_secret_key: "{{ vault_dev_cnpg_s3_secret_key }}"
  roles:
    - role: django_db_secret
      tags: [django]
      vars:
        django_db_secret_super_password: "{{ vault_dev_django_postgres_super_password }}"
        django_db_secret_replication_password: "{{ vault_dev_django_postgres_replication_password }}"
        django_db_secret_django_password: "{{ vault_dev_django_postgres_django_password }}"

    - role: argocd_app
      tags: [django]
      vars:
        argocd_app: "{{ frikanalen_apps.django }}"

    # Stands up the CloudNativePG "pgcluster" Cluster as a migration target
    # alongside the existing Kubegres database. Data migration itself is
    # manual; see roles/cnpg_cluster.
    - role: cnpg_cluster
      tags: [cnpg_cluster, database]

    - role: argocd_app
      tags: [frontend]
      vars:
        argocd_app: "{{ frikanalen_apps.frontend }}"

    - role: argocd_app
      tags: [graphics]
      vars:
        argocd_app: "{{ frikanalen_apps.graphics }}"

    # Issues playout's MediaMTX reader credential through Django and stores it
    # in the Secret playout reads; must follow the django app and precede
    # playout's, which rolls when the key changes.
    - role: playout_live_secret
      tags: [playout, playout_live]

    - role: argocd_app
      tags: [playout]
      vars:
        argocd_app: "{{ frikanalen_apps.playout }}"

    - role: argocd_app
      tags: [stream]
      vars:
        argocd_app: "{{ frikanalen_apps.stream }}"

    # Generates the archive key and provisions the file01 account; must precede
    # the ingest app, which reads the key back to roll the pod on rotation.
    - role: ingest_archive_account
      tags: [ingest, ingest_account]

    - role: ingest_archive_mount
      tags: [ingest, ingest_app]

    - role: ingest_api_secret
      tags: [ingest, ingest_app]
      vars:
        ingest_api_token: "{{ vault_dev_ingest_api_token }}"

    - role: argocd_app
      tags: [ingest, ingest_app]
      vars:
        argocd_app: "{{ frikanalen_apps.ingest }}"

    - role: media_server
      tags: [media_server]

    - role: argocd_app
      tags: [mediamtx]
      vars:
        argocd_app: "{{ frikanalen_apps.mediamtx }}"
