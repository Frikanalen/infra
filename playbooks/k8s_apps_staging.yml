---
# Deploy ArgoCD applications to staging
- hosts: staging
  tags: [argocd, apps]
  vars:
    argocd_django_db_super_password: "{{ vault_dev_django_postgres_super_password }}"
    argocd_django_db_replication_password: "{{ vault_dev_django_postgres_replication_password }}"
    argocd_django_db_django_password: "{{ vault_dev_django_postgres_django_password }}"
    argocd_ingest_api_username: "{{ vault_dev_ingest_api_username }}"
    argocd_ingest_api_password: "{{ vault_dev_ingest_api_password }}"
  roles:
    - argocd_django
    - argocd_frontend
    - argocd_graphics
    - argocd_schedule
    - argocd_playout
    - argocd_stream
    # Generates the archive key and provisions the file01 account; must precede
    # argocd_ingest, which reads the key back to roll the pod on rotation.
    - ingest_archive_account
    - argocd_ingest
