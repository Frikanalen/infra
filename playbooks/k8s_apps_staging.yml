---
# What staging's apps need beyond their Argo CD Applications: database,
# secrets the apps read, the archive account and the media server.
#
#   ansible-playbook playbooks/k8s_apps_staging.yml
#   ansible-playbook playbooks/k8s_apps_staging.yml --tags ingest
#
# The Applications themselves, with their versions and values, are no longer
# here: they are files in the clusters repo (clusters/staging/apps), synced
# by the "staging" root Application from k8s_platform_dev.yml. To change a
# staging app's version or values, edit that repo. The secret roles below go
# too, one by one, as External Secrets Operator takes each Secret over from
# OpenBao (docs/openbao.md).
- name: Deploy applications to the staging cluster
  hosts: kubedev_admin
  tags: [apps]
  vars:
    argocd_namespace: argocd
    # The same credentials the Kubegres django-postgres database had, which
    # roles/django_db_secret still puts in DATABASE_URL.
    cnpg_cluster_app_password: "{{ vault_dev_django_postgres_django_password }}"
    cnpg_cluster_superuser_password: "{{ vault_dev_django_postgres_super_password }}"
    # Backups to Garage on file01 (roles/garage), one bucket per environment.
    cnpg_cluster_backup_bucket: cnpg-staging
    cnpg_cluster_backup_s3_key_id: "{{ vault_dev_cnpg_s3_key_id }}"
    cnpg_cluster_backup_s3_secret_key: "{{ vault_dev_cnpg_s3_secret_key }}"
  roles:
    # django_db_secret and ingest_api_secret are gone from here: their
    # Secrets come from OpenBao (clusters/staging/secrets). cnpg_cluster,
    # ingest_archive_account and playout_live_secret skip or redirect their
    # Secret writes to OpenBao because app_secrets_from_openbao is on.

    # The CloudNativePG "pgcluster" Cluster Django runs on; see
    # roles/cnpg_cluster and docs/cnpg.md.
    - role: cnpg_cluster
      tags: [cnpg_cluster, database]

    # Issues playout's MediaMTX reader credential through Django and stores it
    # in the Secret playout reads; must follow the django app and precede
    # playout's, which rolls when the key changes.
    - role: playout_live_secret
      tags: [playout, playout_live]

    # Pulled live sources: Django's key for their addresses, created once,
    # and the credential MediaMTX's pull relay fetches them with. Both go to
    # OpenBao; clusters/staging/secrets delivers them.
    - role: pull_url_keys
      tags: [pull_sources, django]
    - role: pull_relay_secret
      tags: [pull_sources, mediamtx]

    # Generates the archive key and provisions the file01 account; must precede
    # the ingest app, which reads the key back to roll the pod on rotation.
    - role: ingest_archive_account
      tags: [ingest, ingest_account]

    - role: ingest_archive_mount
      tags: [ingest, ingest_app]

    - role: media_server
      tags: [media_server]
