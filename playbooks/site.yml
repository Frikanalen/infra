---
- name: Add users to system
  hosts: all
  become: true
  gather_facts: true
  roles:
    - users
  tags:
    - common
    - users
- name: Do common setup
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common
  tags: common
- name: Install VM guest packages
  hosts: qemu_guest
  become: true
  gather_facts: false
  roles:
    - qemu_guest
  tags:
    - common
    - qemu_guest
- name: Install node_exporter on the hosts outside the Kubernetes clusters
  # file01 and the Proxmox hypervisors. The kube nodes are excluded from the
  # inventory group on purpose -- kube-prometheus-stack already runs a
  # node-exporter DaemonSet on those. The Prometheus side of this is
  # roles/node_exporter_scrape, run by playbooks/k8s_cluster_dev.yml; an
  # exporter installed here is scraped by nothing until that has run.
  #
  # Its own play rather than another role on the "all" play above: the role
  # flushes handlers partway through, so that the ZFS collector's systemd
  # timer is enabled against units systemd has actually reloaded, and that
  # would flush other roles' handlers early if it shared a play with them.
  hosts: node_exporter_hosts
  become: true
  gather_facts: true
  roles:
    - node_exporter
  tags:
    - monitoring
    - node_exporter

- name: Configure DNS server
  hosts: util
  roles:
    - dns_server_install
    - dns_server_zones_static
    - dns_server_zones_dynamic
  tags: dns
- name: Point .229 public IP to util
  hosts: util
  roles:
    - util_wan
  tags:
    - network
    - firewall
- name: Mount local SSD on kube nodes
  hosts: microk8s
  become: true
  roles:
    - local_ssd_mount
  tags:
    - k8s
    - local_ssd
- name: Install microk8s on kube nodes
  hosts: microk8s
  become: true
  roles:
    - microk8s_install
    - microk8s_kubectl
  tags:
    - k8s
    - microk8s