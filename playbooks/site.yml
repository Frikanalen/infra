---
- name: Add users to system
  hosts: all
  become: true
  gather_facts: true
  roles:
    - users
  tags:
    - common
    - users
- name: Do common setup
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common
  tags: common
- name: Install VM guest packages
  hosts: qemu_guest
  become: true
  gather_facts: false
  roles:
    - qemu_guest
  tags:
    - common
    - qemu_guest
- name: Keep every host on one clock
  # roles/time_sync: chrony everywhere on Linux, PTP between the physical
  # hosts, ptp_kvm in the VMs, fixed ntpd servers on util1. Not tagged
  # common on purpose: roll it out with --tags time_sync --limit.
  hosts: time_servers:ptp_hosts:tx:qemu_guest:util
  become: true
  gather_facts: true
  roles:
    - time_sync
  tags:
    - time_sync

- name: Build the fixed igb driver for NIC timestamping
  # roles/igb_rx_ts_fix: DKMS igb with the upstream jumbo-frame timestamp fix,
  # and a report of whether the fix has reached mainline. Skips hosts without
  # igb ports. A host only loads it at its next reboot (or igb reload, which
  # drops both bond ports). Run it before time_sync on these hosts.
  hosts: ptp_hosts
  become: true
  gather_facts: true
  roles:
    - igb_rx_ts_fix
  tags:
    - igb_rx_ts_fix

- name: Install node_exporter on the hosts outside the Kubernetes clusters
  # file01 and the Proxmox hypervisors. The kube nodes are excluded from the
  # inventory group on purpose -- kube-prometheus-stack already runs a
  # node-exporter DaemonSet on those. The Prometheus side of this is
  # roles/node_exporter_scrape, run by playbooks/k8s_platform_prod.yml; an
  # exporter installed here is scraped by nothing until that has run.
  #
  # Its own play rather than another role on the "all" play above: the role
  # flushes handlers partway through, so that the ZFS collector's systemd
  # timer is enabled against units systemd has actually reloaded, and that
  # would flush other roles' handlers early if it shared a play with them.
  hosts: node_exporter_hosts
  become: true
  gather_facts: true
  roles:
    - node_exporter
  tags:
    - monitoring
    - node_exporter

- name: Ship the systemd journal to Loki on hosts outside the Kubernetes clusters
  # caspar1 and caspar-sw1 run CasparCG and friends as systemd services but
  # are not Kubernetes nodes, so roles/grafana_alloy's in-cluster DaemonSet
  # never sees them. This installs a native Alloy agent instead, pushing
  # over roles/loki's internal-only ingress rather than the gateway
  # Service's ClusterIP, which these hosts cannot route to.
  hosts: alloy_journal_hosts
  become: true
  gather_facts: true
  roles:
    - alloy_journal
  tags:
    - monitoring
    - logging
    - alloy_journal

- name: Configure DNS server
  hosts: util
  roles:
    - dns_server_install
    - dns_server_zones_static
    - dns_server_zones_dynamic
  tags: dns
- name: Point .229 public IP to util
  hosts: util
  roles:
    - util_wan
  tags:
    - network
    - firewall
- name: Trim the root filesystem weekly instead of online discard
  hosts: qemu_guest
  become: true
  gather_facts: true
  roles:
    - root_fs_trim
  tags:
    - root_fs_trim
- name: Give the prod kube nodes an address in the vision mixer's subnet
  # Prod only: the mixer is the one in the studio, and staging runs the
  # vision-mixer API against a mock.
  hosts: kubeprod
  become: true
  roles:
    - mixer_subnet_address
  tags:
    - k8s
    - mixer_subnet
- name: Mount local SSD on kube nodes
  hosts: microk8s
  become: true
  roles:
    - local_ssd_mount
  tags:
    - k8s
    - local_ssd
- name: Mount the media receiver disk on the kube nodes that have one
  hosts: microk8s
  become: true
  roles:
    - media_disk_mount
  tags:
    - k8s
    - media_disk
- name: Install microk8s on kube nodes
  hosts: microk8s
  become: true
  roles:
    - microk8s_install
    - microk8s_kubectl
  tags:
    - k8s
    - microk8s
