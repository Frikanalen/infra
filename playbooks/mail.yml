---
#
# Provisioning for the mail server (mail1): mailcow-dockerized for
# frikanalen.tv. Run after Terraform has created the VM and playbooks/site.yml
# has done the common setup:
#
#   ansible-playbook playbooks/mail.yml
#
# The public side is the prod ingress address: util1 forwards the mail ports
# (roles/util_fw_mail, playbooks/firewall.yml --tags mail) and the prod
# Traefik passes HTTPS through (playbooks/k8s_platform_prod.yml). Backups
# are taken at the Proxmox layer by playbooks/proxmox/backup_jobs.yml.
#
- name: Provision the mailcow mail server
  hosts: mail
  become: true
  gather_facts: true
  roles:
    - local_ssd_mount
    - mailcow
