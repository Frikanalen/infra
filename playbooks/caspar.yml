---
#
# Host-specific provisioning for caspar1 and any future CasparCG playout
# guests: everything here is particular to this class of host and has no
# reason to apply anywhere else, unlike playbooks/site.yml's shared roles.
#
# caspar_hw hosts (e.g. caspar1) use a passed-through NVIDIA GPU and
# Decklink card for output. caspar_sw hosts (e.g. caspar-sw1) are the
# alternative without a Decklink: casparcg's ffmpeg consumer streams UDP
# instead. They render with Mesa (llvmpipe) unless casparcg_gpu is
# "nvidia" (caspar-sw1 has the Tesla P4), which gets nvidia_driver.
- name: Provision hardware-accelerated CasparCG playout hosts
  hosts: caspar_hw
  become: true
  gather_facts: true
  roles:
    - nvidia_driver
    - blackmagic_desktopvideo
    - nfs_client
    - casparcg

- name: Provision streaming-output CasparCG playout hosts
  hosts: caspar_sw
  become: true
  gather_facts: true
  tasks:
    - name: Install the GPU driver, or Mesa where there is no GPU
      ansible.builtin.include_role:
        name: "{{ 'nvidia_driver' if casparcg_gpu | default('') == 'nvidia' else 'mesa_driver' }}"
    - name: Mount the media archive
      ansible.builtin.include_role:
        name: nfs_client
    - name: Install CasparCG
      ansible.builtin.include_role:
        name: casparcg
