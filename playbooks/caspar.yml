#
# Host-specific provisioning for caspar1 and any future CasparCG playout
# guests: everything here is particular to this class of host and has no
# reason to apply anywhere else, unlike playbooks/site.yml's shared roles.
#
# caspar_hw hosts (e.g. caspar1) use a passed-through NVIDIA GPU and
# Decklink card for output. caspar_sw hosts (e.g. caspar-sw1) are the
# software-only alternative: Mesa (llvmpipe) for OpenGL and casparcg's
# ffmpeg consumer streaming UDP instead, so they need neither GPU driver.
- name: Provision hardware-accelerated CasparCG playout hosts
  hosts: caspar_hw
  become: true
  gather_facts: true
  roles:
    - nvidia_driver
    - blackmagic_desktopvideo
    - nfs_client
    - casparcg

- name: Provision software-only CasparCG playout hosts
  hosts: caspar_sw
  become: true
  gather_facts: true
  roles:
    - mesa_driver
    - nfs_client
    - casparcg
