---
#
# Test-signal generators: small VMs with a Decklink passed through that put
# a moving test pattern on SDI, for checking routing, monitors and capture
# downstream without involving playout. See roles/decklink_test_pattern.
- name: Provision SDI test-signal hosts
  hosts: sdi_test
  become: true
  gather_facts: true
  roles:
    - blackmagic_desktopvideo
    - decklink_test_pattern

# ttxd, the teletext inserter, on sdi-test1's OUT 2 ("DeckLink Duo (2)").
# Runs after the test pattern, which sets the card's profile and unpacks
# the DeckLink SDK headers ttxd builds against. See roles/ttxd.
- name: Provision the teletext inserter
  hosts: sdi-test1
  become: true
  gather_facts: true
  roles:
    - ttxd
