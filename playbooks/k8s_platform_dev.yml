---
# Platform services on the kubedev cluster: ingress, DNS, monitoring,
# database operators and Argo CD. Split out of k8s_cluster_dev.yml, which
# now only forms the cluster -- these are the parts that get re-run.
#
# Every role carries a component tag, so one thing can be advanced alone:
#
#   ansible-playbook playbooks/k8s_platform_dev.yml
#   ansible-playbook playbooks/k8s_platform_dev.yml --tags traefik
#   ansible-playbook playbooks/k8s_platform_dev.yml --tags dns
#   ansible-playbook playbooks/k8s_platform_dev.yml --skip-tags monitoring

- name: Install platform services on the kubedev cluster
  hosts: kubedev_admin
  tags: [platform]
  vars:
    metallb_ingress_ip: "192.168.3.90/30"
    metallb_internal_ingress_ip: "{{ traefik_internal_loadbalancer_ip }}/32"
    metallb_extra_addresses: ["{{ mediamtx_loadbalancer_ip }}/32"]
    traefik_loadbalancer_ip: "192.168.3.90"
    traefik_internal_loadbalancer_ip: "{{ host_config['ingress-dev-internal'].ip_cidr.split('/')[0] }}"
    traefik_public_ip: "158.36.191.229"
    traefik_rfc2136_tsig_secret: "{{ vault_dns_tsig_secret }}"
    external_dns_default_target: "158.36.191.229"
  pre_tasks:
    - name: Refresh local Helm repository caches
      ansible.builtin.command: helm repo update
      changed_when: false
      become: true
      run_once: true
      tags: [always]

    - name: Keep public and internal ingress endpoints distinct
      ansible.builtin.assert:
        that:
          - traefik_internal_loadbalancer_ip != traefik_loadbalancer_ip
          - frikanalen_intern_ingress_class != frikanalen_public_ingress_class
      tags: [always]
  roles:
    # Prometheus Operator CRDs must exist before any role below that
    # conditionally creates a ServiceMonitor (metallb, traefik, argocd,
    # cnpg -- all gated on k8s_monitoring_enabled), so this runs first.
    # Its own Ingress objects reference frikanalen_intern_ingress_class/
    # frikanalen_intern_zone from group_vars rather than anything the
    # ingress/DNS roles below produce, so there's no dependency the other
    # way -- Grafana/Prometheus/Alertmanager just aren't reachable until
    # traefik and external-dns are up.
    - role: kube_prometheus_stack
      tags: [kube_prometheus_stack, monitoring]

    # Loki + Alloy for log aggregation. Runs after kube_prometheus_stack so
    # its Grafana datasource ConfigMap lands in an already-existing
    # namespace and Grafana's sidecar is up to pick it up.
    - role: loki
      tags: [loki, monitoring, logging]

    - role: grafana_alloy
      tags: [grafana_alloy, monitoring, logging]

    - role: metallb
      tags: [metallb, ingress]

    # Issues Traefik's certificates (roles/traefik, traefik_tls_mode) and the
    # Barman Cloud plugin's mTLS certificates (roles/cnpg), so it goes before
    # both.
    - role: cert_manager
      tags: [cert_manager, traefik, ingress, cnpg, database]

    - role: traefik
      tags: [traefik, ingress]
      vars:
        traefik_tls_mode: cert-manager
        traefik_tls_dns_names: ["{{ frikanalen_domain }}", "www.{{ frikanalen_domain }}"]

    - role: traefik
      tags: [traefik, ingress, internal_ingress]
      vars:
        traefik_release_name: traefik-internal
        traefik_namespace: traefik-internal
        traefik_tls_mode: cert-manager
        traefik_tls_dns_names: ["*.{{ frikanalen_intern_zone }}"]
        traefik_ingress_class: "{{ frikanalen_intern_ingress_class }}"
        traefik_loadbalancer_ip: "{{ traefik_internal_loadbalancer_ip }}"
        traefik_manage_ingress_class: false
        traefik_manage_www_redirect: false
        traefik_enable_crd_provider: true
        traefik_skip_crds: true
        traefik_dashboard_ingressroute_enabled: true
        traefik_dashboard_host: "traefik.{{ frikanalen_intern_zone }}"

    - role: external_dns
      tags: [external_dns, dns]

    # Second external-dns instance: watches ingressClassName: internal and
    # writes to intern.dev.frikanalen.tv instead of staging.frikanalen.tv,
    # targeting the separate internal Traefik IP. Reuses
    # staging-update-key (role default), which
    # roles/dns_server_zones_dynamic also authorizes on this zone.
    - role: external_dns
      tags: [external_dns, dns, internal_dns]
      vars:
        external_dns_release_name: external-dns-internal
        external_dns_domain_filter: "{{ frikanalen_intern_zone }}"
        external_dns_ingress_class: "{{ frikanalen_intern_ingress_class }}"
        external_dns_default_target: "{{ traefik_internal_loadbalancer_ip }}"
        external_dns_rfc2136_zone: "{{ frikanalen_intern_zone }}"
        external_dns_rfc2136_tsig_keyname: "{{ frikanalen_intern_tsig_keyname }}"
        external_dns_txt_owner_id: "{{ frikanalen_intern_owner_id }}"
        external_dns_manage_ingress_class: true
        external_dns_sources: [ingress, traefik-proxy]

    # Scrapes fksw, the switch the whole 192.168.3.0/24 estate hangs off, and
    # hands it to the Prometheus above. Needs a login user on the switch that
    # only a human can configure -- see roles/junos_exporter/README.md.
    - role: junos_exporter
      tags: [junos_exporter, monitoring]

    # Scrapes the secondary Cisco D9036, the encoder between playout and the
    # transport stream. Needs the appliance's automation password in the
    # vault -- see roles/d9036_exporter/README.md.
    - role: d9036_exporter
      tags: [d9036_exporter, monitoring]

    # Scrapes the node_exporters that playbooks/site.yml installs on file01
    # and the Proxmox hypervisors -- hosts this cluster does not run and
    # cannot discover, so their addresses are written out as a selectorless
    # Service's Endpoints. Also ships their dashboards and alerting rules,
    # including the ZFS ones for the media archive on file01.
    - role: node_exporter_scrape
      tags: [node_exporter, monitoring]

    # CloudNativePG operator, for roles/cnpg_cluster's pgcluster; see
    # playbooks/k8s_apps_staging.yml.
    - role: cnpg
      tags: [cnpg, database]

    - role: argocd
      tags: [argocd]

    # rook-ceph and local-path-provisioner used to have an app-of-apps each
    # here, over the old apps/rook-ceph and apps/local-path-provisioner. On
    # staging they are now files under clusters/staging/platform, synced by
    # the "staging" root Application at the end of this play. The old parent
    # Applications are removed alongside it; they carry no finalizer, so
    # removing them leaves their child Applications running for the root to
    # adopt. Prod keeps its own app-of-apps (k8s_platform_prod.yml).

    # Rook's connection to the Proxmox Ceph cluster (playbooks/proxmox/ceph.yml):
    # CephX users, keys, mon endpoints and the ceph-rbd StorageClass.
    - role: rook_ceph_external
      tags: [rook_ceph_external]

    - role: argocd_image_updater
      tags: [argocd_image_updater]

    # OpenBao (bao1, playbooks/openbao.yml) and the operator that copies
    # this cluster's secrets out of it; see docs/openbao.md. Needs
    # playbooks/openbao.yml to have run, with the root token in the vault.
    - role: openbao_k8s_auth
      tags: [openbao, external_secrets]

    - role: external_secrets
      tags: [openbao, external_secrets]

    - role: reloader
      tags: [reloader]

    # The root of everything Argo CD runs on staging: clusters/staging in the
    # clusters repo (Frikanalen/clusters) -- every app with its
    # version and values, and every ExternalSecret. Replaces the argocd_app
    # roles k8s_apps_staging.yml used to run. Last, because its
    # ExternalSecrets need the operator above, and seed OpenBao first
    # (playbooks/openbao_seed.yml); see docs/openbao.md.
    - role: argocd_gitops
      tags: [argocd_gitops, clusters_root]
      vars:
        argocd_gitops_application_name: staging
        argocd_gitops_repo_path: clusters/staging
        argocd_gitops_recurse: true
        argocd_gitops_ignore_image_updater: true

  post_tasks:
    - name: Remove staging's old rook-ceph and local-path-provisioner app-of-apps
      # Only once the root exists, so the child Applications always have a
      # parent that wants them. Orphan deletion: the children stay.
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: absent
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
        name: "{{ item }}"
        delete_options:
          propagationPolicy: Orphan
      loop: [rook-ceph, local-path-provisioner]
      become: true
      run_once: true
      tags: [argocd_gitops, clusters_root]
