apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx
  labels:
    app: mediamtx
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]
    authMethod: http
    authHTTPAddress: {{ required "authURL must point to Django's MediaMTX callback" .Values.authURL | quote }}
    authHTTPExclude: []
    api: false
    metrics: false
    pprof: false
    playback: false
    rtsp: true
    rtspAddress: :8554
    rtspTransports: [tcp]
    rtmp: true
    rtmpAddress: :1935
    hls: false
    webrtc: {{ .Values.webrtc.enabled }}
{{- if .Values.webrtc.enabled }}
    webrtcAddress: 127.0.0.1:8889
    webrtcEncryption: false
    webrtcAllowOrigins: [{{ printf "https://%s" (required "webrtc.hostname must be configured" .Values.webrtc.hostname) | quote }}]
    webrtcLocalUDPAddress: :8189
    webrtcLocalTCPAddress: :8189
    webrtcIPsFromInterfaces: false
    webrtcAdditionalHosts: {{ required "webrtc.additionalHosts must contain a reachable public address" .Values.webrtc.additionalHosts | toJson }}
{{- end }}
    moq: false
    srt: true
    srtAddress: :8890
    pathDefaults:
      source: publisher
      overridePublisher: false
      record: false
      # Regex paths support authenticated ingest; fallback requires an
      # explicit per-source path supplied by the future controller.
      alwaysAvailable: false
      alwaysAvailableTracks:
        - codec: H264
        - codec: MPEG4Audio
          sampleRate: 48000
          channelCount: 2
    paths:
{{ toYaml .Values.paths | indent 6 }}

{{- if .Values.webrtc.enabled }}
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {}
    http {
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        location {{ .Values.webrtc.path }}/ {
          proxy_pass http://127.0.0.1:8889/;
          proxy_redirect / {{ .Values.webrtc.path }}/;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location / { return 404; }
      }
    }
{{- end }}
