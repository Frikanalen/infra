apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  labels:
    app: mediamtx
spec:
  type: LoadBalancer
  loadBalancerIP: {{ required "service.loadBalancerIP must be reserved for MediaMTX" .Values.service.loadBalancerIP | quote }}
  externalTrafficPolicy: Local
  selector:
    app: mediamtx
  ports:
    - name: srt
      port: 8890
      targetPort: srt
      protocol: UDP
    # LAN-only: public firewall forwarding opens SRT, not RTSP.
    - name: rtsp
      port: 8554
      targetPort: rtsp
      protocol: TCP
