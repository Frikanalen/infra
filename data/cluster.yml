---
# Cluster-wide capability flags. Loaded for every host via the
# group_vars/all -> ../data symlink.

# Does this cluster have a Prometheus Operator?
#
# Several roles here install a component *and* wire it into monitoring:
# Traefik, MetalLB, Argo CD and CloudNativePG all render a ServiceMonitor or
# PodMonitor from their chart, and roles/argocd_django creates one directly.
# Those are monitoring.coreos.com CRDs, which only exist where
# roles/kube_prometheus_stack has run -- the dev cluster. On a cluster
# without it the API server rejects the kind and the whole Helm release
# fails, so installing Traefik would require a Prometheus Operator, which is
# backwards.
#
# False here, true in group_vars/staging.yml. Set it true on any cluster
# that gains kube_prometheus_stack. It also gates the Grafana dashboard
# ConfigMaps, which are inert without a Grafana to read them.
k8s_monitoring_enabled: false

# Where roles that talk to the cluster find their credentials. One definition
# rather than the eleven that used to carry this literal path around: it was
# called argocd_kubeconfig, and five of the roles reading it -- cnpg_cluster,
# ingest_archive_account, junos_exporter, kubegres_backup, media_server --
# have nothing to do with Argo CD.
k8s_kubeconfig: /var/snap/microk8s/current/credentials/client.config
