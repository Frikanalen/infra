  vmtx1:
    ip_cidr: "192.168.3.77/24"
    vmid_suffix: 5
    pci_mappings:
      - id: blackmagic-decklink-sdi4k
        description: "Blackmagic Decklink SDI 4K on vmtx1"
        path: "0000:03:00.0"
        pci_id: "bdbd:a138"
        subsystem_id: "bdbd:a138"
        # Renumbered from 26 when a DeckLink Duo 2 went into vmtx1
        # (2026-10-30); Proxmox refuses to start a VM whose mapping's
        # group no longer matches.
        iommu_group: 32
      - id: nvidia-gt1030
        description: "NVIDIA GeForce GT 1030 on vmtx1"
        path: "0000:04:00"
        pci_id: "10de:1d01"
        subsystem_id: "1043:8621"
