---
host_config:
  prod-kube-1:
    ip_cidr: "192.168.3.74/24"
    vm:
      memory_min: 16384
      memory_max: 32768
      cores: 24
      vmid: 210
      node: vm2
      root_disk_size: 60G
      local_ssd_size: 90G

  prod-kube-2:
    ip_cidr: "192.168.3.75/24"
    vm:
      memory_min: 16384
      memory_max: 32768
      cores: 24
      vmid: 211
      node: vm3
      root_disk_size: 60G
      local_ssd_size: 90G

  prod-kube-3:
    ip_cidr: "192.168.3.76/24"
    vm:
      memory_min: 16384
      memory_max: 32768
      cores: 24
      vmid: 212
      node: vm4
      root_disk_size: 60G
      local_ssd_size: 90G

  # Mirrors dev-kube-4 (same host and memory) and takes over its Intel Arc
  # A310, so prod ingest can encode on Quick Sync. No ceph disk, like
  # dev-kube-4: it holds no OSD. disk_cache stays at the safe default here,
  # unlike dev-kube-4's "unsafe". 12 cores rather than dev-kube-4's 20:
  # vmtx1 has 32 threads and also runs caspar1's live playout, and 12 still
  # fits the stream transcoder's limit should it land here.
  prod-kube-4:
    ip_cidr: "192.168.3.78/24"
    vm:
      memory_min: 8192
      memory_max: 65536
      cores: 12
      vmid: 213
      node: vmtx1
      storage: local-lvm
      # On vmtx1's HDD array; holds ingest's upload volume (local-ssd).
      local_ssd_size: 600G
      pci_mappings:
        - "intel-arc-a310"

  dev-kube-1:
    ip_cidr: "192.168.3.40/24"
    vm:
      memory_min: 8192
      memory_max: 24576
      cores: 8
      vmid: 310
      node: vm2
      disk_cache: "unsafe"
      # Boot disk on the host's HDD thin pool: localssd-lvm has room to
      # grow only the prod roots.
      storage: local-lvm
      cloudinit_storage: localssd-lvm
      root_disk_size: 60G
      local_ssd_size: 30G

  dev-kube-2:
    ip_cidr: "192.168.3.41/24"
    vm:
      memory_min: 8192
      memory_max: 24576
      cores: 8
      vmid: 311
      node: vm3
      disk_cache: "unsafe"
      # Boot disk on the host's HDD thin pool: localssd-lvm has room to
      # grow only the prod roots.
      storage: local-lvm
      cloudinit_storage: localssd-lvm
      root_disk_size: 60G
      local_ssd_size: 30G

  dev-kube-3:
    ip_cidr: "192.168.3.42/24"
    vm:
      memory_min: 8192
      memory_max: 24576
      cores: 8
      vmid: 312
      node: vm4
      disk_cache: "unsafe"
      # Boot disk on the host's HDD thin pool: localssd-lvm has room to
      # grow only the prod roots.
      storage: local-lvm
      cloudinit_storage: localssd-lvm
      root_disk_size: 60G
      local_ssd_size: 30G

  dev-kube-4:
    ip_cidr: "192.168.3.43/24"
    vm:
      memory_min: 8192
      memory_max: 65536
      cores: 20
      vmid: 314
      node: vmtx1
      # Boot disk on the HDD RAID10 (moved 2026-11-12): vmtx1's local-lvm is
      # a 102G thin pool on the SSD mirror and was overcommitted ~2x.
      storage: localssd-lvm
      cloudinit_storage: local-lvm
      root_disk_size: 60G
      # Holds ingest's upload volume (local-ssd).
      local_ssd_size: 150G
      disk_cache: "unsafe"

  caspar1:
    ip_cidr: "192.168.3.100/24"
    vm:
      vmid: 402
      node: vmtx1
      template: ubuntu-24.04-cloud
      storage: local-lvm
      pci_mappings:
        - "blackmagic-decklink-sdi4k"
        - "nvidia-gt1030"

  caspar-sw1:
    ip_cidr: "192.168.3.101/24"
    vm:
      vmid: 403
      node: vmtx1
      template: ubuntu-24.04-cloud
      # Boot disk on the HDD RAID10 (moved 2026-11-12), see dev-kube-4.
      storage: localssd-lvm
      cloudinit_storage: local-lvm
      # Moved from dev-kube-4 (group_vars/proxmox.yml defines the mapping):
      # without a GPU, CasparCG's OpenGL mixer took ~5.6 of 8 cores in
      # llvmpipe and program out broke up under a live 1080p source.
      pci_mappings:
        - "nvidia-tesla-p4"

  # Mail server for frikanalen.tv (mailcow). A VM rather than a cluster
  # workload: mailcow is its own docker-compose stack of ~15 containers and
  # wants a fixed public address whose PTR, MX and SPF all agree, which
  # util1 gives it by 1:1 NAT (roles/util_fw_mail). The data disk (scsi2,
  # backed up) holds /var/lib/docker, where every mailbox, the database and
  # the rspamd state live; roles/local_ssd_mount mounts it there by serial
  # (see host_vars/mail1.yml). Backed up nightly at the Proxmox layer by
  # playbooks/proxmox/backup_jobs.yml.
  mail1:
    ip_cidr: "192.168.3.110/24"
    vm:
      vmid: 501
      node: vm1
      cores: 4
      memory_min: 8192
      memory_max: 8192
      # vm1's localssd-lvm had only 77G free (2026-11-08), enough for the
      # 40G root disk but not the data disk, which goes on the thin pool.
      local_ssd_size: 150G
      local_ssd_storage: local-lvm

  # OpenBao, the secrets store for both clusters and for Ansible
  # (roles/openbao, playbooks/openbao.yml, docs/openbao.md). A VM outside the
  # clusters on purpose: a secrets store inside the cluster it serves cannot
  # start before that cluster, and is lost with it. Unseals itself at boot
  # from a static key held in the Ansible vault. Deliberately left out of
  # the Proxmox backup jobs, so no backup ever holds that key next to the
  # data; it is backed up instead by nightly raft snapshots to Garage on
  # file01, which are useless without the key.
  bao1:
    ip_cidr: "192.168.3.111/24"
    vm:
      vmid: 502
      node: vm1
      cores: 2
      memory_min: 2048
      memory_max: 2048
      # vm1's localssd-lvm had only ~34G free (2026-11-11), less than the
      # 40G root disk, so the root disk goes on the thin pool.
      storage: local-lvm

  billedmiks:
    # This is the ATEM video mixer.
    ip_cidr: "10.3.2.1/8"

  simula:
    ip_cidr: "192.168.3.1/24"

