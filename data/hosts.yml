    # untagged. Same physical BMC as tx3-ipmi, separate management channel.
    ip_cidr: "192.168.3.137/24"

  tx1:
    ip_cidr: "192.168.3.33/24"

  tx2:
    ip_cidr: "192.168.3.34/24"

  tx3:
    ip_cidr: "192.168.3.35/24"

  tx4:
    ip_cidr: "192.168.3.36/24"

  dev:
    ip_cidr: "192.168.3.50/24"

  file01:
    ip_cidr: "192.168.3.59/24"

  simula-ipmi:
    ip_cidr: "192.168.3.61/24"

  vm1:
    ip_cidr: "192.168.3.70/24"
