---
# Shared ArgoCD/Kubernetes infrastructure settings
argocd_namespace: argocd
argocd_kubeconfig: /var/snap/microk8s/current/credentials/client.config
argocd_default_app_namespace: default

# Shared settings
timezone_region: Europe/Oslo
timezone_path: "/usr/share/zoneinfo/{{ timezone_region }}"
default_ingress_class: public

# Database defaults (can be overridden per-environment)
django_db_user: fkweb
django_db_name: fkweb
django_db_port: "5432"

# Where tusd is served on the main site. Shared because two roles must agree:
# argocd_ingest routes this path to tusd, and argocd_django advertises it to
# the frontend as a video's uploadUrl.
ingest_upload_path: /upload
