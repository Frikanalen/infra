---
# Shared ArgoCD/Kubernetes infrastructure settings
argocd_namespace: argocd
argocd_default_app_namespace: default

# Shared settings
timezone_region: Europe/Oslo
timezone_path: "/usr/share/zoneinfo/{{ timezone_region }}"
default_ingress_class: public

# Database defaults (can be overridden per-environment)
django_db_user: fkweb
django_db_name: fkweb
django_db_port: "5432"

# Where the media archive is served on the main site: media_server routes
# this path to the archive's HTTP file server. Django's FK_MEDIA_URLPREFIX
# (clusters repo, clusters/<env>/apps/django.yaml) must agree.
ingest_media_path: /media
