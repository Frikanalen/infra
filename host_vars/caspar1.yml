---
# caspar1 is prod's playout box since 2026-10-31, taking over from tx3
# (CASPAR_HOST in the clusters repo, clusters/prod/apps/playout.yaml). It
# keeps the DeckLink SDI out for the encoder appliance and also sends program
# out as a mezzanine to multicast 239.1.1.51:5004, like caspar-sw1 does for
# staging on 239.1.1.50 (host_vars/caspar-sw1.yml). Prod's cubemap joins it
# (clusters/prod/apps/stream.yaml).
casparcg_consumers: ["decklink", "ffmpeg"]
casparcg_ffmpeg_path: "udp://239.1.1.51:5004"

# H.264 in software: the GT 1030 (GP108) renders the mixer but has no NVENC,
# so caspar-sw1's h264_nvenc args would fail here. This is a mezzanine that
# gets encoded again for streaming, so it spends LAN bandwidth on quality
# instead of latency: ~20 Mbit/s, lookahead and B-frames (no zerolatency
# tune), 4:2:2 so graphics edges keep their chroma. A keyframe a second
# keeps joining quick. See roles/casparcg/defaults/main.yml for why each
# option needs its stream specifier. The format filter is required either
# way: without it libx264 takes the mixer's 4:4:4 frames as-is.
casparcg_ffmpeg_args: >-
  -format mpegts -codec:v libx264 -preset:v veryfast
  -filter:v format=yuv422p
  -b:v 20M -maxrate:v 25M -bufsize:v 10M -g:v 50 -bf:v 2
  -codec:a mp2 -b:a 256k -filter:a aformat=channel_layouts=stereo

# Restart CasparCG when SDI audio jams while the multicast still has audio
# (roles/caspar_sdi_audio_watchdog). Acting, not dry run, at the owner's
# request on 2026-11-17.
caspar_sdi_audio_watchdog_dry_run: false
# Air check and SDI meter from atemkontroll (roles/caspar_sdi_audio_watchdog).
# caspar1 is the ATEM input named "caspar1" (short name VM1), input 1.
caspar_sdi_audio_watchdog_atem_url: "https://atemkontroll.intern.frikanalen.tv"
caspar_sdi_audio_watchdog_atem_input_name: caspar1

# DeckLink buffer depth 8 instead of 3 (the consumer adds 2 for normal latency
# and embedded audio: 10 frames instead of 5, about 100 ms more output
# latency). CasparCG 2.5 never tops up the card's audio lead, which loses a
# frame at a time until the embedder goes silent (probe data 19-23 Nov:
# ~50 min median from a restart to under one frame). A deeper buffer starts
# with a bigger lead, so a jam comes later; it doesn't stop the drift.
casparcg_decklink_buffer_depth: 8
