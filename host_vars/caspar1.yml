---
# caspar1 is meant to take over prod playout from tx3 (caspar_host in
# group_vars/prod.yml still points at tx3 until the cutover). It keeps the
# DeckLink SDI out for the encoder appliance and also sends program out as
# a mezzanine to multicast 239.1.1.51:5004, like caspar-sw1 does for staging
# on 239.1.1.50 (host_vars/caspar-sw1.yml). Nothing joins it yet.
casparcg_consumers: ["decklink", "ffmpeg"]
casparcg_ffmpeg_path: "udp://239.1.1.51:5004"

# H.264 in software: the GT 1030 (GP108) renders the mixer but has no NVENC,
# so caspar-sw1's h264_nvenc args would fail here. This is a mezzanine that
# gets encoded again for streaming, so it spends LAN bandwidth on quality
# instead of latency: ~20 Mbit/s, lookahead and B-frames (no zerolatency
# tune), 4:2:2 so graphics edges keep their chroma. A keyframe a second
# keeps joining quick. See roles/casparcg/defaults/main.yml for why each
# option needs its stream specifier. The format filter is required either
# way: without it libx264 takes the mixer's 4:4:4 frames as-is.
casparcg_ffmpeg_args: >-
  -format mpegts -codec:v libx264 -preset:v faster
  -filter:v format=yuv422p
  -b:v 20M -maxrate:v 25M -bufsize:v 10M -g:v 50 -bf:v 2
  -codec:a mp2 -b:a 256k -filter:a aformat=channel_layouts=stereo
