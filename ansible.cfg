[defaults]
inventory = inventory.yaml
vault_password_file = ~/.vault_pass_frikanalen
roles_path = roles
# ansible-lint resolves collections from its own ANSIBLE_HOME override and
# finds requirements.yml's collections fine, but plain ansible-playbook (the
# syntax-check CI step) falls back to ~/.ansible/collections and can't
# resolve kubernetes.core, ansible.posix, etc. Pin the path explicitly so
# both tools agree with where `ansible-galaxy collection install -p
# .ansible/collections` puts them.
collections_path = ./.ansible/collections

host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

remote_user = ansible
private_key_file = ~/.ssh/frikanalen_ansible
