---
- name: Find Alertmanager's service address
  ansible.builtin.command:
    argv:
      - "{{ alert_silence_microk8s }}"
      - kubectl
      - -n
      - monitoring
      - get
      - service
      - kube-prometheus-stack-alertmanager
      - -o
      - jsonpath={.spec.clusterIP}
  delegate_to: "{{ alert_silence_admin_node }}"
  become: true
  register: alert_silence_service
  changed_when: false
  failed_when: false
  when: k8s_monitoring_enabled | default(true) | bool

# POSTed from the admin node straight to the service: `kubectl create --raw`
# through the API proxy sends application/octet-stream, which Alertmanager
# refuses with 415.
- name: Silence the alerts this work is expected to trigger
  ansible.builtin.uri:
    url: "http://{{ alert_silence_service.stdout }}:9093/api/v2/silences"
    method: POST
    body_format: json
    body: "{{ alert_silence_payload }}"
    status_code: 200
  vars:
    alert_silence_payload:
      matchers: >-
        {{ [{'name': 'environment', 'value': alert_silence_environment, 'isRegex': false, 'isEqual': true}]
           + (alert_silence_presets[alert_silence_preset] if alert_silence_preset else [])
           + alert_silence_matchers }}
      # now() is naive local time, so its timestamp() is the real epoch.
      startsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(second=now().timestamp() | int, utc=true) }}"
      endsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(second=(now().timestamp() | int) + (alert_silence_minutes | int) * 60, utc=true) }}"
      createdBy: "{{ alert_silence_created_by }}"
      comment: "{{ alert_silence_comment }}"
  delegate_to: "{{ alert_silence_admin_node }}"
  register: alert_silence_result
  changed_when: true
  # A silence is a courtesy to whoever reads the alerts; failing to set
  # one must not stop the work.
  failed_when: false
  when:
    - k8s_monitoring_enabled | default(true) | bool
    - alert_silence_service.stdout | default('') | length > 0

- name: Remember the silence so the play can lift it when the work is done
  ansible.builtin.set_fact:
    alert_silence_id: "{{ alert_silence_result.json.silenceID }}"
  when: alert_silence_result.json.silenceID is defined

- name: Say so when no silence could be set
  ansible.builtin.debug:
    msg: >-
      Could not silence alerts ({{ alert_silence_result.msg | default('skipped') }}).
      Carrying on; expect the usual alerts from this work.
  when: alert_silence_id is not defined
