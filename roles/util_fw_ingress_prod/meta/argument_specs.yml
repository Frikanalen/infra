---
argument_specs:
  main:
    short_description: pf redirects for the production cluster ingress
    # Unlike the dev equivalent, every value here has a default: production
    # addressing is fixed and lives in this role rather than in the playbook.
    options:
      prod_ingress_ext_ip:
        type: str
        required: false
        default: 158.36.191.231
        description: Public address traffic arrives on.
      prod_ingress_int_ip:
        type: str
        required: false
        default: 192.168.3.104
        description: >-
          Internal address of the cluster's web ingress -- Traefik's
          LoadBalancer IP (traefik_loadbalancer_ip in k8s_platform_prod.yml).
      prod_media_ext_ip:
        type: str
        required: false
        default: 158.36.191.231
        description: Public address the media server answers on.
      prod_media_ingress_int_ip:
        type: str
        required: false
        default: 192.168.3.105
        description: Internal address of the media server's ingress.
      prod_ingress_ext_netmask:
        type: str
        required: false
        default: 255.255.255.128
        description: >-
          Netmask for the public address. Currently unreferenced by the
          template; kept because the address it belongs to is.
      fw_int_if:
        type: str
        required: false
        default: vtnet0
        description: Internal interface on the utility host.
      fw_ext_if:
        type: str
        required: false
        default: vtnet1
        description: External interface on the utility host.
      fw_lan_net:
        type: str
        required: false
        default: 192.168.3.0/24
        description: Internal network, in CIDR form.
