---

# SOA timing, shared by every zone below.
dns_soa_serial: "{{ '%Y%m%d%H' | strftime }}"
dns_soa_refresh: 3600
dns_soa_retry: 900
dns_soa_expire: 604800
dns_soa_minimum: 86400

# TSIG keys available for RFC2136 updates. Keyed by name (not by zone) so a
# single key can be authorized on more than one zone -- see
# dns_dynamic_zones below, where intern.dev.frikanalen.no reuses
# staging-update-key rather than minting a key per zone. Defining the same
# key twice (once per zone that uses it) would make named.conf.d declare
# the same key name twice and fail to reload.
dns_dynamic_tsig_keys:
  - name: staging-update-key
    algorithm: hmac-sha256
    secret: "{{ vault_dns_tsig_secret }}"
  - name: prod-cluster-update-key
    algorithm: hmac-sha256
    secret: "{{ vault_prod_dns_tsig_secret }}"

# Dynamic (RFC2136-updatable) zones hosted on this nameserver.
#
# ns1_address is the nameserver's own glue A record and must always be the
# public IP -- Let's Encrypt and any external resolver need to reach this
# server on port 53 regardless of what the zone itself is used for.
#
# apex_address is the zone's root A record. For staging.frikanalen.no this
# is the same public ingress IP the zone's other records point at. For the
# intern.* zones it is deliberately the cluster's internal-only ingress IP:
# these zones exist so hosts under them resolve to VPN-reachable addresses,
# never the public one.
dns_dynamic_zones:
  - name: staging.frikanalen.no
    tsig_key_name: staging-update-key
    ns1_address: "158.36.191.229"
    apex_address: "158.36.191.229"

  - name: intern.frikanalen.no
    tsig_key_name: prod-cluster-update-key
    ns1_address: "158.36.191.229"
    apex_address: "192.168.3.104"

  - name: intern.dev.frikanalen.no
    tsig_key_name: staging-update-key
    ns1_address: "158.36.191.229"
    apex_address: "192.168.3.90"

# Paths are for BIND installed from pkg/ports on FreeBSD.
dns_zone_dir: "/usr/local/etc/namedb/master"
dns_named_conf_d: "/usr/local/etc/namedb/named.conf.d"
