---
# defaults for argocd_stream role

# Stream app settings
argocd_stream_app_name: stream
argocd_stream_namespace: "{{ frikanalen_app_namespace }}"
argocd_stream_repo_url: https://github.com/Frikanalen/live-stream-packager.git
argocd_stream_repo_path: "."

# Version - controls both repo revision and image tag
argocd_stream_version: "{{ app_versions.stream | default('main') }}"

# When true, ffmpeg reads from the in-cluster cubemap UDP reflector
# (fed by argocd_stream_cubemap_ip on the udp/5004 LoadBalancer). When
# false, cubemap is disabled entirely and ffmpeg pulls the feed directly
# from argocd_stream_input_source_url over HTTP instead.
argocd_stream_cubemap_enabled: true

# Only used when argocd_stream_cubemap_enabled is false. Defaults to the
# same URL as the chart's own ffmpeg.inputSourceUrl default.
argocd_stream_input_source_url: "http://192.168.3.1:9094/frikanalen.ts"

# Helm values - only overrides from chart defaults
argocd_stream_values:
  cubemap:
    enabled: "{{ argocd_stream_cubemap_enabled }}"
    loadBalancerIP: "{{ argocd_stream_cubemap_ip }}"
  ffmpeg:
    inputSourceUrl: "{{ argocd_stream_input_source_url }}"
  ingress:
    host: "{{ frikanalen_domain }}"
