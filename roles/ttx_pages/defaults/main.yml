---
# ttx-pages, the studio page generator for ttxd (generator/ in
# github.com/Frikanalen/teletext): renders the index page (100) from the
# programme schedule and keeps it up to date in ttxd. Plain Python 3.11+,
# standard library only, so it runs from a checkout with no build step.

ttx_pages_repo: https://github.com/Frikanalen/teletext.git
# Commit or tag to run. ab87a73 = teletext#4 (schedule URL fix).
ttx_pages_version: ab87a73
ttx_pages_src_dir: /usr/local/src/teletext-pages

ttx_pages_ttxd_url: "http://127.0.0.1:8080"
# Token of the ttxd publisher that owns the pages ("pages", 100-7FF).
ttx_pages_token: "{{ vault_ttxd_pages_token }}"
ttx_pages_api_url: https://frikanalen.tv/api
ttx_pages_poll_secs: 30
ttx_pages_refresh_secs: 120
ttx_pages_ttl_secs: 600

ttx_pages_index_page: "100"
ttx_pages_index_tagline: Frivillige organisasjoners TV-kanal
ttx_pages_index_footer: frikanalen.tv
# Listed on the index while ttxd is sending the page, or always with always: true.
ttx_pages_index_entries:
  - { page: "200", title: Sendeplan }
  - { page: "888", title: Teksting, always: true }
