---
- name: Install NFS client package
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: yes
  become: true

- name: Ensure NFS mount points exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ nfs_client_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Mount NFS shares
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs4
    opts: "{{ item.opts | default(nfs_client_default_opts) }}"
    state: mounted
  loop: "{{ nfs_client_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
