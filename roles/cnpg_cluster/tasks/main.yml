---
- name: Ensure namespace exists
  become: true
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ cnpg_cluster_namespace }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Create app user secret
  # Delivered from OpenBao by External Secrets Operator where that is on.
  when: not (app_secrets_from_openbao | default(false) | bool)
  become: true
  no_log: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'app-secret.yml.j2') }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Create superuser secret
  # Delivered from OpenBao by External Secrets Operator where that is on.
  when: not (app_secrets_from_openbao | default(false) | bool)
  become: true
  no_log: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'superuser-secret.yml.j2') }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Create backup object store credentials
  when:
    - cnpg_cluster_backup_enabled
    - not (app_secrets_from_openbao | default(false) | bool)
  become: true
  no_log: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'backup-s3-secret.yml.j2') }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Define the backup ObjectStore
  when: cnpg_cluster_backup_enabled
  become: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'object-store.yml.j2') }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Deploy CloudNativePG Cluster
  # After the ObjectStore it archives WAL to.
  become: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'cluster.yml.j2') }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Schedule a daily base backup
  when: cnpg_cluster_backup_enabled
  become: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'scheduled-backup.yml.j2') }}"
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Alert on the database losing its primary, a replica, WAL archiving or backups
  when: k8s_monitoring_enabled | default(false) | bool
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'prometheusrule.yml.j2') }}"
  become: true
  run_once: true
