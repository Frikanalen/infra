---
argument_specs:
  main:
    short_description: Install Docker and mailcow-dockerized, and start the stack
    options:
      mailcow_dir:
        type: str
        required: false
        default: /opt/mailcow-dockerized
        description: Where the mailcow checkout and mailcow.conf live.
      mailcow_repo:
        type: str
        required: false
        default: https://github.com/mailcow/mailcow-dockerized
        description: Git URL of mailcow-dockerized.
      mailcow_branch:
        type: str
        required: false
        default: master
        description: >-
          Branch for the first clone and for generate_config.sh. Later
          upgrades go through mailcow's own update.sh, not this role.
      mailcow_hostname:
        type: str
        required: false
        default: mail.frikanalen.tv
        description: >-
          The server's FQDN (not the mail domain): what MX points at, what
          the PTR record names, and what mailcow requests a certificate for.
      mailcow_tz:
        type: str
        required: false
        default: Europe/Oslo
        description: Time zone written to mailcow.conf.
      mailcow_relayhost:
        type: str
        required: false
        default: ""
        description: >-
          Hostname of an SMTP relay all outbound mail from
          mailcow_relayhost_domains is sent through. Empty disables the relay
          and mailcow delivers directly.
      mailcow_relayhost_port:
        type: int
        required: false
        default: 587
        description: Relay port (587 STARTTLS, or 465 implicit TLS).
      mailcow_relayhost_username:
        type: str
        required: false
        default: ""
        description: SASL username at the relay.
      mailcow_relayhost_password:
        type: str
        required: false
        default: ""
        no_log: true
        description: SASL password at the relay; keep it in data/vault.yml.
      mailcow_relayhost_domains:
        type: list
        elements: str
        required: false
        default: [frikanalen.tv]
        description: Mailcow domains whose outbound mail goes through the relay.
