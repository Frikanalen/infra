---
- name: Install resolv.conf
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: "0644"
    content: |
      search dc1.frikanalen.tv frikanalen.tv
      nameserver 192.168.3.2
      nameserver 129.240.2.3
      nameserver 129.240.2.27

# Debian-specific tasks
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install zsh
  ansible.builtin.apt:
    name: zsh
  when: ansible_os_family == "Debian"

# The nginx2root chain (CVE-2026-123007 and others, 2026-11-18) ends in a
# Linux SCTP use-after-free for root, with no kernel fix yet. Nothing here
# speaks SCTP (SRT, RTMP, RTSP, corosync and Ceph are TCP/UDP), so stop the
# module from loading at all. Unprivileged code can otherwise autoload it by
# opening an SCTP socket.
- name: Block the SCTP kernel module
  ansible.builtin.copy:
    dest: /etc/modprobe.d/disable-sctp.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/common). See roles/common/tasks/main.yml.
      install sctp /bin/false
  when: ansible_system == "Linux"
  tags: sctp

- name: Unload SCTP if it is already loaded
  community.general.modprobe:
    name: sctp
    state: absent
  when: ansible_system == "Linux"
  tags: sctp

# FreeBSD-specific tasks
- name: Ensure sudo group exists
  become: true
  ansible.builtin.group:
    name: sudo
    state: present
  when: ansible_os_family == "FreeBSD"

- name: Ensure bash is installed
  become: true
  community.general.pkgng:
    name: bash
    state: present
  when: ansible_os_family == "FreeBSD"

- name: Link bash to /bin/bash
  become: true
  ansible.builtin.file:
    src: /usr/local/bin/bash
    dest: /bin/bash
    owner: root
    group: wheel
    mode: "0755"
    state: link
    force: true
    follow: false
  when: ansible_os_family == "FreeBSD"

- name: Ensure zsh is installed
  become: true
  community.general.pkgng:
    name: zsh
    state: present
  when: ansible_os_family == "FreeBSD"

- name: Link zsh to /bin/zsh
  become: true
  ansible.builtin.file:
    src: /usr/local/bin/zsh
    dest: /bin/zsh
    owner: root
    group: wheel
    mode: "0755"
    state: link
    force: true
    follow: false
  when: ansible_os_family == "FreeBSD"
