---
- name: Ensure casparcg user exists
  ansible.builtin.user:
    name: "{{ casparcg_user }}"
    shell: /usr/sbin/nologin
    system: true
  become: true

- name: Install nodm package
  ansible.builtin.apt:
    name: nodm
    state: present
    update_cache: true
  become: true

- name: Create the directory for locally built packages
  ansible.builtin.file:
    path: /var/local/casparcg-debs
    state: directory
    mode: "0755"
  become: true
  when: casparcg_server_deb_src | length > 0 or casparcg_patched_debs | length > 0

- name: Install CasparCG CEF package from URL
  ansible.builtin.apt:
    deb: "{{ casparcg_cef_url }}"
    state: present
    update_cache: false
    install_recommends: false
  become: true

- name: Install CasparCG Server package from URL
  ansible.builtin.apt:
    deb: "{{ casparcg_server_url }}"
    state: present
    update_cache: false
    install_recommends: false
    allow_downgrade: true
  become: true
  when: not casparcg_server_deb_src

- name: Copy the locally built CasparCG Server package
  ansible.builtin.copy:
    src: "{{ casparcg_server_deb_src }}"
    dest: "/var/local/casparcg-debs/{{ casparcg_server_deb_src | basename }}"
    mode: "0644"
  become: true
  when: casparcg_server_deb_src | length > 0

- name: Install the locally built CasparCG Server package
  ansible.builtin.apt:
    deb: "/var/local/casparcg-debs/{{ casparcg_server_deb_src | basename }}"
    state: present
    update_cache: false
    install_recommends: false
    allow_downgrade: true
  become: true
  when: casparcg_server_deb_src | length > 0
  # In --check the copy above didn't happen, so there is nothing to install.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Copy locally patched library packages
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/local/casparcg-debs/{{ item | basename }}"
    mode: "0644"
  loop: "{{ casparcg_patched_debs }}"
  become: true

- name: Install locally patched library packages
  ansible.builtin.apt:
    deb: "/var/local/casparcg-debs/{{ item | basename }}"
    state: present
    update_cache: false
    install_recommends: false
    allow_downgrade: true
  loop: "{{ casparcg_patched_debs }}"
  become: true
  # In --check the copy above didn't happen, so there is nothing to install.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Hold patched library packages so apt upgrades don't replace them
  ansible.builtin.dpkg_selections:
    name: "{{ (item | basename).split('_')[0] }}"
    selection: hold
  loop: "{{ casparcg_patched_debs }}"
  become: true
  when: not ansible_check_mode

- name: Create the diagnostic log directory
  ansible.builtin.file:
    path: "{{ casparcg_diag_log_dir }}"
    state: directory
    owner: "{{ casparcg_user }}"
    group: "{{ casparcg_user }}"
    mode: "0755"
  become: true
  when: casparcg_diag_log_dir | length > 0

- name: Rotate the diagnostic logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/casparcg-diag
    mode: "0644"
    content: |
      # Managed by Ansible (roles/casparcg).
      # CasparCG keeps its diagnostic log open: copytruncate, not create.
      {{ casparcg_diag_log_dir }}/*.log {{ casparcg_diag_log_dir }}/*.csv {
          daily
          maxsize 200M
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
  become: true
  when: casparcg_diag_log_dir | length > 0

# See files/mallinfo_clamp.c: CEF 142 traps (and takes CasparCG down) once
# the server's heap passes 2 GiB, because it reads it through mallinfo()'s
# 32-bit fields. The shim is preloaded through NODM_XSESSION below.
- name: Install a compiler for the mallinfo clamp
  ansible.builtin.apt:
    name: gcc
    state: present
  become: true
  when: casparcg_mallinfo_clamp

- name: Copy the mallinfo clamp source
  ansible.builtin.copy:
    src: mallinfo_clamp.c
    dest: /usr/local/src/mallinfo_clamp.c
    owner: root
    group: root
    mode: "0644"
  become: true
  register: casparcg_mallinfo_clamp_src
  when: casparcg_mallinfo_clamp

- name: Check for a built mallinfo clamp
  ansible.builtin.stat:
    path: /usr/local/lib/mallinfo_clamp.so
  register: casparcg_mallinfo_clamp_so
  when: casparcg_mallinfo_clamp

- name: Build the mallinfo clamp
  ansible.builtin.command:
    cmd: gcc -O2 -shared -fPIC -o /usr/local/lib/mallinfo_clamp.so /usr/local/src/mallinfo_clamp.c
  become: true
  changed_when: true
  when: >-
    casparcg_mallinfo_clamp and
    (casparcg_mallinfo_clamp_src.changed or not casparcg_mallinfo_clamp_so.stat.exists)

# Keep every CasparCG crash dump. apport saves one report per program and
# skips new ones while it is unread, and CEF's updater helpers (same binary)
# crash about daily, so the server's own crash was never kept.
- name: Install systemd-coredump
  ansible.builtin.apt:
    name: systemd-coredump
    state: present
  become: true
  when: casparcg_coredump

- name: Stop apport taking crash dumps
  ansible.builtin.service:
    name: apport
    state: stopped
    enabled: false
  become: true
  failed_when: false
  when: casparcg_coredump

- name: Hand crash dumps to systemd-coredump
  ansible.builtin.command:
    cmd: /usr/lib/systemd/systemd-sysctl /usr/lib/sysctl.d/50-coredump.conf
  become: true
  changed_when: false
  when: casparcg_coredump

# nodm's PAM session (/etc/pam.d/nodm) runs pam_limits, so this reaches the
# server at its next start. CasparCG ignores a refused realtime call, so
# check with `chrt -p` on its threads after a restart.
- name: Allow the casparcg user realtime priority
  ansible.builtin.copy:
    dest: /etc/security/limits.d/casparcg.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/casparcg, casparcg_rtprio).
      {{ casparcg_user }} - rtprio {{ casparcg_rtprio }}
  become: true
  when: casparcg_rtprio | int > 0
  tags: [casparcg_rtprio]

- name: Remove the casparcg realtime priority entry
  ansible.builtin.file:
    path: /etc/security/limits.d/casparcg.conf
    state: absent
  become: true
  when: casparcg_rtprio | int == 0
  tags: [casparcg_rtprio]

- name: Configure nodm
  ansible.builtin.template:
    src: nodm.conf.j2
    dest: "/etc/default/nodm"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Render casparcg.config to /etc
  ansible.builtin.template:
    src: "casparcg.config.j2"
    dest: "/etc/casparcg.config"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure nodm service is started and enabled
  ansible.builtin.service:
    name: nodm
    state: started
    enabled: true
  become: true
