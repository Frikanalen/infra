---
- name: Ensure casparcg user exists
  user:
    name: "{{ casparcg_user }}"
    shell: /usr/sbin/nologin
    system: true
  become: true

- name: Install nodm package
  apt:
    name: nodm
    state: present
    update_cache: true
  become: true

- name: Install CasparCG CEF package from URL
  apt:
    deb: "{{ casparcg_cef_url }}"
    state: present
    update_cache: false
    install_recommends: false
  become: true

- name: Install CasparCG Server package from URL
  apt:
    deb: "{{ casparcg_server_url }}"
    state: present
    update_cache: false
    install_recommends: false
  become: true

- name: Configure nodm
  template:
    src: nodm.conf.j2
    dest: "/etc/default/nodm"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Render casparcg.config to /etc
  template:
    src: "casparcg.config.j2"
    dest: "/etc/casparcg.config"
    owner: root
    group: root
    mode: '0644'
  become: true


- name: Ensure nodm service is started and enabled
  service:
    name: nodm
    state: started
    enabled: true
  become: true
