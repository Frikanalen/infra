---
- name: Create PersistentVolume for Kubegres backups on file01
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'pv.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Create PersistentVolumeClaim binding the backup PV
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'pvc.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Wait for ArgoCD to create the Kubegres resource
  # This role runs right after roles/argocd_django in
  # playbooks/k8s_apps_prod.yml, but ArgoCD's sync of the Application it
  # just created is async -- the Kubegres CR this task patches next may not
  # exist yet.
  become: yes
  kubernetes.core.k8s_info:
    api_version: kubegres.reactive-tech.io/v1
    kind: Kubegres
    name: "{{ kubegres_backup_kubegres_name }}"
    namespace: "{{ kubegres_backup_namespace }}"
    kubeconfig: "{{ argocd_kubeconfig }}"
  register: kubegres_backup_cr
  until: kubegres_backup_cr.resources | length > 0
  retries: 30
  delay: 10

- name: Enable Kubegres's built-in backup CronJob
  # Patched in directly rather than through the django-api chart's values,
  # since that chart's Kubegres template (chart/templates/database.yaml)
  # doesn't render a backup stanza. merge_type: merge does a JSON merge
  # patch, which only touches the keys given here (spec.backup) and leaves
  # everything else the chart manages -- image, replicas, env, customConfig
  # -- untouched.
  #
  # ArgoCD's selfHeal would otherwise revert this on the next sync, since
  # its rendered manifest still doesn't know about spec.backup; see the
  # matching ignoreDifferences entry in roles/argocd_django's Application.
  become: yes
  kubernetes.core.k8s:
    state: present
    merge_type: merge
    kubeconfig: "{{ argocd_kubeconfig }}"
    definition:
      apiVersion: kubegres.reactive-tech.io/v1
      kind: Kubegres
      metadata:
        name: "{{ kubegres_backup_kubegres_name }}"
        namespace: "{{ kubegres_backup_namespace }}"
      spec:
        backup:
          schedule: "{{ kubegres_backup_schedule }}"
          pvcName: "{{ kubegres_backup_pvc_name }}"
          volumeMount: "{{ kubegres_backup_volume_mount }}"
