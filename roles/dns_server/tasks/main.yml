---

- name: Install BIND
  become: true
  ansible.builtin.pkgng:
    name: "{{ dns_bind_package }}"
    state: present

- name: Ensure zone directory exists
  become: true
  ansible.builtin.file:
    path: "{{ dns_zone_dir }}"
    state: directory
    owner: bind
    group: bind
    mode: "0755"

- name: Render named.conf
  become: true
  ansible.builtin.template:
    src: "named.conf.j2"
    dest: "{{ dns_named_conf }}"
    owner: bind
    group: bind
    mode: "0644"
  notify: restart named

- name: Render forward zone for {{ dns_zone_name }}
  become: true
  ansible.builtin.template:
    src: "db.dc1.frikanalen.no.j2"
    dest: "{{ dns_zone_dir }}/db.{{ dns_zone_name }}"
    owner: bind
    group: bind
    mode: "0644"
  vars:
    hosts: "{{ host_config }}"
  notify: reload named

- name: Render reverse zones
  become: true
  ansible.builtin.template:
    src: "db.{{ item }}.j2"
    dest: "{{ dns_zone_dir }}/db.{{ item }}"
    owner: bind
    group: bind
    mode: "0644"
  loop: "{{ dns_reverse_prefixes }}"
  vars:
    hosts: "{{ host_config }}"
  notify: reload named

- name: Enable and start named service
  become: true
  ansible.builtin.service:
    name: named
    state: started
    enabled: true


