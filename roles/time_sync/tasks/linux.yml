---
- name: Work out this host's place in the time hierarchy
  ansible.builtin.set_fact:
    time_sync_is_server: "{{ inventory_hostname in groups['time_servers'] | default([]) }}"
    time_sync_is_ptp: "{{ time_sync_ptp_enabled | bool and inventory_hostname in groups['ptp_hosts'] | default([]) }}"
    time_sync_is_grandmaster: "{{ time_sync_ptp_enabled | bool and inventory_hostname == time_sync_ptp_grandmaster }}"
    # Physical hosts with PHC-capable NICs (ptp_hosts) use NIC timestamps for
    # NTP while PTP is off (ptp4l would fight chrony over the NIC's filter).
    time_sync_hwtimestamp: >-
      {{ time_sync_ntp_hwtimestamp | bool and not time_sync_ptp_enabled | bool
         and inventory_hostname in groups['ptp_hosts'] | default([]) }}
    time_sync_is_guest: "{{ time_sync_ptp_kvm and inventory_hostname in groups['qemu_guest'] | default([]) }}"
    time_sync_local_servers: >-
      {{ groups['time_servers'] | default([])
         | difference([inventory_hostname])
         | map('extract', host_config) | map(attribute='ip_cidr')
         | map('split', '/') | map('first') | list }}

# chrony replaces whatever the OS shipped. openntpd (file01) and ntpd
# (tx3's leftover ntp.conf) would fight it for the clock; timesyncd is
# masked rather than removed because Ubuntu's systemd pulls it back.
- name: Remove other NTP daemons
  ansible.builtin.apt:
    name: [openntpd, ntp, ntpsec]
    state: absent

- name: Mask systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

# A PHC slaved by ptp4l runs on TAI. chrony converts it with the right/UTC
# leap table, which Debian 13 and Ubuntu 24.04+ moved to tzdata-legacy.
- name: Check for the right/UTC leap-second table
  ansible.builtin.stat:
    path: /usr/share/zoneinfo/right/UTC
  register: time_sync_right_utc
  when: time_sync_is_ptp | bool and not time_sync_is_grandmaster | bool

- name: Install the leap-second table for TAI refclocks
  ansible.builtin.apt:
    name: tzdata-legacy
    state: present
  when:
    - time_sync_is_ptp | bool and not time_sync_is_grandmaster | bool
    - not time_sync_right_utc.stat.exists

- name: Load ptp_kvm at boot on VMs
  ansible.builtin.copy:
    dest: /etc/modules-load.d/ptp_kvm.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/time_sync): the host's clock as /dev/ptp_kvm.
      ptp_kvm
  when: time_sync_is_guest | bool

# Ubuntu's 6.8 kernels keep ptp_kvm in linux-modules-extra (caspar-sw1 had
# none installed); the 7.0 kernels on the 26.04 nodes have it in the base
# modules. Look before installing anything.
- name: Check whether this kernel ships ptp_kvm
  ansible.builtin.command:
    argv: [modinfo, -n, ptp_kvm]
  register: time_sync_ptp_kvm_modinfo
  changed_when: false
  failed_when: false
  check_mode: false
  when: time_sync_is_guest | bool

- name: Install the extra kernel modules that carry ptp_kvm
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - time_sync_is_guest | bool
    - time_sync_ptp_kvm_modinfo.rc != 0
    - ansible_distribution == "Ubuntu"

- name: Load ptp_kvm now
  community.general.modprobe:
    name: ptp_kvm
    state: present
  register: time_sync_ptp_kvm_loaded
  failed_when: false
  when: time_sync_is_guest | bool

# systemd's 50-udev-default.rules links the KVM PHC to /dev/ptp_kvm.
- name: Check for /dev/ptp_kvm
  ansible.builtin.stat:
    path: /dev/ptp_kvm
  register: time_sync_ptp_kvm_dev
  when: time_sync_is_guest | bool

- name: Set up PTP
  ansible.builtin.include_tasks: ptp.yml
  when: time_sync_is_ptp | bool

# NIC timestamping goes through a guard that re-checks igb at every chrony
# start (see files/chrony-hwts-guard and roles/igb_rx_ts_fix).
- name: Install hwstamp_ctl for the timestamping guard
  ansible.builtin.apt:
    name: linuxptp
    state: present
  when: time_sync_hwtimestamp | bool

- name: Install the timestamping guard
  ansible.builtin.copy:
    src: chrony-hwts-guard
    dest: /usr/local/libexec/chrony-hwts-guard
    mode: "0755"
  when: time_sync_hwtimestamp | bool

- name: Create chrony's systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d
    state: directory
    mode: "0755"
  when: time_sync_hwtimestamp | bool

- name: Run the guard before chrony starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/chrony.service.d/hwts-guard.conf
    content: |
      # Managed by Ansible (roles/time_sync)
      # "+": run the guard as root outside chrony's sandbox. Debian's unit has
      # User=_chrony and ProtectSystem=strict, so without it the guard can
      # neither write /run/chrony-hwts.d nor clear the NIC filter, and its
      # failure stops chrony from starting (seen on vm1, 2026-11-23).
      [Service]
      ExecStartPre=+/usr/local/libexec/chrony-hwts-guard
    mode: "0644"
  when: time_sync_hwtimestamp | bool
  notify: Restart chrony

- name: Remove the guard drop-in where NIC timestamping is off
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d/hwts-guard.conf
    state: absent
  when: not time_sync_hwtimestamp | bool
  notify: Restart chrony

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Restart chrony

- name: Run chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
