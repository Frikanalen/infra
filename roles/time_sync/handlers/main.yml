---
- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    daemon_reload: true

- name: Restart ptp4l
  ansible.builtin.systemd:
    name: ptp4l-lan
    state: restarted
    daemon_reload: true

- name: Restart phc2sys
  ansible.builtin.systemd:
    name: phc2sys-grandmaster
    state: restarted
    daemon_reload: true

- name: Restart ntpd
  ansible.builtin.service:
    name: ntpd
    state: restarted
