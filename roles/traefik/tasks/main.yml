---
- name: Assert the internal resolver doesn't need a second RFC2136 credential set
  ansible.builtin.assert:
    that:
      - not (traefik_acme_challenge == 'dns' and traefik_internal_acme_enabled)
    fail_msg: >-
      traefik_acme_challenge: dns and traefik_internal_acme_enabled: true both
      need RFC2136 env vars in this pod, but lego reads them from process-wide
      env vars, so only one RFC2136 credential set can be active at a time.
      Point traefik_internal_rfc2136_tsig_keyname at the same key the primary
      resolver already uses instead of enabling a second one.
  when: traefik_internal_acme_enabled

- name: Add Traefik Helm repository
  kubernetes.core.helm_repository:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: traefik
    repo_url: https://traefik.github.io/charts
  become: true
  run_once: true

- name: Install Traefik via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: traefik
    chart_ref: traefik/traefik
    chart_version: "{{ traefik_chart_version | default(omit, true) }}"
    release_namespace: "{{ traefik_namespace }}"
    create_namespace: true
    wait: true
    values:
      persistence:
        enabled: true

      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

      podSecurityContext:
        fsGroup: 65532

      env: >-
        {{
          (
            [
              {'name': 'RFC2136_NAMESERVER', 'value': traefik_rfc2136_host ~ ':' ~ traefik_rfc2136_port},
              {'name': 'RFC2136_TSIG_KEY', 'value': traefik_rfc2136_tsig_keyname},
              {'name': 'RFC2136_TSIG_ALGORITHM', 'value': traefik_rfc2136_tsig_algorithm},
              {'name': 'RFC2136_TSIG_SECRET', 'value': traefik_rfc2136_tsig_secret}
            ] if traefik_acme_challenge == 'dns' else
            [
              {'name': 'RFC2136_NAMESERVER', 'value': traefik_internal_rfc2136_host ~ ':' ~ traefik_internal_rfc2136_port},
              {'name': 'RFC2136_TSIG_KEY', 'value': traefik_internal_rfc2136_tsig_keyname},
              {'name': 'RFC2136_TSIG_ALGORITHM', 'value': traefik_internal_rfc2136_tsig_algorithm},
              {'name': 'RFC2136_TSIG_SECRET', 'value': traefik_internal_rfc2136_tsig_secret}
            ] if traefik_internal_acme_enabled else []
          )
        }}

      certificatesResolvers: "{{ traefik_cert_resolvers }}"

      service:
        type: "{{ traefik_service_type }}"
        spec:
          loadBalancerIP: "{{ traefik_loadbalancer_ip | default(omit) }}"

      dashboard:
        enabled: "{{ traefik_dashboard_enabled }}"

      metrics:
        prometheus:
          serviceMonitor:
            enabled: "{{ k8s_monitoring_enabled }}"

      ingressClass:
        enabled: true
        isDefaultClass: true
        name: "{{ traefik_ingress_class }}"

      ports:
        web:
          redirections:
            entryPoint:
              to: websecure
              scheme: https

      providers:
        kubernetesIngress:
          publishedService:
            enabled: true
  vars:
    traefik_letsencrypt_acme: >-
      {{
        {
          'email': traefik_acme_email,
          'storage': traefik_acme_storage,
          'caServer': traefik_acme_server
        } | combine(
          {'dnsChallenge': {'provider': 'rfc2136'}} if traefik_acme_challenge == 'dns'
          else {'httpChallenge': {'entryPoint': 'web'}}
        )
      }}
    traefik_internal_acme: >-
      {{
        {
          'email': traefik_acme_email,
          'storage': traefik_internal_acme_storage,
          'caServer': traefik_acme_server,
          'dnsChallenge': {'provider': 'rfc2136'}
        }
      }}
    traefik_cert_resolvers: >-
      {{
        {'letsencrypt': {'acme': traefik_letsencrypt_acme}}
        | combine(
          {traefik_internal_cert_resolver_name: {'acme': traefik_internal_acme}}
          if traefik_internal_acme_enabled else {}
        )
      }}
  become: true
  run_once: true

- name: Create www redirect Middleware
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: www-redirect
        namespace: "{{ traefik_namespace }}"
      spec:
        redirectRegex:
          regex: "^https?://www\\.(.+)"
          replacement: "https://${1}"
          permanent: true
  become: true
  run_once: true

- name: Create www redirect IngressRoute
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: www-redirect
        namespace: "{{ traefik_namespace }}"
      spec:
        entryPoints:
          - web
          - websecure
        routes:
          - match: "Host(`www.{{ frikanalen_domain }}`)"
            kind: Rule
            middlewares:
              - name: www-redirect
            services:
              - name: noop@internal
                kind: TraefikService
        tls:
          certResolver: letsencrypt
  become: true
  run_once: true

- name: Create Traefik Grafana dashboard ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: traefik-grafana-dashboard
        namespace: "{{ traefik_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        traefik-dashboard.json: "{{ lookup('file', 'traefik-dashboard.json') }}"
  become: true
  run_once: true
  when: k8s_monitoring_enabled | bool

- name: Wait for Traefik to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig }}"
    kind: Deployment
    namespace: "{{ traefik_namespace }}"
    name: traefik
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: true
  run_once: true
