---
- name: Assert the internal resolver doesn't need a second RFC2136 credential set
  ansible.builtin.assert:
    that:
      - not (traefik_acme_challenge == 'dns' and traefik_internal_acme_enabled)
    fail_msg: >-
      traefik_acme_challenge: dns and traefik_internal_acme_enabled: true both
      need RFC2136 env vars in this pod, but lego reads them from process-wide
      env vars, so only one RFC2136 credential set can be active at a time.
      Point traefik_internal_rfc2136_tsig_keyname at the same key the primary
      resolver already uses instead of enabling a second one.
  when: traefik_internal_acme_enabled

- name: Add Traefik Helm repository
  kubernetes.core.helm_repository:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: traefik
    repo_url: https://traefik.github.io/charts
  become: true
  run_once: true

- name: Issue the default certificate with cert-manager
  when: traefik_tls_mode == 'cert-manager'
  become: true
  run_once: true
  block:
    - name: Assert the default certificate has names
      ansible.builtin.assert:
        that: traefik_tls_dns_names | length > 0
        fail_msg: traefik_tls_mode cert-manager needs traefik_tls_dns_names.

    - name: Create the Traefik namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ traefik_namespace }}"

    - name: Store the RFC2136 TSIG secret for the DNS-01 solver
      when: traefik_acme_challenge == 'dns'
      no_log: true
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ traefik_release_name }}-rfc2136-tsig"
            namespace: "{{ traefik_namespace }}"
          type: Opaque
          stringData:
            secret: "{{ traefik_rfc2136_tsig_secret }}"

    - name: Define the Let's Encrypt Issuer
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: "{{ traefik_tls_issuer_name }}"
            namespace: "{{ traefik_namespace }}"
          spec:
            acme:
              email: "{{ traefik_acme_email }}"
              server: "{{ traefik_acme_server }}"
              privateKeySecretRef:
                name: "{{ traefik_tls_issuer_name }}-account-key"
              solvers:
                - "{{ traefik_cert_manager_solver }}"

    - name: Request the default certificate
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: "{{ traefik_tls_secret_name }}"
            namespace: "{{ traefik_namespace }}"
          spec:
            secretName: "{{ traefik_tls_secret_name }}"
            dnsNames: "{{ traefik_tls_dns_names }}"
            issuerRef:
              kind: Issuer
              name: "{{ traefik_tls_issuer_name }}"

    # Traefik must not switch to the TLSStore before there is a certificate
    # in it, or it serves its self-signed fallback.
    - name: Wait for the default certificate to be issued
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig }}"
        api_version: cert-manager.io/v1
        kind: Certificate
        namespace: "{{ traefik_namespace }}"
        name: "{{ traefik_tls_secret_name }}"
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 600
  vars:
    traefik_cert_manager_solver: >-
      {{
        {'dns01': {'rfc2136': {
          'nameserver': traefik_rfc2136_host ~ ':' ~ traefik_rfc2136_port,
          'tsigKeyName': traefik_rfc2136_tsig_keyname,
          'tsigAlgorithm': traefik_rfc2136_tsig_algorithm | upper | replace('-', ''),
          'tsigSecretSecretRef': {'name': traefik_release_name ~ '-rfc2136-tsig', 'key': 'secret'}
        }}}
        if traefik_acme_challenge == 'dns' else
        {'http01': {'ingress': {'ingressClassName': traefik_ingress_class}}}
      }}

# After the certificate exists, so the move costs only the reinstall.
- name: Uninstall this release from its old namespace
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: "{{ traefik_release_name }}"
    release_namespace: "{{ traefik_legacy_namespace }}"
    state: absent
    wait: true
  become: true
  run_once: true
  when: traefik_legacy_namespace | length > 0

- name: Install Traefik via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: "{{ traefik_release_name }}"
    chart_ref: traefik/traefik
    chart_version: "{{ traefik_chart_version | default(omit, true) }}"
    release_namespace: "{{ traefik_namespace }}"
    create_namespace: true
    skip_crds: "{{ traefik_skip_crds }}"
    wait: true
    values:
      persistence:
        enabled: "{{ traefik_tls_mode == 'acme' }}"

      deployment:
        replicas: "{{ traefik_replicas | int }}"

      podDisruptionBudget:
        enabled: "{{ traefik_replicas | int > 1 }}"
        maxUnavailable: 1

      # One replica per node, so draining a node takes out at most one.
      affinity: >-
        {{
          {'podAntiAffinity': {'requiredDuringSchedulingIgnoredDuringExecution': [{
            'topologyKey': 'kubernetes.io/hostname',
            'labelSelector': {'matchLabels': {
              'app.kubernetes.io/name': 'traefik',
              'app.kubernetes.io/instance': traefik_release_name ~ '-' ~ traefik_namespace
            }}
          }]}}
          if traefik_replicas | int > 1 else {}
        }}

      tlsStore: >-
        {{
          {'default': {'defaultCertificate': {'secretName': traefik_tls_secret_name}}}
          if traefik_tls_mode == 'cert-manager' else {}
        }}

      securityContext:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

      podSecurityContext:
        fsGroup: 65532

      env: >-
        {{
          (
            [
              {'name': 'RFC2136_NAMESERVER', 'value': traefik_rfc2136_host ~ ':' ~ traefik_rfc2136_port},
              {'name': 'RFC2136_TSIG_KEY', 'value': traefik_rfc2136_tsig_keyname},
              {'name': 'RFC2136_TSIG_ALGORITHM', 'value': traefik_rfc2136_tsig_algorithm},
              {'name': 'RFC2136_TSIG_SECRET', 'value': traefik_rfc2136_tsig_secret}
            ] if traefik_acme_challenge == 'dns' else
            [
              {'name': 'RFC2136_NAMESERVER', 'value': traefik_internal_rfc2136_host ~ ':' ~ traefik_internal_rfc2136_port},
              {'name': 'RFC2136_TSIG_KEY', 'value': traefik_internal_rfc2136_tsig_keyname},
              {'name': 'RFC2136_TSIG_ALGORITHM', 'value': traefik_internal_rfc2136_tsig_algorithm},
              {'name': 'RFC2136_TSIG_SECRET', 'value': traefik_internal_rfc2136_tsig_secret}
            ] if traefik_internal_acme_enabled else []
          ) if traefik_tls_mode == 'acme' else []
        }}

      certificatesResolvers: "{{ traefik_cert_resolvers if traefik_tls_mode == 'acme' else {} }}"

      service:
        spec:
          type: "{{ traefik_service_type }}"
          loadBalancerIP: "{{ traefik_loadbalancer_ip | default(omit) }}"

      api:
        dashboard: "{{ traefik_dashboard_enabled }}"

      ingressRoute:
        dashboard:
          enabled: "{{ traefik_dashboard_ingressroute_enabled }}"
          annotations:
            kubernetes.io/ingress.class: "{{ traefik_ingress_class }}"
            external-dns.kubernetes.io/target: "{{ traefik_loadbalancer_ip }}"
          entryPoints:
            - web
            - websecure
          matchRule: "Host(`{{ traefik_dashboard_host }}`)"
          tls: "{{ traefik_ingressroute_tls }}"

      metrics:
        prometheus:
          serviceMonitor:
            enabled: "{{ k8s_monitoring_enabled }}"

      ingressClass:
        enabled: "{{ traefik_manage_ingress_class }}"
        isDefaultClass: "{{ traefik_manage_ingress_class }}"
        name: "{{ traefik_ingress_class }}"

      ports:
        web:
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https

      providers:
        kubernetesCRD:
          enabled: "{{ traefik_enable_crd_provider }}"
          ingressClass: "{{ traefik_ingress_class }}"
          # See traefik_tls_mode in defaults: keeps each release's TLSStore
          # "default" out of the other release's view.
          namespaces: ["{{ traefik_namespace }}"]
        kubernetesIngress:
          ingressClass: "{{ traefik_ingress_class }}"
          publishedService:
            enabled: true
  vars:
    traefik_letsencrypt_acme: >-
      {{
        {
          'email': traefik_acme_email,
          'storage': traefik_acme_storage,
          'caServer': traefik_acme_server
        } | combine(
          {'dnsChallenge': {'provider': 'rfc2136'}} if traefik_acme_challenge == 'dns'
          else {'httpChallenge': {'entryPoint': 'web'}}
        )
      }}
    traefik_internal_acme: >-
      {{
        {
          'email': traefik_acme_email,
          'storage': traefik_internal_acme_storage,
          'caServer': traefik_acme_server,
          'dnsChallenge': {'provider': 'rfc2136'}
        }
      }}
    traefik_cert_resolvers: >-
      {{
        {'letsencrypt': {'acme': traefik_letsencrypt_acme}}
        | combine(
          {traefik_internal_cert_resolver_name: {'acme': traefik_internal_acme}}
          if traefik_internal_acme_enabled else {}
        )
      }}
  become: true
  run_once: true

- name: Create www redirect Middleware
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: www-redirect
        namespace: "{{ traefik_namespace }}"
        annotations:
          kubernetes.io/ingress.class: "{{ traefik_ingress_class }}"
      spec:
        redirectRegex:
          regex: "^https?://www\\.(.+)"
          replacement: "https://${1}"
          permanent: true
  become: true
  run_once: true
  when: traefik_manage_www_redirect

- name: Create www redirect IngressRoute
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: www-redirect
        namespace: "{{ traefik_namespace }}"
        annotations:
          kubernetes.io/ingress.class: "{{ traefik_ingress_class }}"
      spec:
        entryPoints:
          - web
          - websecure
        routes:
          - match: "Host(`www.{{ frikanalen_domain }}`)"
            kind: Rule
            middlewares:
              - name: www-redirect
            services:
              - name: noop@internal
                kind: TraefikService
        tls: "{{ traefik_ingressroute_tls }}"
  become: true
  run_once: true
  when: traefik_manage_www_redirect

- name: Remove the ACME volumes cert-manager mode no longer uses
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ traefik_release_name }}"
    namespace: "{{ item }}"
  loop: "{{ [traefik_namespace, traefik_legacy_namespace] | select | list }}"
  become: true
  run_once: true
  when: traefik_tls_mode == 'cert-manager'

- name: Create Traefik Grafana dashboard ConfigMap
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: traefik-grafana-dashboard
        namespace: "{{ traefik_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        traefik-dashboard.json: "{{ lookup('file', 'traefik-dashboard.json') }}"
  become: true
  run_once: true
  when: k8s_monitoring_enabled | bool and traefik_manage_www_redirect

- name: Wait for Traefik to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig }}"
    kind: Deployment
    namespace: "{{ traefik_namespace }}"
    name: "{{ traefik_release_name }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: true
  run_once: true
