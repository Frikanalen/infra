---
traefik_namespace: traefik
traefik_release_name: traefik
traefik_chart_version: "{{ helm_chart_versions.traefik }}"

# ACME/Let's Encrypt configuration
traefik_acme_email: toresbe@protonmail.com
traefik_acme_storage: /data/acme.json
traefik_acme_challenge: dns # 'dns' for RFC2136 or 'http' for HTTP-01
traefik_acme_server: https://acme-v02.api.letsencrypt.org/directory
# Staging server: https://acme-staging-v02.api.letsencrypt.org/directory

# Service configuration
traefik_service_type: LoadBalancer

# Dashboard
traefik_dashboard_enabled: true
# Expose the dashboard on an IngressRoute (off by default -- don't expose a
# dashboard over the internet). Set traefik_dashboard_host when enabling.
traefik_dashboard_ingressroute_enabled: false
traefik_dashboard_host: ""

# Ingress class for external-dns integration
traefik_ingress_class: "{{ frikanalen_public_ingress_class }}"
traefik_manage_ingress_class: true
traefik_manage_www_redirect: true
traefik_enable_crd_provider: true
# CRDs (including Traefik Hub's, unused here) are cluster-scoped and shipped
# in the chart's crds/ directory, which Helm installs unconditionally on a
# release's first install. Set true on every release after the first in a
# cluster to avoid a field-manager conflict re-applying the same CRDs.
traefik_skip_crds: false

# RFC2136 DNS challenge defaults (same as external_dns)
# Only relevant if traefik_acme_challenge is 'dns'
traefik_rfc2136_host: "{{ frikanalen_dyndns_server | default('') }}"
traefik_rfc2136_port: "53"
traefik_rfc2136_tsig_keyname: "{{ frikanalen_dyndns_tsig_keyname | default('') }}"
traefik_rfc2136_tsig_algorithm: "hmac-sha256"

# Optional second cert resolver, for hosts that need DNS-01 while
# traefik_acme_challenge above stays on a different challenge type -- e.g.
# prod's public frikanalen.tv zone uses HTTP-01, but an internal-only zone
# can't (Let's Encrypt can't reach an internal IP on port 80). Must not be
# enabled at the same time as traefik_acme_challenge: dns -- lego reads
# RFC2136 credentials from process-wide env vars, so one pod can't run two
# *different* RFC2136 credential sets. See the assert in tasks/main.yml.
traefik_internal_acme_enabled: false
traefik_internal_cert_resolver_name: letsencrypt-internal
traefik_internal_acme_storage: /data/acme-internal.json
traefik_internal_rfc2136_host: "{{ frikanalen_dyndns_server | default('') }}"
traefik_internal_rfc2136_port: "53"
traefik_internal_rfc2136_tsig_keyname: ""
traefik_internal_rfc2136_tsig_algorithm: "hmac-sha256"
traefik_internal_rfc2136_tsig_secret: ""

# --- Where certificates come from ------------------------------------------
#
# acme: Traefik's own ACME resolver, keeping certificates in acme.json on a
#   PersistentVolume. The volume is hostpath, so the single replica is pinned
#   to one node and ingress goes down whenever that node is drained.
# cert-manager: an Issuer and a Certificate in traefik_namespace (same
#   challenge settings as above), served as Traefik's default certificate
#   through the TLSStore named "default". Traefik keeps no state, so it runs
#   traefik_replicas replicas on different nodes behind a PDB.
#
# A TLSStore named "default" is cluster-wide to Traefik, and two in one
# cluster cancel each other out ("Default TLS Stores defined in multiple
# namespaces"). Each release therefore lives in its own namespace and only
# watches CRDs there (providers.kubernetesCRD.namespaces below).
traefik_tls_mode: acme
# Names on the default certificate; every host this release serves must be
# covered, e.g. [frikanalen.tv, www.frikanalen.tv] or ["*.intern.frikanalen.tv"].
traefik_tls_dns_names: []
traefik_tls_secret_name: "{{ traefik_release_name }}-default-tls"
traefik_tls_issuer_name: letsencrypt
traefik_replicas: "{{ 2 if traefik_tls_mode == 'cert-manager' else 1 }}"
# HTTP-01 can't complete while this release still runs its own ACME
# resolver: Traefik answers every /.well-known/acme-challenge/ request itself
# and 404s cert-manager's tokens. For that first switch, name a domain here
# and its certificate is copied out of the running release's acme.json into
# traefik_tls_secret_name, so Traefik has something to serve until
# cert-manager's own certificate (all of traefik_tls_dns_names) lands in the
# same Secret a few minutes later. Only acts while that Secret is missing.
traefik_tls_seed_from_acme_domain: ""
# Set when moving a release to a new traefik_namespace: the old release of
# the same name in this namespace is uninstalled first, freeing its
# LoadBalancer IP for the new one.
traefik_legacy_namespace: ""
# IngressRoutes this role creates: name the ACME resolver, or serve the
# TLSStore's default certificate. An empty certResolver rather than none, as
# the k8s module merges into the existing object and would keep the old one.
traefik_ingressroute_tls: "{{ {'certResolver': 'letsencrypt' if traefik_tls_mode == 'acme' else ''} }}"

# Hosts outside the cluster whose HTTPS this release passes through untouched
# (TLS is not terminated here; the backend keeps its own certificate). Each
# entry: {name, hosts: [SNI names], address: <IPv4>, port: 443}. Plain HTTP
# for those names hits the web entrypoint's redirect to https, so an ACME
# HTTP-01 check against the backend follows it to port 443 and lands on the
# backend too. Created in traefik_namespace, the only one this release's CRD
# provider watches.
traefik_tls_passthrough_routes: []
