---
traefik_namespace: traefik
traefik_release_name: traefik
traefik_chart_version: "{{ helm_chart_versions.traefik }}"

# ACME/Let's Encrypt configuration
traefik_acme_email: toresbe@protonmail.com
traefik_acme_storage: /data/acme.json
traefik_acme_challenge: dns # 'dns' for RFC2136 or 'http' for HTTP-01
traefik_acme_server: https://acme-v02.api.letsencrypt.org/directory
# Staging server: https://acme-staging-v02.api.letsencrypt.org/directory

# Service configuration
traefik_service_type: LoadBalancer

# Dashboard
traefik_dashboard_enabled: true
# Expose the dashboard on an IngressRoute (off by default -- don't expose a
# dashboard over the internet). Set traefik_dashboard_host when enabling.
traefik_dashboard_ingressroute_enabled: false
traefik_dashboard_host: ""

# Ingress class for external-dns integration
traefik_ingress_class: "{{ frikanalen_public_ingress_class }}"
traefik_manage_ingress_class: true
traefik_manage_www_redirect: true
traefik_enable_crd_provider: true
# CRDs (including Traefik Hub's, unused here) are cluster-scoped and shipped
# in the chart's crds/ directory, which Helm installs unconditionally on a
# release's first install. Set true on every release after the first in a
# cluster to avoid a field-manager conflict re-applying the same CRDs.
traefik_skip_crds: false

# RFC2136 DNS challenge defaults (same as external_dns)
# Only relevant if traefik_acme_challenge is 'dns'
traefik_rfc2136_host: "{{ frikanalen_dyndns_server | default('') }}"
traefik_rfc2136_port: "53"
traefik_rfc2136_tsig_keyname: "{{ frikanalen_dyndns_tsig_keyname | default('') }}"
traefik_rfc2136_tsig_algorithm: "hmac-sha256"

# Optional second cert resolver, for hosts that need DNS-01 while
# traefik_acme_challenge above stays on a different challenge type -- e.g.
# prod's public frikanalen.no zone uses HTTP-01, but an internal-only zone
# can't (Let's Encrypt can't reach an internal IP on port 80). Must not be
# enabled at the same time as traefik_acme_challenge: dns -- lego reads
# RFC2136 credentials from process-wide env vars, so one pod can't run two
# *different* RFC2136 credential sets. See the assert in tasks/main.yml.
traefik_internal_acme_enabled: false
traefik_internal_cert_resolver_name: letsencrypt-internal
traefik_internal_acme_storage: /data/acme-internal.json
traefik_internal_rfc2136_host: "{{ frikanalen_dyndns_server | default('') }}"
traefik_internal_rfc2136_port: "53"
traefik_internal_rfc2136_tsig_keyname: ""
traefik_internal_rfc2136_tsig_algorithm: "hmac-sha256"
traefik_internal_rfc2136_tsig_secret: ""
