---
# defaults for argocd_django role

# Kubernetes config
argocd_kubeconfig: /var/snap/microk8s/current/credentials/client.config

# Django app settings
argocd_django_app_name: django-api
argocd_django_namespace: "{{ frikanalen_app_namespace }}"
argocd_django_repo_url: https://github.com/Frikanalen/django-api.git
argocd_django_repo_path: chart
argocd_django_image_repository: ghcr.io/frikanalen/django-api

# Version - controls both repo revision and image tag
argocd_django_version: "{{ app_versions.django | default('staging') }}"

# Prometheus scrape of django-prometheus's /metrics, via the ServiceMonitor
# in templates/servicemonitor.yml.j2. The port is the Django container's own
# (the nginx sidecar on 80 only serves collected static files).
argocd_django_metrics_port: "8080"
argocd_django_metrics_interval: "30s"
argocd_django_metrics_scrape_timeout: "10s"

# Set true (e.g. in group_vars/staging.yml) to have Argo CD Image Updater
# track new pushes to the argocd_django_version tag and roll the deployment.
argocd_image_updater_enabled: false

# Database settings (for secret generation)
argocd_django_db_user: fkweb
argocd_django_db_secret_name: "{{ django_db_secret_name }}"
argocd_django_db_host: "{{ django_db_host }}"
argocd_django_db_port: "5432"
argocd_django_db_name: fkweb

# Database passwords - must be set by caller (e.g., from vault)
argocd_django_db_super_password: ""
argocd_django_db_replication_password: ""
argocd_django_db_django_password: ""

# Helm values - only overrides from chart defaults
argocd_django_values:
  django:
    image:
      repository: "{{ argocd_django_image_repository }}"
      tag: "{{ argocd_django_version }}"

  env:
    # .pod.cluster.local is what makes the Prometheus scrape work: Django
    # rejects any Host it does not recognise with a 400 before routing, and
    # the ServiceMonitor addresses the pod by its CoreDNS pod-zone name
    # rather than its bare IP precisely so this one suffix entry is enough.
    # A leading dot is Django's subdomain wildcard, so this admits
    # <ip-with-dashes>.<namespace>.pod.cluster.local and nothing outside the
    # cluster. See roles/argocd_django/templates/servicemonitor.yml.j2.
    ALLOWED_HOSTS: "{{ frikanalen_domain }},.pod.cluster.local"
    CSRF_TRUSTED_ORIGINS: "{{ frikanalen_scheme }}://{{ frikanalen_domain }}"
    # Handed to the frontend as a video's uploadUrl. Must resolve to the tusd
    # ingress that roles/argocd_ingest creates.
    FK_UPLOAD_URL: "{{ frikanalen_scheme }}://{{ frikanalen_domain }}{{ ingest_upload_path }}"
    # Prefix every video file URL is built from. Must resolve to the ingress
    # roles/media_server creates, and match its export -- staging's archive
    # is a separate directory from prod's (see group_vars/staging.yml), so
    # this deliberately varies by frikanalen_domain rather than pointing both
    # environments at the same media host.
    FK_MEDIA_URLPREFIX: "{{ frikanalen_scheme }}://{{ frikanalen_domain }}{{ ingest_media_path }}/"

  ingress:
    enabled: true
    className: "{{ frikanalen_public_ingress_class }}"
    hostname: "{{ frikanalen_domain }}"
