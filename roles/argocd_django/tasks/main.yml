---
- name: Ensure Django namespace exists
  become: true
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ argocd_django_namespace }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Create Postgres passwords secret
  become: true
  # Renders four vault passwords into stringData, one of them twice (it is
  # also embedded in DATABASE_URL).
  no_log: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'postgres-secret.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy Django API via ArgoCD Application
  become: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'application.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy Django API Argo CD Image Updater tracking
  become: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'image-updater.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
  when: argocd_image_updater_enabled | bool
