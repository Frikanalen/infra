---
# defaults for argocd_ingest role

# Kubernetes config
argocd_kubeconfig: /var/snap/microk8s/current/credentials/client.config

# Ingest app settings
argocd_ingest_app_name: ingest
argocd_ingest_namespace: "{{ frikanalen_app_namespace }}"
argocd_ingest_repo_url: https://github.com/Frikanalen/ingest.git
argocd_ingest_repo_path: chart
argocd_ingest_image_repository: ghcr.io/frikanalen/ingest

# Version - controls both repo revision and image tag
argocd_ingest_version: "{{ app_versions.ingest }}"

# Set true (e.g. in group_vars/staging.yml) to have Argo CD Image Updater
# track new pushes to the argocd_ingest_version tag and roll the deployment.
argocd_image_updater_enabled: false

# Archive credentials, created by the ingest_archive_account role
argocd_ingest_ssh_secret_name: "{{ ingest_archive_secret_name | default('ingest-archive-ssh') }}"

# Django API token - must be set by caller, from vault. A token rather than a
# login: ingest would otherwise exchange credentials for one at startup, and
# could not boot unless the API were already reachable.
argocd_ingest_api_secret_name: ingest-api
argocd_ingest_api_token: ""

# PVC that tusd writes uploads into, shared with ingest
argocd_ingest_uploads_claim: "{{ ingest_uploads_claim | default('') }}"

# Helm values - only overrides from chart defaults
argocd_ingest_values:
  image:
    repository: "{{ argocd_ingest_image_repository }}"
    tag: "{{ argocd_ingest_version }}"

  api:
    url: "{{ frikanalen_scheme }}://{{ frikanalen_domain }}"
    secretName: "{{ argocd_ingest_api_secret_name }}"

  ingress:
    enabled: true
    className: "{{ frikanalen_public_ingress_class }}"
    # Served at /upload on the main site rather than its own subdomain, so
    # staging needs no extra DNS record. Must agree with FK_UPLOAD_URL in the
    # Django settings: that is what the frontend is handed as a video's
    # uploadUrl.
    hostname: "{{ frikanalen_domain }}"
    certResolver: letsencrypt

  tusd:
    # Shared with argocd_django, which advertises this path as FK_UPLOAD_URL.
    basePath: "{{ ingest_upload_path }}"

  uploads:
    existingClaim: "{{ argocd_ingest_uploads_claim }}"
    persistence:
      size: "{{ ingest_uploads_size }}"

  archive:
    dir: "{{ ingest_archive_dir }}"
    ssh:
      enabled: true
      host: "{{ ingest_archive_host }}"
      port: "{{ ingest_archive_port | default(22) }}"
      username: "{{ ingest_archive_user }}"
      secretName: "{{ argocd_ingest_ssh_secret_name }}"
      # Losing files is worse than failing to start, so never let ingest fall
      # back to archiving into the pod's scratch space here.
      required: true
      # Rolls the deployment when the key is rotated; Helm cannot watch a
      # secret it does not own.
      secretChecksum: "{{ ingest_archive_private_key | default('') | hash('sha256') }}"
