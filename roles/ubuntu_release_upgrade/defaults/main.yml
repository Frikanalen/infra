---
# Upgrades an Ubuntu host in place to the next LTS release with
# do-release-upgrade, non-interactively, then reboots it. Nothing here knows
# about Kubernetes: playbooks/upgrade_microk8s_nodes_ubuntu.yml drains the
# node before this role and uncordons it after.

# The release the host should end up on, as lsb_release -rs prints it. Hosts
# already there are left alone, so the role is safe to re-run.
ubuntu_release_upgrade_target: "26.04"

# Packages that must survive the upgrade. do-release-upgrade removes
# packages it considers obsolete, and an earlier `apt autoremove` took netplan
# with it and left a node without networking. Marking these as manually
# installed keeps them out of both kinds of removal.
ubuntu_release_upgrade_keep:
  - netplan.io
  - openssh-server
  - qemu-guest-agent
  - cloud-init
  - snapd
  - ubuntu-server
  - linux-image-generic

# do-release-upgrade unpacks and installs ~1–2 GB of packages; on the HDD
# thin pool that takes a while. Seconds.
ubuntu_release_upgrade_timeout: 5400

# Free space the upgrade needs on / before it starts, in MiB.
ubuntu_release_upgrade_min_free_mb: 4096

# Files that must still be there after the upgrade (local config the
# upgrade might otherwise replace or drop).
ubuntu_release_upgrade_preserved_files:
  - /etc/cloud/cloud.cfg.d/99-keep-ssh-host-keys.cfg
