---

- name: Ensure zone directory exists with correct ownership
  become: true
  ansible.builtin.file:
    path: "{{ dns_zone_dir }}"
    state: directory
    owner: bind
    group: bind
    mode: "0755"

- name: Render zone configuration
  become: true
  ansible.builtin.template:
    src: "zones.conf.j2"
    dest: "{{ dns_named_conf_d }}/zones-static.conf"
    owner: bind
    group: bind
    mode: "0644"
  notify: reload named

- name: Render forward zone for {{ dns_zone_name }}
  become: true
  ansible.builtin.template:
    src: "db.dc1.frikanalen.no.j2"
    dest: "{{ dns_zone_dir }}/db.{{ dns_zone_name }}"
    owner: bind
    group: bind
    mode: "0644"
  vars:
    host_entries: "{{ host_config }}"
  notify: reload named

- name: Render reverse zones
  become: true
  ansible.builtin.template:
    src: "db.{{ item }}.j2"
    dest: "{{ dns_zone_dir }}/db.{{ item }}"
    owner: bind
    group: bind
    mode: "0644"
  loop: "{{ dns_reverse_prefixes }}"
  vars:
    host_entries: "{{ host_config }}"
  notify: reload named
