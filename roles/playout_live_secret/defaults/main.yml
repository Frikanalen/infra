---
# Secret playout reads LIVE_READER_CREDENTIAL from. Its name is
# playout_live_secret_name, in data/apps.yml -- the playout app definition
# there reads it too.
playout_live_secret_namespace: "{{ frikanalen_app_namespace }}"

# Where Django runs, to issue the credential. Matches the django-api chart.
playout_live_django_namespace: "{{ frikanalen_app_namespace }}"
playout_live_django_selector: "app=django-api"
playout_live_django_container: django
