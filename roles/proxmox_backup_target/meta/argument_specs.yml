---
argument_specs:
  main:
    short_description: Create the directory file01 exports for Proxmox vzdump backups
    options:
      proxmox_backup_export_path:
        type: str
        required: true
        description: The exported directory (data/storage.yml).
      proxmox_backup_target_mode:
        type: str
        required: false
        default: "0750"
        description: Mode of the directory. vzdump writes as root over no_root_squash.
