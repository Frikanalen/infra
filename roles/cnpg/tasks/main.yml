---
- name: Install pip
  ansible.builtin.apt:
    name: python3-pip
    state: present
  become: true

# The Debian-packaged python3-kubernetes predates a 2022 upstream fix for
# CRDs with a property literally named "self" (kubernetes-client/python#1715).
# CloudNativePG's Cluster CRD has spec.replica.self, which trips this bug in
# kubernetes.core.k8s ("ResourceField.__init__() got multiple values for
# argument 'self'"). Pip installs to /usr/local/lib, which takes priority
# over apt's /usr/lib on sys.path, so this shadows the broken package.
# Pinned below 36.0.0, which bumped its PyYAML requirement to >=6.0.3 --
# the apt-installed PyYAML 6.0.1 has no RECORD file (dpkg-owned), so pip
# can't uninstall it to satisfy that, and fails ("Cannot uninstall PyYAML
# 6.0.1, RECORD file not found"). Versions below 36.0.0 only need
# pyyaml>=5.4.1, which 6.0.1 already satisfies, so pip never touches it.
- name: Install a kubernetes Python library new enough to handle CRDs with a "self" field
  ansible.builtin.pip:
    name: "kubernetes>=24.2.0,<36.0.0"
    state: present
    extra_args: --break-system-packages
  become: true

- name: Add CloudNativePG Helm repository
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: https://cloudnative-pg.github.io/charts
  become: false
  run_once: true

- name: Install CloudNativePG operator via Helm
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cnpg/cloudnative-pg
    chart_version: "{{ cnpg_chart_version | default(omit, true) }}"
    release_namespace: cnpg-system
    create_namespace: true
    wait: true
    values:
      monitoring:
        podMonitorEnabled: true
        # kube-prometheus-stack's Prometheus only has
        # podMonitorSelectorNilUsesHelmValues left at its chart default
        # (true), which pins its podMonitorSelector to
        # matchLabels: {release: <that chart's Helm release name>} --
        # roles/kube_prometheus_stack installs it as "kube-prometheus-stack".
        # Without this label, Prometheus's selector never matches CNPG's
        # PodMonitor and no cnpg_* metrics ever reach it, even though
        # podMonitorEnabled above did create the PodMonitor object.
        podMonitorAdditionalLabels:
          release: kube-prometheus-stack
        grafanaDashboard:
          create: true
  become: false
  run_once: true

- name: Wait for CloudNativePG controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: cnpg-system
    name: cnpg-cloudnative-pg
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: false
  run_once: true
