---
- name: Add CloudNativePG Helm repository
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: https://cloudnative-pg.github.io/charts
  become: false
  run_once: true

- name: Install CloudNativePG operator via Helm
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cnpg/cloudnative-pg
    chart_version: "{{ cnpg_chart_version | default(omit, true) }}"
    release_namespace: cnpg-system
    create_namespace: true
    wait: true
    values:
      monitoring:
        # Scrapes the operator's own controller-manager metrics, not the
        # Postgres instances -- see roles/cnpg_cluster's
        # spec.monitoring.enablePodMonitor for that. Picked up by Prometheus
        # regardless of label thanks to roles/kube_prometheus_stack's
        # podMonitorSelectorNilUsesHelmValues: false.
        podMonitorEnabled: true
        grafanaDashboard:
          create: true
  become: false
  run_once: true

- name: Wait for CloudNativePG controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: cnpg-system
    name: cnpg-cloudnative-pg
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: false
  run_once: true
