---
- name: Add Argo CD Helm repo
  become: true
  kubernetes.core.helm_repository:
    repo_name: "{{ argocd_chart_repo_name }}"
    repo_url: "{{ argocd_chart_repo_url }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Install or upgrade Argo CD via Helm
  become: true
  kubernetes.core.helm:
    release_name: argocd
    chart_ref: "{{ argocd_chart_name }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    chart_version: "{{ argocd_chart_version | default(omit) }}"
    values: "{{ argocd_chart_values }}"
    update_repo_cache: true
    wait: true
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: present

- name: Create Argo CD Grafana dashboard ConfigMap
  become: true
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-grafana-dashboard
        namespace: "{{ argocd_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        argocd-dashboard.json: "{{ lookup('file', 'argocd-dashboard.json') }}"
  when: k8s_monitoring_enabled | bool

