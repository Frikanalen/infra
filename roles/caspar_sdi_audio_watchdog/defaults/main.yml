---
# caspar-sdi-audio-watchdog: restart CasparCG when its DeckLink SDI audio is
# jammed (multicast has audio, the encoder appliance's program return is
# silent). See README.md and files/caspar-sdi-audio-watchdog.py.

# Before the DeckLink card: the channel's own multicast program out
# (host_vars/caspar1.yml casparcg_ffmpeg_path). CasparCG sends it from this
# host, so it is read back over multicast loopback.
caspar_sdi_audio_watchdog_pre_url: "{{ casparcg_ffmpeg_path }}?overrun_nonfatal=1&fifo_size=1000000"
# After SDI: the encoder appliance's program return, the same stream
# stream-monitoring watches.
caspar_sdi_audio_watchdog_post_url: "http://simula.frikanalen.tv:9094/frikanalen.ts"

# Fallback without fresh ATEM levels: jammed = pre above pre_min_dbfs while
# the program return is below post_max_dbfs. A dead SDI embedder measures
# about -83 dBFS RMS on the return (2026-11-16); programme sits at -20 to -30.
caspar_sdi_audio_watchdog_pre_min_dbfs: -50
caspar_sdi_audio_watchdog_post_max_dbfs: -70
# How long the jam must hold before the watchdog acts.
caspar_sdi_audio_watchdog_jam_seconds: 30
# An input with no audio for this long counts as unreadable: do nothing.
caspar_sdi_audio_watchdog_stale_seconds: 5

# Rate limits. A dry run counts too, so it logs as often as it would act.
# cooldown: between remedies for new jams. A remedy that leaves the jam in
# place (no audio on the ATEM input within verify_seconds) counts as failed:
# each failure in a row doubles the wait, up to max_backoff, and logs CRIT.
# The count resets after failure_reset_seconds of audio. With the ATEM floor
# as the trigger a false positive is very unlikely, so there is no cap per
# window by default (max_restarts 0); the 3-per-6-h cap of the first version
# left jams on air for hours.
caspar_sdi_audio_watchdog_cooldown_seconds: 600
caspar_sdi_audio_watchdog_verify_seconds: 60
caspar_sdi_audio_watchdog_max_backoff_seconds: 3600
caspar_sdi_audio_watchdog_failure_reset_seconds: 300
caspar_sdi_audio_watchdog_max_restarts: 0
caspar_sdi_audio_watchdog_window_seconds: 21600

# The same restart as by hand; playout re-cues on reconnect in ~2 s.
caspar_sdi_audio_watchdog_restart_command: "systemctl restart nodm"
# Cheaper first remedy: re-create the DeckLink consumer over AMCP
# (files/caspar-recreate-decklink.py: REMOVE 1-301, wait until it's gone,
# ADD 1-301 DECKLINK 1 EMBEDDED_AUDIO INTERNAL_KEY, check INFO 1). About a
# 1-2 s SDI break instead of a CasparCG restart and re-cue. If the script
# fails, or the jam isn't cleared within verify_seconds, the restart follows
# at once. Note: the re-added consumer gets the default buffer-depth (3);
# a configured casparcg_decklink_buffer_depth only comes back with a restart.
# Empty: always restart.
caspar_sdi_audio_watchdog_soft_remedy_command: "/usr/bin/python3 /usr/local/lib/caspar-sdi-audio-watchdog/caspar-recreate-decklink.py"

# Air check before a restart: atemkontroll (github.com/Frikanalen/atemkontroll),
# GET <url>/state. Restart only if atem_input is on program on M/E atem_me;
# another source, a transition or fade-to-black inhibits. Empty URL, an
# unreachable API or an unclear state fall back to on_unknown_program:
# "restart" (silent air is worse than a needless 2 s restart; the rate limits
# still apply) or "inhibit".
caspar_sdi_audio_watchdog_atem_url: ""
caspar_sdi_audio_watchdog_atem_token: ""
caspar_sdi_audio_watchdog_atem_input: 1
caspar_sdi_audio_watchdog_atem_me: 0
# Optional: find the input by its ATEM longName/shortName instead (falls back
# to atem_input if no input has that name), so re-patching can't break it.
caspar_sdi_audio_watchdog_atem_input_name: ""
# After a cut to CasparCG, wait this long before a jam starts to count: the
# program return lags the cut by a few seconds. Needs atem_url.
caspar_sdi_audio_watchdog_program_grace_seconds: 15
# The ATEM's own audio meter for CasparCG's input (atemkontroll /state
# "audio", atemkontroll#3) is the preferred SDI signal: it measures caspar1's
# SDI directly, whatever is on program. Jammed = the meter at its floor
# (atem_floor_dbfs, both channels; a dead input reads exactly -60, programme
# audio never went below -54 on 17-23 Nov) while the multicast isn't digital
# silence (above pre_silence_dbfs). Only audio above atem_alive_dbfs on the
# ATEM input clears the timer, so quiet music or speech can't reset it.
# Levels older than levels_stale_seconds count as unknown, and the watchdog
# falls back to the program return.
caspar_sdi_audio_watchdog_atem_floor_dbfs: -59.5
caspar_sdi_audio_watchdog_atem_alive_dbfs: -57
caspar_sdi_audio_watchdog_pre_silence_dbfs: -90
caspar_sdi_audio_watchdog_levels_stale_seconds: 3
# With the ATEM meter, also restart when CasparCG is off program: harmless,
# and it fixes the audio before CasparCG goes back on air. A transition
# involving its input still inhibits.
caspar_sdi_audio_watchdog_restart_off_program: true
caspar_sdi_audio_watchdog_on_unknown_program: restart

# Dropout detector: short gaps in each decoded stream, per rolling minute.
# A gap = all channels below dropout_noise_dbfs for dropout_min_samples (at
# 48 kHz) up to dropout_max_seconds, inside a second whose RMS is above
# dropout_context_dbfs (a pause, a fade into silence or a quiet passage never
# counts). Audio PTS holes are zero-filled by the reader, so an ffmpeg
# consumer dropping frames counts as gaps on the multicast.
caspar_sdi_audio_watchdog_dropout_noise_dbfs: -80
caspar_sdi_audio_watchdog_dropout_min_samples: 8
caspar_sdi_audio_watchdog_dropout_max_seconds: 0.2
caspar_sdi_audio_watchdog_dropout_context_dbfs: -60
# An episode = dropout_per_minute or more for dropout_sustain_seconds:
#   on the program return only -> the DeckLink path: the same remedies as a
#     jam (re-create the consumer, then restart), sharing cooldown/backoff;
#   on both outputs -> CRIT only, unless restart_on_shared_dropouts (enable
#     once a few days of data show source material doesn't trigger it: badly
#     edited files with real gaps would show on both outputs too);
#   on the multicast only -> CRIT only (the ffmpeg consumer).
caspar_sdi_audio_watchdog_dropout_per_minute: 20
caspar_sdi_audio_watchdog_dropout_sustain_seconds: 120
caspar_sdi_audio_watchdog_restart_on_shared_dropouts: false

# Audio lead detector, for the DeckLink diagnostic CasparCG build
# (casparcg-patches/0002-decklink-diag-v250.patch). It reads the card's own
# buffered audio from the build's per-second S lines. A late completion
# callback can cost the card a frame of audio lead that CasparCG never
# restores; at 0 the audio mutes (25 Nov 2026). A second is starved when the
# card held fewer than lead_starved_samples all second (960 = one frame).
# SCHED_ACCEPT ("short accept") events are NOT used: they also fire many times
# a minute with a healthy lead, and counting them caused two false re-creates
# on 25 Nov. lead_starved_seconds starved seconds in the last lead_window_seconds
# -> the same remedies as a jam (re-create the consumer, then restart), with
# their own cooldown/backoff. A second with at least lead_healthy_samples
# proves a remedy worked. Empty diag_log: off. Defaults to the
# casparcg role's CASPAR_DECKLINK_DIAG_LOG, so it follows the diag build.
caspar_sdi_audio_watchdog_diag_log: "{{ (casparcg_env | default({})).get('CASPAR_DECKLINK_DIAG_LOG', '') }}"
caspar_sdi_audio_watchdog_lead_starved_samples: 960
caspar_sdi_audio_watchdog_lead_healthy_samples: 1920
caspar_sdi_audio_watchdog_lead_window_seconds: 60
caspar_sdi_audio_watchdog_lead_starved_seconds: 30

# Source-dead detector (26 Nov 2026: CasparCG's ffmpeg producer lost the
# audio of a VP9/Opus .webm mid-play; multicast, SDI and the ATEM all went
# silent for 10 minutes while the card's lead stayed healthy, so neither the
# jam nor the lead detector could see it). Acts when, for
# source_dead_seconds: the multicast is at or below source_dead_dbfs (a dead
# producer gives exact digital zero, -120 here; the quietest programme is far
# above -100), the SDI isn't alive either, an ffmpeg file layer is playing
# with its time advancing, and the file's own audio over that stretch peaks
# above source_dead_file_min_db (ffmpeg volumedetect on the file under
# source_dead_media_dir; a file without audio, real silence or an unreadable
# file never acts). Remedy: restart CasparCG (re-creating the DeckLink
# consumer can't help), playout re-cues the item. Own cooldown/backoff; the
# file is named in the log. source_dead_layers: comma-separated layers to
# watch (empty: any). 0 seconds: off.
caspar_sdi_audio_watchdog_source_dead_seconds: 30
caspar_sdi_audio_watchdog_source_dead_dbfs: -100
caspar_sdi_audio_watchdog_source_dead_file_min_db: -60
caspar_sdi_audio_watchdog_source_dead_media_dir: "{{ casparcg_media_path | default('/mnt/media/') }}"
caspar_sdi_audio_watchdog_source_dead_layers: ""

# true: only log what it would do. host_vars set false where it should act.
caspar_sdi_audio_watchdog_dry_run: true

# node_exporter textfile collector file; skipped if the directory is missing.
caspar_sdi_audio_watchdog_metrics_file: /var/lib/prometheus/node-exporter/caspar_sdi_audio.prom

# Keep the DeckLink audio-state uprobes (files/decklink-audio-probe.bt)
# attached, for evidence at the next jam. The offsets are for one CasparCG
# build; the probe refuses to attach to any other.
caspar_sdi_audio_probe_enabled: true
caspar_sdi_audio_probe_build_id: c2fb0fce8a3c1f68572ab8c05721a3a4f4e487f6
