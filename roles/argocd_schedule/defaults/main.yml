---
# defaults for argocd_schedule role

# Schedule service app settings
argocd_schedule_app_name: schedule-service
argocd_schedule_namespace: "{{ frikanalen_app_namespace }}"
argocd_schedule_repo_url: https://github.com/Frikanalen/schedule-service.git
argocd_schedule_repo_path: chart
argocd_schedule_image_repository: ghcr.io/frikanalen/schedule-service

# Version - controls both repo revision and image tag
argocd_schedule_version: "{{ app_versions.schedule }}"

# Set true (e.g. in group_vars/staging.yml) to have Argo CD Image Updater
# track new pushes to the argocd_schedule_version tag and roll the deployment.
argocd_image_updater_enabled: false

# Helm values - only overrides from chart defaults
argocd_schedule_values:
  image:
    tag: "{{ argocd_schedule_version }}"

  timezone: "{{ timezone_region }}"

  database:
    secret: "{{ django_db_secret_name }}"
