---
- name: Read vtnet1's addresses
  ansible.builtin.command: ifconfig {{ fw_ext_if }} inet
  register: ifconfig_current
  changed_when: false
  check_mode: false

# Retiring mail1's own public address. mail.conf no longer refers to it, so
# the order against the pf reload doesn't matter.
- name: Remove the retired mail IP alias from vtnet1
  ansible.builtin.command: ifconfig {{ fw_ext_if }} -alias {{ mail_retired_ext_ip }}
  changed_when: true
  when:
    - mail_retired_ext_ip | length > 0
    - ('inet ' ~ mail_retired_ext_ip ~ ' ') in ifconfig_current.stdout

# alias0 (prod ingress) is the only other alias, so the numbering stays
# contiguous as rc.conf requires.
- name: Remove the retired mail IP alias from rc.conf
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^ifconfig_{{ fw_ext_if }}_alias[0-9]+="inet {{ mail_retired_ext_ip }}'
    state: absent
  when: mail_retired_ext_ip | length > 0

- name: Deploy mail server forwarding rules
  ansible.builtin.template:
    src: mail.conf.j2
    dest: /etc/pf.conf.d/mail.conf
    mode: "0600"
  notify: Reload pf
