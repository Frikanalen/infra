---
argument_specs:
  main:
    short_description: Forward the mail ports on the prod ingress address to the mail server
    options:
      mail_ext_ip:
        type: str
        required: false
        description: Public address the mail ports are forwarded from; defaults to prod_ingress_ext_ip.
      mail_int_ip:
        type: str
        required: false
        description: Internal address of the mail server; defaults to mail1's in data/hosts.yml.
      mail_tcp_ports:
        type: list
        elements: int
        required: false
        default: [25, 465, 587, 993]
        description: TCP ports let in from outside and hairpinned from the LAN.
      mail_retired_ext_ip:
        type: str
        required: false
        default: 158.36.191.253
        description: >-
          mail1's former public address, whose alias is removed from the
          external interface and rc.conf if present. Empty skips that.
      fw_int_if:
        type: str
        required: false
        default: vtnet0
        description: Internal interface on the utility host.
      fw_ext_if:
        type: str
        required: false
        default: vtnet1
        description: External interface on the utility host.
      fw_lan_net:
        type: str
        required: false
        default: 192.168.3.0/24
        description: Internal network, in CIDR form.
