---
- name: Add the External Secrets Helm repository
  kubernetes.core.helm_repository:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: external-secrets
    repo_url: https://charts.external-secrets.io
  become: true
  run_once: true

- name: Install External Secrets Operator via Helm
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_kubeconfig }}"
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: "{{ external_secrets_chart_version }}"
    release_namespace: "{{ external_secrets_namespace }}"
    create_namespace: true
    wait: true
    values:
      installCRDs: true
      serviceMonitor:
        enabled: "{{ k8s_monitoring_enabled | bool }}"
  become: true
  run_once: true

- name: Read OpenBao's CA certificate
  ansible.builtin.slurp:
    src: "{{ external_secrets_openbao_ca_path }}"
  delegate_to: "{{ external_secrets_openbao_host }}"
  register: external_secrets_openbao_ca
  become: true

- name: Publish OpenBao's CA certificate to the operator
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openbao-ca
        namespace: "{{ external_secrets_namespace }}"
      data:
        ca.crt: "{{ external_secrets_openbao_ca.content | b64decode }}"
  become: true

- name: Create the ClusterSecretStore every ExternalSecret uses
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: "{{ external_secrets_store_name }}"
      spec:
        provider:
          vault:
            server: "{{ external_secrets_openbao_server }}"
            path: "{{ external_secrets_openbao_kv_mount }}"
            version: v2
            caProvider:
              type: ConfigMap
              namespace: "{{ external_secrets_namespace }}"
              name: openbao-ca
              key: ca.crt
            auth:
              kubernetes:
                mountPath: "kubernetes-{{ openbao_env }}"
                role: eso
                serviceAccountRef:
                  name: external-secrets
                  namespace: "{{ external_secrets_namespace }}"
  become: true
