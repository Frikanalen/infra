---
- name: Deploy Frontend via ArgoCD Application
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'application.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy Frontend Argo CD Image Updater tracking
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'image-updater.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
  when: argocd_image_updater_enabled | bool
