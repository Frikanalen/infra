---
# defaults for db_backup_retention role
#
# Kubegres's own backup CronJob (see roles/kubegres_backup) has no retention
# logic of its own -- it just writes another timestamped dump on every run
# -- so this is what keeps /util/k8s from growing forever.

db_backup_retention_path: "{{ db_backup_export_path }}"

# Matches the "postgres" user (uid/gid 999) that Kubegres's backup CronJob
# runs as -- see the comment on db_backup_export_path in
# group_vars/storage.yml.
db_backup_retention_owner: 999
db_backup_retention_group: 999

db_backup_retention_days: 14

# Daily, clear of the backup CronJob itself -- see
# roles/kubegres_backup's kubegres_backup_schedule (03:00).
db_backup_retention_cron_hour: "4"
db_backup_retention_cron_minute: "0"
