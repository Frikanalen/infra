---
- name: Ensure database backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ db_backup_retention_owner }}"
    group: "{{ db_backup_retention_group }}"
    mode: "0750"
  loop: "{{ db_backup_retention_paths }}"
  become: true

- name: Install daily prune of old database backups
  ansible.builtin.cron:
    name: "Prune old Kubegres backups"
    user: root
    hour: "{{ db_backup_retention_cron_hour }}"
    minute: "{{ db_backup_retention_cron_minute }}"
    # Kubegres's backup_database.sh names its dumps
    # "$KUBEGRES_RESOURCE_NAME-backup-$fileDt.gz"; roles/cnpg_backup writes
    # "pgcluster-backup-<stamp>.pgdump". Both match '*-backup-*'.
    job: >-
      find {{ db_backup_retention_paths | join(' ') }} -maxdepth 1 -name '*-backup-*' -mtime +{{ db_backup_retention_days }} -delete
  become: true
