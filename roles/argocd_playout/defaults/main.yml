---
# defaults for argocd_playout role

# Playout app settings
argocd_playout_app_name: playout
argocd_playout_namespace: "{{ frikanalen_app_namespace }}"
argocd_playout_repo_url: https://github.com/Frikanalen/playout.git
argocd_playout_repo_path: chart
argocd_playout_image_repository: ghcr.io/frikanalen/playout

# Version - controls both repo revision and image tag
argocd_playout_version: "{{ app_versions.playout }}"

# Set true (e.g. in group_vars/staging.yml) to have Argo CD Image Updater
# track new pushes to the argocd_playout_version tag and roll the deployment.
argocd_image_updater_enabled: false

# Helm values - only overrides from chart defaults
argocd_playout_values:
  image:
    repository: "{{ argocd_playout_image_repository }}"
    tag: "{{ argocd_playout_version }}"
  
  env:
    - name: USE_ORIGINAL
      value: "true"
    - name: CASPAR_HOST
      value: "{{ caspar_host }}"
    - name: API_URL
      value: "{{ frikanalen_scheme }}://{{ frikanalen_domain }}/"
    - name: GRAPHICS_URL
      value: "{{ frikanalen_scheme }}://{{ frikanalen_domain }}/graphics/"
  
  timezone:
    enabled: true
    path: "/usr/share/zoneinfo/{{ timezone_region }}"
