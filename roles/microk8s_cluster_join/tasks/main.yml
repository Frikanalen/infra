---
- name: Ensure the seed play has run
  ansible.builtin.assert:
    that:
      - microk8s_seed_host is defined
      - hostvars[microk8s_seed_host].microk8s_pending_members is defined
    fail_msg: >-
      {{ microk8s_seed_host | default('The seed host') }} has not reported
      cluster membership. This role reads it from the seed play, so the two
      run together -- select the "bootstrap" tag rather than "join" alone.

# The seed worked out who is missing; anyone already in the cluster does
# nothing here. See roles/microk8s_cluster_seed.
- name: Join the cluster
  when: inventory_hostname in hostvars[microk8s_seed_host].microk8s_pending_members
  block:
    - name: Join MicroK8s cluster (control-plane node)
      ansible.builtin.command: "{{ hostvars[microk8s_seed_host]['microk8s_join_command'] }}"
      environment:
        PATH: "/snap/bin:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
      become: true
      register: microk8s_join
      # Kept even though the seed now filters on membership: the node list and
      # the join race each other if two runs overlap, and "already" is still
      # the right answer to that.
      failed_when: >
        microk8s_join.rc != 0 and
        'already' not in (microk8s_join.stdout | default('')) and
        'already' not in (microk8s_join.stderr | default(''))
      changed_when: microk8s_join.rc == 0

    - name: Wait for MicroK8s to be ready after join
      ansible.builtin.command: microk8s status --wait-ready
      environment:
        PATH: "/snap/bin:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
      become: true
      changed_when: false
