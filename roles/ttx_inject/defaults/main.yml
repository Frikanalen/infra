---
# ttx-inject: the SDI side of the teletext service. ttxd itself runs in Kubernetes
# (the teletext chart, namespace teletext); this connects to it and puts each frame
# on the DeckLink output as OP-47.

# Frikanalen/teletext release to install. Its ttx-inject binary and checksum are
# downloaded from the GitHub release.
ttx_inject_version: "0.3.0"
ttx_inject_release_url: "https://github.com/Frikanalen/teletext/releases/download/v{{ ttx_inject_version }}"
ttx_inject_asset: ttx-inject-x86_64-linux-gnu

# ttxd's injector link: the ttxd-link LoadBalancer Service in the cluster.
ttx_inject_ttxd: "{{ host_config['ingress-dev-teletext'].ip_cidr.split('/')[0] }}:4243"

ttx_inject_decklink_device: "DeckLink Duo (2)"
ttx_inject_vanc_line: 9
ttx_inject_op47_lines: [7, 8, 9, 10, 11]
# Frames asked for ahead of the card (20 ms each).
ttx_inject_buffer_frames: 2
# Replay the last carousel cycle after this long without frames from ttxd.
ttx_inject_replay_after_ms: 500
ttx_inject_timezone: Europe/Oslo
