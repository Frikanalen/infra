---
- name: Stop these StorageClasses being the default
  become: true
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ k8s_kubeconfig }}"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ item }}"
    definition:
      metadata:
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
  loop: "{{ k8s_default_storage_class_unset }}"
