---
- name: Install pip
  ansible.builtin.apt:
    name: python3-pip
    state: present
  become: true

# Debian's python3-kubernetes predates a 2022 upstream fix for CRDs with a
# property literally named "self" (kubernetes-client/python#1715), which
# breaks kubernetes.core.k8s on any such CRD. Pip installs to /usr/local/lib,
# which takes priority over apt's /usr/lib on sys.path, so this shadows it.
# Pinned below 36.0.0, which bumped its PyYAML requirement to >=6.0.3 --
# the apt-installed PyYAML 6.0.1 has no RECORD file (dpkg-owned), so pip
# can't uninstall it to satisfy that, and fails ("Cannot uninstall PyYAML
# 6.0.1, RECORD file not found"). Versions below 36.0.0 only need
# pyyaml>=5.4.1, which 6.0.1 already satisfies, so pip never touches it.
- name: Install a kubernetes Python library new enough to handle CRDs with a "self" field
  ansible.builtin.pip:
    name: "kubernetes>=24.2.0,<36.0.0"
    state: present
    extra_args: --break-system-packages
  become: true

- name: Add external-dns Helm repository
  kubernetes.core.helm_repository:
    name: external-dns
    repo_url: https://kubernetes-sigs.github.io/external-dns/
  become: false
  run_once: true

- name: Ensure IngressClass exists for external_dns_ingress_class
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: IngressClass
      metadata:
        name: "{{ external_dns_ingress_class }}"
      spec:
        controller: traefik.io/ingress-controller
  when: external_dns_manage_ingress_class
  become: false
  run_once: true

- name: Install external-dns via Helm
  kubernetes.core.helm:
    name: "{{ external_dns_release_name }}"
    chart_ref: external-dns/external-dns
    chart_version: "{{ external_dns_chart_version | default(omit, true) }}"
    release_namespace: "{{ external_dns_namespace }}"
    create_namespace: true
    wait: true
    values:
      provider:
        name: rfc2136
      sources:
        - ingress
      policy: "{{ external_dns_policy }}"
      txtOwnerId: "{{ external_dns_txt_owner_id }}"
      txtPrefix: "{{ external_dns_txt_prefix }}"
      domainFilters:
        - "{{ external_dns_domain_filter }}"
      extraArgs:
        - --ingress-class={{ external_dns_ingress_class }}
        - --default-targets={{ external_dns_default_target }}
        - --force-default-targets
        - --rfc2136-host={{ external_dns_rfc2136_host }}
        - --rfc2136-port={{ external_dns_rfc2136_port }}
        - --rfc2136-zone={{ external_dns_rfc2136_zone }}
        - --rfc2136-tsig-keyname={{ external_dns_rfc2136_tsig_keyname }}
        - --rfc2136-tsig-secret-alg={{ external_dns_rfc2136_tsig_secret_alg }}
        - --rfc2136-tsig-axfr
        - --rfc2136-tsig-secret={{ external_dns_rfc2136_tsig_secret }}
  become: false
  run_once: true
  no_log: true

- name: Wait for external-dns to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ external_dns_namespace }}"
    name: "{{ external_dns_release_name }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: false
  run_once: true
