---
- name: Install BIND
  become: true
  community.general.pkgng:
    name: "{{ dns_bind_package }}"
    state: present

- name: Ensure zone directory exists
  become: true
  ansible.builtin.file:
    path: "{{ dns_zone_dir }}"
    state: directory
    owner: bind
    group: bind
    mode: "0755"

- name: Ensure named.conf.d directory exists
  become: true
  ansible.builtin.file:
    path: "{{ dns_named_conf_d }}"
    state: directory
    owner: bind
    group: bind
    mode: "0755"

- name: Render named.conf
  become: true
  ansible.builtin.template:
    src: "named.conf.j2"
    dest: "{{ dns_named_conf }}"
    owner: bind
    group: bind
    mode: "0644"
  notify: Restart named
- name: Enable and start named service
  become: true
  ansible.builtin.service:
    name: named
    state: started
    enabled: true
