---
- name: Add MetalLB Helm repository
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: https://metallb.github.io/metallb
  become: false
  run_once: true

- name: Install MetalLB via Helm
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    chart_version: "{{ metallb_chart_version | default(omit, true) }}"
    release_namespace: "{{ metallb_namespace }}"
    create_namespace: true
    wait: true
    values:
      prometheus:
        # kube-prometheus-stack's Prometheus already has a ClusterRole/
        # ClusterRoleBinding covering endpoints/services/pods across all
        # namespaces, so this chart's own namespace-scoped Role/RoleBinding
        # (rbacPrometheus, on by default) is redundant -- and it hard-requires
        # prometheus.serviceAccount/namespace to be set when serviceMonitor.
        # enabled is true, which would otherwise tie this role to
        # kube-prometheus-stack's exact release naming.
        rbacPrometheus: false
        serviceMonitor:
          enabled: "{{ k8s_monitoring_enabled }}"
  become: false
  run_once: true

- name: Wait for MetalLB controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ metallb_namespace }}"
    name: metallb-controller
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: false
  run_once: true

- name: Create MetalLB Grafana dashboard ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: metallb-grafana-dashboard
        namespace: "{{ metallb_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        metallb-dashboard.json: "{{ lookup('file', 'metallb-dashboard.json') }}"
  become: false
  run_once: true
  when: k8s_monitoring_enabled | bool

- name: Configure MetalLB L2 advertisement
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default
        namespace: "{{ metallb_namespace }}"
      spec: {}
  become: false
  run_once: true

- name: Configure MetalLB IP address pool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: ingress-pool
        namespace: "{{ metallb_namespace }}"
      spec:
        addresses:
          - "{{ metallb_ingress_ip }}"
  become: false
  run_once: true
