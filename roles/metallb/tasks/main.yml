- name: Install pip
  ansible.builtin.apt:
    name: python3-pip
    state: present
  become: true

# Debian's python3-kubernetes predates a 2022 upstream fix for CRDs with a
# property literally named "self" (kubernetes-client/python#1715), which
# breaks kubernetes.core.k8s on any such CRD. Pip installs to /usr/local/lib,
# which takes priority over apt's /usr/lib on sys.path, so this shadows it.
# Pinned below 36.0.0, which bumped its PyYAML requirement to >=6.0.3 --
# the apt-installed PyYAML 6.0.1 has no RECORD file (dpkg-owned), so pip
# can't uninstall it to satisfy that, and fails ("Cannot uninstall PyYAML
# 6.0.1, RECORD file not found"). Versions below 36.0.0 only need
# pyyaml>=5.4.1, which 6.0.1 already satisfies, so pip never touches it.
- name: Install a kubernetes Python library new enough to handle CRDs with a "self" field
  ansible.builtin.pip:
    name: "kubernetes>=24.2.0,<36.0.0"
    state: present
    extra_args: --break-system-packages
  become: true

- name: Add MetalLB Helm repository
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: https://metallb.github.io/metallb
  become: false
  run_once: true

- name: Install MetalLB via Helm
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    chart_version: "{{ metallb_chart_version | default(omit, true) }}"
    release_namespace: "{{ metallb_namespace }}"
    create_namespace: true
    wait: true
    values:
      prometheus:
        # kube-prometheus-stack's Prometheus already has a ClusterRole/
        # ClusterRoleBinding covering endpoints/services/pods across all
        # namespaces, so this chart's own namespace-scoped Role/RoleBinding
        # (rbacPrometheus, on by default) is redundant -- and it hard-requires
        # prometheus.serviceAccount/namespace to be set when serviceMonitor.
        # enabled is true, which would otherwise tie this role to
        # kube-prometheus-stack's exact release naming.
        rbacPrometheus: false
        serviceMonitor:
          enabled: true
  become: false
  run_once: true

- name: Wait for MetalLB controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ metallb_namespace }}"
    name: metallb-controller
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  become: false
  run_once: true

- name: Create MetalLB Grafana dashboard ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: metallb-grafana-dashboard
        namespace: "{{ metallb_namespace }}"
        labels:
          grafana_dashboard: "1"
      data:
        metallb-dashboard.json: "{{ lookup('file', 'metallb-dashboard.json') }}"
  become: false
  run_once: true

- name: Configure MetalLB L2 advertisement
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default
        namespace: "{{ metallb_namespace }}"
      spec: {}
  become: false
  run_once: true

- name: Configure MetalLB IP address pool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: ingress-pool
        namespace: "{{ metallb_namespace }}"
      spec:
        addresses:
          - "{{ metallb_ingress_ip }}"
  become: false
  run_once: true
