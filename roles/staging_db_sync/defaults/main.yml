---
# Retired 2026-11: the weekly prod -> staging database refresh is now two
# Kubernetes CronJobs (a prod dump to Garage in the clusters repo, and the
# restore in the django-api chart, enabled on staging). This role only
# removes what the old host cron job left on dev-kube-1, including the prod
# cluster-admin kubeconfig it used.
staging_db_sync_kubeconfig_path: /etc/frikanalen/kubeconfig-prod
staging_db_sync_script_path: /usr/local/sbin/staging-db-sync.sh
