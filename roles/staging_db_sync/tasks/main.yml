---
# See defaults/main.yml: this role now only takes the old host cron job down.
# /var/log/staging-db-sync.log is left in place as a record.

- name: Remove the weekly staging database refresh cron job
  ansible.builtin.cron:
    name: "Refresh staging database from prod"
    user: root
    state: absent
  become: true

- name: Remove the old refresh script
  ansible.builtin.file:
    path: "{{ staging_db_sync_script_path }}"
    state: absent
  become: true

- name: Remove the prod cluster-admin kubeconfig from this staging node
  ansible.builtin.file:
    path: "{{ staging_db_sync_kubeconfig_path }}"
    state: absent
  become: true
