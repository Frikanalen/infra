---
# Owns the archive credential end to end: the account on the storage host, the
# keypair, and the Kubernetes secret ingest reads it from.
#
# The secret is the only copy of the private key. On first run there is no
# secret, so a key is generated and authorised; on every run after that the
# existing key is read back and left alone. Losing the secret is recoverable —
# re-running this generates a new key and replaces the authorised one.

- name: Look for an existing archive key
  become: yes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ingest_archive_secret_name }}"
    namespace: "{{ ingest_archive_namespace }}"
    kubeconfig: "{{ argocd_kubeconfig }}"
  register: ingest_archive_secret_lookup

- name: Note whether a usable key already exists
  ansible.builtin.set_fact:
    # Both halves must be present. A secret carrying only the private key
    # predates this role and is treated as no key, so it gets regenerated
    # rather than leaving authorized_keys unreconcilable.
    ingest_archive_key_exists: >-
      {{ (ingest_archive_secret_lookup.resources | length > 0)
         and ('id_ed25519' in (ingest_archive_secret_lookup.resources[0].data | default({})))
         and ('id_ed25519.pub' in (ingest_archive_secret_lookup.resources[0].data | default({}))) }}

- name: Generate an archive keypair
  when: not (ingest_archive_key_exists | bool)
  delegate_to: localhost
  become: no
  block:
    - name: Create a temporary directory for key generation
      ansible.builtin.tempfile:
        state: directory
        suffix: ingest-archive-key
      register: ingest_archive_keydir

    - name: Generate the keypair
      # No passphrase: nothing can type one in when the pod starts.
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "{{ ingest_archive_key_comment }}"
          - -f
          - "{{ ingest_archive_keydir.path }}/id_ed25519"
      changed_when: true

    - name: Read the generated keypair
      ansible.builtin.slurp:
        src: "{{ ingest_archive_keydir.path }}/{{ item }}"
      loop:
        - id_ed25519
        - id_ed25519.pub
      register: ingest_archive_generated
      no_log: true
  always:
    - name: Remove the generated key material from disk
      ansible.builtin.file:
        path: "{{ ingest_archive_keydir.path }}"
        state: absent
      when: ingest_archive_keydir.path is defined

- name: Settle on the archive key material
  no_log: true
  ansible.builtin.set_fact:
    ingest_archive_private_key: >-
      {{ (ingest_archive_secret_lookup.resources[0].data['id_ed25519'] | b64decode)
         if (ingest_archive_key_exists | bool)
         else (ingest_archive_generated.results[0].content | b64decode) }}
    ingest_archive_public_key: >-
      {{ (ingest_archive_secret_lookup.resources[0].data['id_ed25519.pub'] | b64decode)
         if (ingest_archive_key_exists | bool)
         else (ingest_archive_generated.results[1].content | b64decode) }}

- name: Provision the account on the archive host
  delegate_to: "{{ ingest_archive_host }}"
  become: yes
  block:
    - name: Ensure the archive account exists
      # nologin is safe with a forced internal-sftp command: sshd serves SFTP
      # in-process and never runs the account's shell.
      #
      # Membership of ingest_archive_group is what grants write access to an
      # archive that already exists: /archive/media is group-writable by the
      # group that owns it. It is deliberately set for production only, so
      # staging cannot reach the production archive — keep it that way.
      ansible.builtin.user:
        name: "{{ ingest_archive_user }}"
        system: yes
        create_home: yes
        home: "/home/{{ ingest_archive_user }}"
        shell: /usr/sbin/nologin
        groups: "{{ [ingest_archive_group] if ingest_archive_group else omit }}"
        append: yes
        state: present

    - name: Check whether the archive directory exists
      ansible.builtin.stat:
        path: "{{ ingest_archive_dir }}"
      register: ingest_archive_dir_stat

    - name: Create the archive directory
      # Only when absent. The production archive is already there and served
      # over NFS, so its ownership is not ours to restyle.
      ansible.builtin.file:
        path: "{{ ingest_archive_dir }}"
        state: directory
        owner: "{{ ingest_archive_user }}"
        group: "{{ ingest_archive_user }}"
        mode: '2775'
      when: not ingest_archive_dir_stat.stat.exists

    - name: Authorise the archive key
      # exclusive: the account exists only for ingest, so this drops any key
      # this role did not put there and makes rotation self-cleaning.
      ansible.builtin.authorized_key:
        user: "{{ ingest_archive_user }}"
        key: "{{ ingest_archive_public_key }}"
        key_options: "{{ ingest_archive_key_options }}"
        exclusive: yes
        state: present

    - name: Check the archive account can write to the archive directory
      # No -s: runuser rejects it alongside -u, and without it the command is
      # exec'd directly rather than through the account's nologin shell.
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ ingest_archive_user }}"
          - --
          - test
          - -w
          - "{{ ingest_archive_dir }}"
      changed_when: false
      failed_when: false
      register: ingest_archive_writable

    - name: Verify the archive account can write to the archive directory
      # Turns a silent "ingest cannot archive anything" into a failed play.
      ansible.builtin.assert:
        that:
          - ingest_archive_writable.rc == 0
        fail_msg: >-
          {{ ingest_archive_user }} cannot write to {{ ingest_archive_dir }}.
          Set ingest_archive_group to a group with write access to it, as
          prod does, or fix the directory's permissions. Check with
          `ls -ld {{ ingest_archive_dir }}` and `id {{ ingest_archive_user }}`.

    - name: Read the archive host's SSH host key
      ansible.builtin.slurp:
        src: "/etc/ssh/ssh_host_{{ ingest_archive_host_key_type }}_key.pub"
      register: ingest_archive_host_key

- name: Build the known_hosts entry
  ansible.builtin.set_fact:
    # Taken from the host itself rather than ssh-keyscan, so there is no
    # trust-on-first-use window to get wrong. A non-default port is spelled
    # [host]:port, and only the type and key fields of the .pub file are used
    # since the trailing comment is not part of a known_hosts entry.
    ingest_archive_known_hosts: "{{ ingest_archive_known_hosts_name }} {{ ingest_archive_host_key_fields }}"
  vars:
    ingest_archive_known_hosts_name: >-
      {{ ingest_archive_host if (ingest_archive_port | int) == 22
         else '[' ~ ingest_archive_host ~ ']:' ~ ingest_archive_port }}
    ingest_archive_host_key_fields: >-
      {{ (ingest_archive_host_key.content | b64decode).split()[0:2] | join(' ') }}

- name: Store the archive credentials in Kubernetes
  become: yes
  no_log: true
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'ssh-secret.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
