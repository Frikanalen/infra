---
# defaults for kube_prometheus_stack role
#
# Installs the Prometheus Operator, Prometheus, Alertmanager and Grafana via
# the prometheus-community/kube-prometheus-stack chart, with ingresses for
# Grafana/Prometheus/Alertmanager on the cluster's internal-only zone -- see
# group_vars (frikanalen_intern_zone) and roles/external_dns's
# external-dns-internal instance, which is what actually publishes these
# hostnames.

kube_prometheus_stack_chart_version: "{{ helm_chart_versions.kube_prometheus_stack }}"
kube_prometheus_stack_namespace: monitoring

# Same ingress class/cert resolver as any other internal-only ingress on
# this cluster -- see roles/media_server/templates/ingress.yml.j2 for the
# public equivalent.
kube_prometheus_stack_ingress_class: "{{ frikanalen_intern_ingress_class }}"
kube_prometheus_stack_cert_resolver: letsencrypt

kube_prometheus_stack_grafana_hostname: "grafana.{{ frikanalen_intern_zone }}"
kube_prometheus_stack_prometheus_hostname: "prometheus.{{ frikanalen_intern_zone }}"
kube_prometheus_stack_alertmanager_hostname: "alertmanager.{{ frikanalen_intern_zone }}"

# Telegram is Alertmanager's native mobile-chat receiver. Keep both values in
# the Ansible vault; the role copies them to a Kubernetes Secret and mounts the
# individual files read by Alertmanager, so neither credential is rendered
# into Helm's release values/config Secret.
kube_prometheus_stack_telegram_secret_name: alertmanager-telegram
kube_prometheus_stack_telegram_bot_token: "{{ vault_alertmanager_telegram_bot_token | default('') }}"
kube_prometheus_stack_telegram_chat_id: "{{ vault_alertmanager_telegram_chat_id | default('') }}"

# Added to every alert by Prometheus, making alerts from the two clusters easy
# to distinguish when they share a Telegram channel.
kube_prometheus_stack_environment: "{{ inventory_hostname }}"

# Persistent storage for Prometheus and Alertmanager. ceph-rbd (the Proxmox
# Ceph cluster, roles/rook_ceph_external) because it follows the pod to any
# node, unlike local-ssd, which pins it to one.
kube_prometheus_stack_storage_class: ceph-rbd
kube_prometheus_stack_retention: 15d
kube_prometheus_stack_prometheus_storage_size: 30Gi
kube_prometheus_stack_alertmanager_storage_size: 1Gi
