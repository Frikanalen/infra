# Rules of our own, loaded on both clusters through the chart's
# additionalPrometheusRulesMap (see tasks/main.yml).
groups:
  - name: frikanalen-node
    rules:
      - alert: NodeMemoryHighUtilization
        # The mixin's rule minus its blind spot: ZFS's ARC shrinks under
        # memory pressure like the page cache does, but the kernel doesn't
        # count it in MemAvailable. Count the ARC above its floor (c_min) as
        # available. Hosts without ZFS fall through the `or` and add 0.
        expr: >-
          100 * (1 - (
            node_memory_MemAvailable_bytes{job="node-exporter"}
            + on(instance) group_left()
              (
                clamp_min(node_zfs_arc_size{job="node-exporter"} - node_zfs_arc_c_min{job="node-exporter"}, 0)
                or 0 * node_memory_MemAvailable_bytes{job="node-exporter"}
              )
          ) / node_memory_MemTotal_bytes{job="node-exporter"}) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host is running out of memory.
          description: >-
            Memory on {{ $labels.instance }} has been above 90% for 15
            minutes, not counting reclaimable ZFS ARC, and is at
            {{ $value | printf "%.2f" }}%.

      - alert: NodeDiskIOSaturation
        # The mixin's rule without dm-* devices. On the Proxmox hosts those
        # are thin LVs, and a thin LV whose guest mounts with online
        # discard shows a queue of 10+ that is dm-thin's own work, not load
        # on the disks below it. The physical devices (sd*, nvme*, md*)
        # and every VM's own disk still have this alert.
        expr: >-
          rate(node_disk_io_time_weighted_seconds_total{job="node-exporter",
            device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|md.+|dasd.+)"}[5m]) > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Disk IO queue is high.
          description: >-
            Disk IO queue (aqu-sq) is high on {{ $labels.device }} at
            {{ $labels.instance }}, has been above 10 for the last 30
            minutes, is currently at {{ $value | printf "%.2f" }}.

      - alert: NodeCPUSaturated
        # The mixin's NodeCPUHighUsage is severity info, which InfoInhibitor
        # silences, so a node pinned at 99% for three hours (dev-kube-2 on
        # 2026-11-13, starving the live stream packager) told nobody. Every
        # core busy for half an hour means something on that node is not
        # getting the CPU it wants.
        expr: >-
          100 * (1 - avg without (cpu, mode) (
            rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])
          )) > 95
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Every CPU on a host is busy.
          description: >-
            CPU on {{ $labels.instance }} has been more than 95% busy for 30
            minutes and is at {{ $value | printf "%.1f" }}%. Latency-sensitive
            workloads there (the live stream packager, playout) may be
            starved; look for batch work such as ingest transcodes.

      - alert: NodeSystemdServiceFailed
        # The mixin's rule, minus apport's per-crash coredump hook units
        # (apport-coredump-hook@<n>-<pid>-<n>.service). One of those fails
        # whenever a process crashes and stays failed until reset, so on
        # caspar1 every CasparCG crash turned into a days-long warning about
        # the crash *handler*. Crashes themselves are better caught by the
        # thing that crashed (playout, the SDI watchdog).
        expr: >-
          node_systemd_unit_state{job="node-exporter", state="failed",
            name!~"apport-coredump-hook@.*"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A systemd service has failed.
          description: >-
            {{ $labels.name }} on {{ $labels.instance }} is in the failed
            state. If it is expected, fix it in Ansible (disable or mask the
            unit) rather than letting it sit here.

  - name: frikanalen-cronjobs
    rules:
      # KubeJobFailed only says that one run failed, and goes quiet once the
      # failed Job is cleaned up. These say whether the latest scheduled run
      # worked, whatever the schedule: daily backups and the weekly staging
      # refresh alike. (A fixed "no success for 26 h" fired every week for
      # the weekly jobs.)
      #
      # Severity: "high" for anything prod depends on (backups); jobs whose
      # only purpose is feeding staging (staging-*) are a "warning", even
      # when they run on the prod cluster.
      - alert: KubeJobFailed
        # The mixin's rule for Jobs created by hand or by an operator.
        # CronJob-owned Jobs are left to KubeCronJobLastRunFailed below.
        expr: >-
          kube_job_failed{job="kube-state-metrics", condition="true"} > 0
          unless on(namespace, job_name)
          kube_job_owner{job="kube-state-metrics", owner_kind="CronJob"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Job failed to complete.
          description: >-
            Job {{ $labels.namespace }}/{{ $labels.job_name }} failed. Read
            its pod's log; delete the Job once dealt with, or this stays on.

      - alert: KubeCronJobLastRunFailed
        expr: >-
          (
            kube_cronjob_status_last_schedule_time{cronjob!~"staging-.*"}
              > on(namespace, cronjob) (kube_cronjob_status_last_successful_time or kube_cronjob_status_last_schedule_time * 0)
          )
          and on(namespace, cronjob) (time() - kube_cronjob_status_last_schedule_time) > 3 * 3600
          and on(namespace, cronjob) kube_cronjob_spec_suspend == 0
          unless on(namespace, cronjob) kube_cronjob_status_active > 0
        labels:
          severity: high
        annotations:
          summary: The latest run of a CronJob has not succeeded.
          description: >-
            CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} was last
            scheduled over 3 hours ago and that run has not succeeded. Check
            the Job's pod logs.

      - alert: KubeCronJobLastRunFailed
        expr: >-
          (
            kube_cronjob_status_last_schedule_time{cronjob=~"staging-.*"}
              > on(namespace, cronjob) (kube_cronjob_status_last_successful_time or kube_cronjob_status_last_schedule_time * 0)
          )
          and on(namespace, cronjob) (time() - kube_cronjob_status_last_schedule_time) > 3 * 3600
          and on(namespace, cronjob) kube_cronjob_spec_suspend == 0
          unless on(namespace, cronjob) kube_cronjob_status_active > 0
        labels:
          severity: warning
        annotations:
          summary: The latest run of a staging refresh job has not succeeded.
          description: >-
            CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} only feeds
            staging; its last run, over 3 hours ago, has not succeeded.

  - name: frikanalen-kubernetes
    rules:
      - alert: KubeAPIWatchStale
        # On 2026-11-23 the kine watch loop on prod-kube-1 and -2 stalled
        # for about an hour after repeated dqlite leader loss. Their API
        # servers kept answering requests (up, apiserver_request_total all
        # normal) but delivered no watch events, so controllers and CSI on
        # those nodes acted on a frozen picture of the cluster, and nothing
        # alerted. Every node renews its Lease every ~10 s, so each API
        # server normally receives ~5 lease events a second from storage;
        # zero (or the series vanishing while the scrape is up) while the
        # cluster as a whole still sees them means that node's watch is
        # stuck. On 2026-11-16 restarting k8s-dqlite on the node cleared it;
        # restarting kubelite alone did not.
        expr: >-
          (
            sum by (instance) (rate(apiserver_storage_events_received_total{job="apiserver", resource="leases"}[5m]))
            or on(instance) (0 * group by (instance) (up{job="apiserver"}))
          ) == 0
          and on() sum(rate(apiserver_storage_events_received_total{job="apiserver", resource="leases"}[5m])) > 1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: An API server has stopped receiving watch events.
          description: >-
            The API server at {{ $labels.instance }} has received no Lease
            events from storage for 5 minutes while the others still do: its
            watch feed (kine/dqlite) is stuck, so controllers, CSI and
            kubelets talking to it see stale state. Check that dqlite has a
            leader, then restart dqlite on that node (sudo snap restart
            microk8s.daemon-k8s-dqlite); restarting kubelite alone has not
            helped before.
