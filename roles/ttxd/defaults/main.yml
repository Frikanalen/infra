---
# ttxd, Frikanalen's teletext server (github.com/Frikanalen/teletext): a page
# store with an HTTP API that puts OP-47 teletext in the VANC of a DeckLink
# SDI output. Installed from the binary attached to a teletext GitHub release
# (built on Ubuntu 24.04 with DeckLink support). At run time it needs
# libDeckLinkAPI.so from roles/blackmagic_desktopvideo.

# Release to install (tag without the "v").
ttxd_version: "0.2.0"
ttxd_release_url: "https://github.com/Frikanalen/teletext/releases/download/v{{ ttxd_version }}"
ttxd_asset: ttxd-x86_64-linux-gnu

# Output: DeckLink display name and the VANC line carrying the OP-47 packet.
ttxd_decklink_device: "DeckLink Duo (2)"
ttxd_vanc_line: 9
ttxd_op47_lines: [7, 8, 9, 10, 11]

ttxd_listen: "0.0.0.0:8080"
# Raw T42 packets for debugging (nc 127.0.0.1 4242 > dump.t42).
ttxd_t42_listen: "127.0.0.1:4242"
ttxd_service_name: FRIKANALEN
# The page header clock shows local time.
ttxd_timezone: Europe/Oslo

# Who may write which pages. Tokens live in group_vars/all/vault.yml.
ttxd_publishers:
  - name: pages
    token: "{{ vault_ttxd_pages_token }}"
    pages: ["100-7FF"]
    flash_per_sec: 100
  - name: subtitles
    token: "{{ vault_ttxd_subtitles_token }}"
    pages: ["888"]
    subtitles: true
