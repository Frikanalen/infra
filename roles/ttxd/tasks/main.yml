---
- name: Install the ttxd release binary
  ansible.builtin.get_url:
    url: "{{ ttxd_release_url }}/{{ ttxd_asset }}"
    checksum: "sha256:{{ ttxd_release_url }}/{{ ttxd_asset }}.sha256"
    dest: /usr/local/bin/ttxd
    mode: "0755"
  notify: Restart ttxd

# ttxd used to be built on the host; remove what that left behind.
- name: Remove the old on-host build
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/src/teletext
    - /usr/local/src/rustup-init
    - /opt/rust

- name: Create the ttxd user
  ansible.builtin.user:
    name: ttxd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/ttxd
    create_home: false

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/ttxd
    state: directory
    owner: root
    group: ttxd
    mode: "0750"

- name: Install the ttxd config
  ansible.builtin.template:
    src: ttxd.toml.j2
    dest: /etc/ttxd/ttxd.toml
    owner: root
    group: ttxd
    mode: "0640"
  diff: false  # holds publisher tokens
  notify: Restart ttxd

- name: Install the ttxd service
  ansible.builtin.template:
    src: ttxd.service.j2
    dest: /etc/systemd/system/ttxd.service
    mode: "0644"
  notify: Restart ttxd

- name: Enable and start ttxd
  ansible.builtin.systemd_service:
    name: ttxd
    enabled: true
    state: started
    daemon_reload: true
