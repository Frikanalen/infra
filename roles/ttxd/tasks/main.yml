---
- name: Check for the DeckLink SDK headers
  ansible.builtin.stat:
    path: "{{ ttxd_decklink_sdk_include }}/DeckLinkAPI.h"
  register: ttxd_sdk_header

- name: Require the DeckLink SDK headers
  ansible.builtin.assert:
    that: ttxd_sdk_header.stat.exists
    fail_msg: >-
      {{ ttxd_decklink_sdk_include }}/DeckLinkAPI.h is missing. Run
      roles/decklink_test_pattern first (it unpacks the SDK), or set
      ttxd_decklink_sdk_include.

- name: Install build dependencies
  ansible.builtin.apt:
    name: [build-essential, git]
    update_cache: true
    cache_valid_time: 3600

- name: Download rustup-init
  ansible.builtin.get_url:
    url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
    dest: /usr/local/src/rustup-init
    mode: "0755"

- name: Install the Rust toolchain
  ansible.builtin.command:
    argv:
      - /usr/local/src/rustup-init
      - -y
      - --no-modify-path
      - --profile
      - minimal
      - --default-toolchain
      - "{{ ttxd_rust_toolchain }}"
    creates: "{{ ttxd_rust_dir }}/rustup/toolchains/{{ ttxd_rust_toolchain }}-x86_64-unknown-linux-gnu"
  environment:
    RUSTUP_HOME: "{{ ttxd_rust_dir }}/rustup"
    CARGO_HOME: "{{ ttxd_rust_dir }}/cargo"

- name: Check out ttxd
  ansible.builtin.git:
    repo: "{{ ttxd_repo }}"
    dest: "{{ ttxd_src_dir }}"
    version: "{{ ttxd_version }}"
  register: ttxd_checkout

- name: Check for an installed ttxd
  ansible.builtin.stat:
    path: /usr/local/bin/ttxd
  register: ttxd_bin

- name: Build ttxd with DeckLink output
  ansible.builtin.command:
    argv:
      - "{{ ttxd_rust_dir }}/cargo/bin/cargo"
      - "+{{ ttxd_rust_toolchain }}"
      - build
      - --release
      - --locked
      - --features
      - decklink
    chdir: "{{ ttxd_src_dir }}"
  environment:
    RUSTUP_HOME: "{{ ttxd_rust_dir }}/rustup"
    CARGO_HOME: "{{ ttxd_rust_dir }}/cargo"
    DECKLINK_SDK_INCLUDE: "{{ ttxd_decklink_sdk_include }}"
  when: ttxd_checkout is changed or not ttxd_bin.stat.exists
  changed_when: true

- name: Install the ttxd binary
  ansible.builtin.copy:
    src: "{{ ttxd_src_dir }}/target/release/ttxd"
    dest: /usr/local/bin/ttxd
    remote_src: true
    mode: "0755"
  notify: Restart ttxd

- name: Create the ttxd user
  ansible.builtin.user:
    name: ttxd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/ttxd
    create_home: false

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/ttxd
    state: directory
    owner: root
    group: ttxd
    mode: "0750"

- name: Install the ttxd config
  ansible.builtin.template:
    src: ttxd.toml.j2
    dest: /etc/ttxd/ttxd.toml
    owner: root
    group: ttxd
    mode: "0640"
  diff: false  # holds publisher tokens
  notify: Restart ttxd

- name: Install the ttxd service
  ansible.builtin.template:
    src: ttxd.service.j2
    dest: /etc/systemd/system/ttxd.service
    mode: "0644"
  notify: Restart ttxd

- name: Enable and start ttxd
  ansible.builtin.systemd_service:
    name: ttxd
    enabled: true
    state: started
    daemon_reload: true
