---
# Points the cluster's Prometheus at the node_exporters that
# roles/node_exporter installs on the hosts outside it, and ships the
# dashboards and alerting rules for them.
#
# The hosts are not in the cluster and never will be, so there are no pods to
# discover. The targets are written out as an Endpoints object attached to a
# selectorless Service, which is the Prometheus Operator's supported way of
# scraping something that Kubernetes does not run -- see the templates.

- name: Verify every host to be scraped has an address in data/hosts.yml
  # Fails here with an actionable message rather than in the middle of
  # rendering the Endpoints with a Jinja undefined-variable error.
  ansible.builtin.assert:
    that:
      - groups[node_exporter_scrape_group] | default([]) | length > 0
      - groups[node_exporter_scrape_group] | difference(host_config.keys() | list) | length == 0
    fail_msg: >-
      Inventory group {{ node_exporter_scrape_group }} is empty, or contains
      hosts with no host_config entry:
      {{ groups[node_exporter_scrape_group] | default([]) | difference(host_config.keys() | list) | join(', ') }}.
      Every host to be scraped needs an ip_cidr in data/hosts.yml.
  run_once: true

- name: Ensure the monitoring namespace exists
  # kube_prometheus_stack creates this, but this role does not depend on
  # having run after it in the same play.
  become: yes
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ node_exporter_scrape_namespace }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy the node_exporter Service
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'service.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy the node_exporter Endpoints
  # Rendered from the inventory group, so adding a host there is the whole
  # change. Kubernetes leaves these alone because the Service above has no
  # selector; the moment it grows one, the endpoints controller would take
  # ownership and wipe them.
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'endpoints.yml.j2') }}"
    state: present
    # Endpoints is one of the few objects where a strategic merge would keep
    # addresses this role has removed -- a host taken out of the inventory
    # group has to disappear from the target list too.
    force: true
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy the node_exporter ServiceMonitor
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'servicemonitor.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy the node_exporter alerting rules
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'prometheusrule.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"

- name: Deploy the node_exporter Grafana dashboards
  # Picked up by the Grafana sidecar via the grafana_dashboard label rather
  # than by anything here talking to Grafana -- see the template.
  become: yes
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'dashboard-configmap.yml.j2') }}"
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
