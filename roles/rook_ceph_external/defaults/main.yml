---
# Connects a Kubernetes cluster's Rook to the Proxmox Ceph cluster
# (roles/proxmox_ceph) in external mode: the CephX users, their keys and the
# mon endpoints, read from Ceph with Rook's own export script, the external
# CephCluster resource and the StorageClass. The operator and CSI drivers
# stay where they are, in the clusters repo (clusters/<env>/platform/rook-ceph).

# Name of this Kubernetes cluster, used in the CephX user names.
rook_ceph_external_k8s_cluster_name: "{{ 'prod' if 'prod' in group_names else 'staging' }}"

# Pool this cluster may use; created by roles/proxmox_ceph.
rook_ceph_external_pool: "k8s-{{ rook_ceph_external_k8s_cluster_name }}"

# Namespace of the external CephCluster. Separate from rook-ceph so it can
# run beside the in-cluster CephCluster while volumes move across.
rook_ceph_external_namespace: rook-ceph-external
rook_ceph_operator_namespace: rook-ceph

rook_ceph_external_storage_class: ceph-rbd

# Proxmox host the export script runs on (it needs the admin keyring).
rook_ceph_external_ceph_host: "{{ groups['proxmox_ceph'] | first }}"

# The users create-external-cluster-resources.py makes with
# --restricted-auth-permission. Their keys get rook_ceph_external_key_type
# (tasks/main.yml).
rook_ceph_external_ceph_users:
  - client.healthchecker
  - "client.csi-rbd-node-{{ rook_ceph_external_k8s_cluster_name }}-{{ rook_ceph_external_pool }}"
  - "client.csi-rbd-provisioner-{{ rook_ceph_external_k8s_cluster_name }}-{{ rook_ceph_external_pool }}"

# CephX key type for the users above. aes256k needs every node of the
# cluster on Linux >= 7.0 (krbd) and ceph-csi >= v3.17.2 (Rook >= v1.20.10
# with the cephcsi tag pinned, clusters/<env>/platform/rook-ceph). Classic
# aes is the stopgap from 2026-11-11 for clusters not there yet; once no
# cluster uses it, drop aes from proxmox_ceph_allowed_ciphers and un-mute
# the warnings in roles/proxmox_ceph (infra#82).
rook_ceph_external_key_type: aes

# Users every cluster shares, and their key type: the lowest any cluster can
# use. Set it to aes256k only once rook_ceph_external_key_type is aes256k
# everywhere, and run the role on every cluster after.
rook_ceph_external_shared_users:
  - client.healthchecker
rook_ceph_external_shared_key_type: aes
