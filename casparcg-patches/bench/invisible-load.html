<!doctype html>
<!-- Invisible load generator for CasparCG's HTML producer.
     Renders nothing visible (transparent page, alpha forced to 0) but keeps
     CPU and GPU busy, like heavy on-air graphics.
     Query parameters:
       cpu=<ms>     JavaScript busy time per animation frame (default 8)
       gpu=<iters>  fragment shader loop iterations per pixel (default 400)
       w,h          canvas size (default 1280x720)
     Abort: CLEAR the layer. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const CPU_MS = Number(q.get('cpu') ?? 8);
const ITERS = Math.max(1, Math.min(5000, Number(q.get('gpu') ?? 400) | 0));
const W = Number(q.get('w') ?? 1280), H = Number(q.get('h') ?? 720);

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });

let draw = () => {};
if (gl) {
  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
  const fs = `precision highp float;
    uniform float t;
    void main(){
      vec2 uv = gl_FragCoord.xy / vec2(${W}.0, ${H}.0);
      float v = 0.0;
      for (int i = 0; i < ${ITERS}; i++) {
        v += sin(uv.x * float(i) + t) * cos(uv.y * float(i) - t);
      }
      // Depends on v so the loop can't be optimised away, but is always 0:
      // fully transparent output.
      float a = step(1.0e30, abs(v));
      gl_FragColor = vec4(0.0, 0.0, 0.0, a);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tl = gl.getUniformLocation(prog, 't');
  gl.clearColor(0, 0, 0, 0);
  draw = (t) => {
    gl.viewport(0, 0, W, H);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(tl, t / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
}

let sink = 0;
function frame(t) {
  draw(t);
  const end = performance.now() + CPU_MS;
  while (performance.now() < end) { sink += Math.sqrt(sink + 1); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// CasparCG template API stubs, so CG ADD/PLAY/STOP/UPDATE don't error.
window.play = window.stop = window.next = window.update = () => {};
</script>
</body>
</html>
