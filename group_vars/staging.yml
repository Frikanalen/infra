frikanalen_app_namespace: default
frikanalen_public_ingress_class: public
frikanalen_dyndns_server: "192.168.3.2"
frikanalen_dyndns_tsig_keyname: staging-update-key
frikanalen_dyndns_zone: staging.frikanalen.no
frikanalen_dyndns_owner_id: staging-external-dns

frikanalen_domain: staging.frikanalen.no
