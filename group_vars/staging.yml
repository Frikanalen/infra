argocd_image_updater_enabled: true

app_versions:
  graphics: staging
  playout: staging
  frontend: staging
  django: staging
  stream: main

helm_chart_versions:
  traefik: "38.0.2"
  argocd: "9.1.7"
  argocd_image_updater: "1.2.4"
  external_dns: "1.19.0"
  metallb: "0.15.3"
  kubegres: "v1.19"
