---
timezone_region: Europe/Oslo
frikanalen_app_namespace: default
frikanalen_public_ingress_class: public
frikanalen_dyndns_server: "192.168.3.2"
frikanalen_dyndns_tsig_keyname: staging-update-key
frikanalen_dyndns_zone: staging.frikanalen.tv
frikanalen_dyndns_owner_id: staging-external-dns

# Internal-only zone for VPN-reachable ingresses on this cluster. Reuses
# staging-update-key above rather than a separate key -- same cluster, same
# trust boundary as staging.frikanalen.tv already uses.
frikanalen_intern_zone: intern.dev.frikanalen.tv
frikanalen_intern_tsig_keyname: staging-update-key
frikanalen_intern_owner_id: dev-internal-external-dns
frikanalen_intern_ingress_class: internal

frikanalen_domain: staging.frikanalen.tv

# Django's database: CloudNativePG's pgcluster since 2026-11-10 (docs/cnpg.md),
# and the Secret holding its credentials (from OpenBao). Read by cnpg_cluster
# and staging_db_sync.
django_db_host: pgcluster-rw
django_db_secret_name: django-postgres-passwords

# Dedicated contribution endpoint; SRT shares the site's public IP via PF.
mediamtx_loadbalancer_ip: "{{ host_config['ingress-dev-contribution'].ip_cidr.split('/')[0] }}"

# Deliberately a separate account and directory from prod: staging uploads must
# not reach the production archive, which roles/nfs_server exports to the
# playout hosts. Still on file01, so staging exercises the real SSH path.
ingest_archive_host: file01
ingest_archive_user: ingest-staging
ingest_archive_dir: /archive/media-staging
# Staging runs ingest main, which writes through fk-archive rather than over
# SFTP; the directory belongs to the profile's manager, not to this account.
ingest_archive_fk_profile: staging

# Workers must see a published original at once, so the archive mount keeps no
# attribute, directory or negative-lookup cache. The default ~30 s directory
# cache let a worker claim a job before the file it had just been given showed
# up. Reads are a few large sequential fetches, so the lost caching costs little.
ingest_archive_nfs_mount_options: [ro, nfsvers=4.2, actimeo=0, lookupcache=none]

# This is the cluster kube_prometheus_stack runs on, so the ServiceMonitors,
# PodMonitors and Grafana dashboards the other roles ship are wanted here.
# See data/cluster.yml for what this gates and why prod leaves it false.
k8s_monitoring_enabled: true
kube_prometheus_stack_environment: development

# Which OpenBao prefix this cluster reads (kv/staging/...), and the name of its
# Kubernetes auth mount there. See roles/openbao_k8s_auth and docs/openbao.md.
openbao_env: staging

# The app Secrets (openbao_seed_secrets below) come from OpenBao through
# External Secrets Operator (clusters/staging/secrets), so the roles that
# used to write them skip that, or write to OpenBao instead.
app_secrets_from_openbao: true

# Secrets playbooks/openbao_seed.yml copies from this cluster into OpenBao,
# unchanged, at kv/staging/<namespace>/<name>. The app Secrets only: the
# platform's (Traefik, external-dns, monitoring) stay with Ansible until the
# platform moves to the clusters repo.
openbao_seed_secrets:
  - { namespace: default, name: django-postgres-passwords }
  - { namespace: default, name: django-secret }
  - { namespace: default, name: pgcluster-app }
  - { namespace: default, name: pgcluster-superuser }
  - { namespace: default, name: pgcluster-backup-s3 }
  - { namespace: default, name: ingest-api }
  - { namespace: default, name: ingest-archive-ssh }
  - { namespace: default, name: playout-live }

helm_chart_versions:
  traefik: "41.6.0"
  argocd: "10.9.2"
  argocd_image_updater: "1.2.4"
  external_dns: "1.19.0"
  metallb: "0.15.3"
  # CloudNativePG Helm chart version, not the operator's app version (chart
  # 0.29.0 ships operator 1.30.0 -- see Chart.yaml's appVersion upstream).
  cnpg: "0.29.0"
  # Barman Cloud plugin chart (app v0.15.1); backups for pgcluster.
  cnpg_barman_plugin: "0.8.1"
  # Only for the Barman Cloud plugin; see roles/cert_manager.
  cert_manager: "v1.19.1"
  kube_prometheus_stack: "91.4.1"
  loki: "7.3.0"
  alloy: "1.12.1"
  # External Secrets Operator (roles/external_secrets) and Reloader
  # (roles/reloader); see docs/openbao.md.
  external_secrets: "2.13.0"
  reloader: "2.2.18"
