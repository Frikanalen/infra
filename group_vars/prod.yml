---
timezone_region: Europe/Oslo
frikanalen_app_namespace: default
frikanalen_public_ingress_class: public
frikanalen_dyndns_server: "192.168.3.2"

# Internal-only zone for VPN-reachable ingresses on this cluster -- see
# roles/dns_server_zones_dynamic and the "ingress" play in
# playbooks/k8s_cluster_prod.yml for how external-dns/Traefik pick it up.
frikanalen_intern_zone: intern.frikanalen.no
frikanalen_intern_tsig_keyname: prod-cluster-update-key
frikanalen_intern_owner_id: prod-internal-external-dns
frikanalen_intern_ingress_class: internal

# Prometheus Operator + Prometheus + Alertmanager + Grafana via
# roles/kube_prometheus_stack, exposed only on frikanalen_intern_zone -- see
# playbooks/k8s_platform_prod.yml. Also turns on the ServiceMonitors that
# traefik/argocd/cnpg/metallb would otherwise skip -- see data/apps.yml and
# each role's tasks.
k8s_monitoring_enabled: true

frikanalen_domain: frikanalen.no
frikanalen_scheme: https

caspar_host: "192.168.3.35"

django_db_host: django-postgres
django_db_secret_name: django-postgres-passwords

# Dedicated contribution endpoint; SRT shares the site's public IP via PF.
mediamtx_loadbalancer_ip: "{{ host_config['ingress-prod-contribution'].ip_cidr.split('/')[0] }}"
# About 4 s of a 10 Mbit/s feed per reader, so CasparCG rides out uplink bursts.
mediamtx_write_queue_size: 4096

playout_media_path: /mnt/media/

# Ingest archives over SSH, so it runs in Kubernetes rather than on file01
# itself. The account and key are provisioned by roles/ingest_archive_account;
# this is the existing media archive that roles/nfs_server exports.
ingest_archive_host: file01
ingest_archive_user: ingest
ingest_archive_dir: /archive/media
# /archive/media is already group-writable by fkupload, so membership is all
# the ingest account needs. Deliberately not set for staging.
ingest_archive_group: fkupload

# tusd runs alongside ingest in the same pod, served at /upload on
# frikanalen_domain. Django's FK_UPLOAD_URL must point there.
ingest_uploads_size: 500Gi

traefik_acme_challenge: web # we don't use DNS01 in prod (yet?)

# The front-page stream takes caspar1's H.264 mezzanine (host_vars/caspar1.yml)
# straight off multicast, as staging does with caspar-sw1: the in-cluster
# cubemap joins 239.1.1.51 and ffmpeg re-encodes from it. This replaces the
# old path through the SDI encoder appliance and simula's cubemap
# (158.36.191.230:5565). An earlier multicast-joined cubemap here dropped
# out of the switch's IGMP snooping table; staging's has held since
# 2026-10-31, but watch for the same symptom (input goes stale after a few
# minutes) after deploying this. Joining needs the node's network
# namespace: Calico doesn't carry multicast into pods.
argocd_stream_cubemap_enabled: true
argocd_stream_cubemap_host_network: true
argocd_stream_cubemap_multicast_group: "239.1.1.51"
# Unused with a multicast group, but data/apps.yml requires it.
argocd_stream_cubemap_ip: "192.168.3.105"

# Every app the cluster runs must have a key here. The roles no longer carry
# a fallback: a missing key is now an undefined-variable error rather than a
# silent deploy of whatever the fallback happened to name.
app_versions:
  # Git revision of Frikanalen/gitops (helm/mediamtx), not an image tag.
  mediamtx: main
  graphics: v1.2.0
  playout: v2.2.0
  frontend: v3.2.0
  django: v2.0.0
  stream: v0.3.2
  ingest: v0.1.1

helm_chart_versions:
  traefik: "41.6.0"
  argocd: "10.9.2"
  argocd_image_updater: "1.2.4"
  external_dns: "1.19.0"
  metallb: "0.15.3"
  kubegres: "v1.19"
  # CloudNativePG Helm chart version, not the operator's app version (chart
  # 0.29.0 ships operator 1.30.0 -- see Chart.yaml's appVersion upstream).
  cnpg: "0.29.0"
  kube_prometheus_stack: "91.4.1"
  loki: "7.3.0"
  alloy: "1.12.1"
