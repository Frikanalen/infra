---
timezone_region: Europe/Oslo
frikanalen_app_namespace: default
frikanalen_public_ingress_class: public
frikanalen_dyndns_server: "192.168.3.2"

# Internal-only zone for VPN-reachable ingresses on this cluster -- see
# roles/dns_server_zones_dynamic and the "ingress" play in
# playbooks/k8s_cluster_prod.yml for how external-dns/Traefik pick it up.
frikanalen_intern_zone: intern.frikanalen.tv
frikanalen_intern_tsig_keyname: prod-cluster-update-key
frikanalen_intern_owner_id: prod-internal-external-dns
frikanalen_intern_ingress_class: internal

# Prometheus Operator + Prometheus + Alertmanager + Grafana via
# roles/kube_prometheus_stack, exposed only on frikanalen_intern_zone -- see
# playbooks/k8s_platform_prod.yml. Also turns on the ServiceMonitors that
# traefik/argocd/cnpg/metallb would otherwise skip -- see each role's tasks.
k8s_monitoring_enabled: true
kube_prometheus_stack_environment: production

frikanalen_domain: frikanalen.tv

# Django's database: CloudNativePG's pgcluster since 2026-11-10 (docs/cnpg.md),
# and the Secret holding its credentials (from OpenBao). Read by cnpg_cluster
# and staging_db_sync.
django_db_host: pgcluster-rw
django_db_secret_name: django-postgres-passwords

# Dedicated contribution endpoint; SRT shares the site's public IP via PF.
mediamtx_loadbalancer_ip: "{{ host_config['ingress-prod-contribution'].ip_cidr.split('/')[0] }}"

# Ingest archives over SSH, so it runs in Kubernetes rather than on file01
# itself. The account and key are provisioned by roles/ingest_archive_account;
# this is the existing media archive that roles/nfs_server exports.
ingest_archive_host: file01
ingest_archive_user: ingest
ingest_archive_dir: /archive/media
# /archive/media is already group-writable by fkupload, so membership is all
# the ingest account needs. Deliberately not set for staging.
ingest_archive_group: fkupload
# Ingest v1 has no write access of its own: it asks fk-archive on file01
# (roles/fk_archive_utils, profile "prod" in group_vars/storage.yml) to make
# each change. That runs as archive-manager, which roles/fk_archive_utils makes
# the owner of /archive/media (group fkupload, 2775).
ingest_archive_fk_profile: prod

# Workers must see a published original at once, so the archive mount keeps no
# attribute, directory or negative-lookup cache. See group_vars/staging.yml.
ingest_archive_nfs_mount_options: [ro, nfsvers=4.2, actimeo=0, lookupcache=none]

traefik_acme_challenge: web # we don't use DNS01 in prod (yet?)

# The stream app's cubemap runs with hostNetwork to join caspar1's multicast
# program out (clusters/prod/apps/stream.yaml). Its socket then gets the node's default UDP
# receive buffer (212992 bytes), which overflowed at ~20 Mbit/s: UDP
# RcvbufErrors lined up with ffmpeg's "corrupt input packet" about once a
# minute. Set on every kubeprod node by playbooks/k8s_cluster_prod.yml
# (--tags cubemap-sysctl), since cubemap moves when its node is drained.
argocd_stream_cubemap_node_sysctls:
  net.core.rmem_max: 33554432
  net.core.rmem_default: 16777216

# Which OpenBao prefix this cluster reads (kv/prod/...), and the name of its
# Kubernetes auth mount there. See roles/openbao_k8s_auth and docs/openbao.md.
openbao_env: prod

# The app Secrets (openbao_seed_secrets below) come from OpenBao through
# External Secrets Operator (clusters/prod/secrets), so the roles that used
# to write them skip that, or write to OpenBao instead.
app_secrets_from_openbao: true

# Secrets playbooks/openbao_seed.yml copies from this cluster into OpenBao,
# unchanged, at kv/prod/<namespace>/<name>. The app Secrets only: the
# platform's (Traefik, external-dns, monitoring) stay with Ansible until the
# platform moves to the clusters repo.
openbao_seed_secrets:
  - { namespace: default, name: django-postgres-passwords }
  - { namespace: default, name: django-secret }
  - { namespace: default, name: pgcluster-app }
  - { namespace: default, name: pgcluster-superuser }
  - { namespace: default, name: pgcluster-backup-s3 }
  - { namespace: default, name: ingest-api }
  - { namespace: default, name: ingest-archive-ssh }
  - { namespace: default, name: playout-live }

helm_chart_versions:
  traefik: "41.6.0"
  argocd: "10.9.2"
  argocd_image_updater: "1.2.4"
  external_dns: "1.19.0"
  metallb: "0.15.3"
  # CloudNativePG Helm chart version, not the operator's app version (chart
  # 0.29.0 ships operator 1.30.0 -- see Chart.yaml's appVersion upstream).
  cnpg: "0.29.0"
  # Barman Cloud plugin chart (app v0.15.1); backups for pgcluster.
  cnpg_barman_plugin: "0.8.1"
  # Only for the Barman Cloud plugin; see roles/cert_manager.
  cert_manager: "v1.19.1"
  kube_prometheus_stack: "91.4.1"
  loki: "7.3.0"
  alloy: "1.12.1"
  # External Secrets Operator (roles/external_secrets) and Reloader
  # (roles/reloader); see docs/openbao.md.
  external_secrets: "2.13.0"
  reloader: "2.2.18"
