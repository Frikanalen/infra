---
# Pin the interpreter rather than let Ansible discover it. On Ubuntu 26.04
# /usr/bin/python3 is 3.14, which verifies TLS in strict X.509 mode; that
# needs the cluster CA to carry keyUsage, which
# playbooks/reissue_microk8s_ca.yml added to both clusters' CAs.
ansible_python_interpreter: /usr/bin/python3
