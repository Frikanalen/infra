---
# Pin the interpreter rather than let Ansible discover it, and pin it to 3.12
# for now. On Ubuntu 26.04 /usr/bin/python3 is 3.14, and Python 3.13+ verifies
# TLS in strict X.509 mode: MicroK8s's self-made CA has no keyUsage extension,
# so every kubernetes.core call fails with "CA cert does not include key usage
# extension". python3.12 is still installed after the in-place upgrade (the
# upgrade keeps obsolete packages) and is the system Python on 24.04.
#
# Switch to /usr/bin/python3 once the cluster CAs are re-issued with keyUsage.
ansible_python_interpreter: /usr/bin/python3.12
