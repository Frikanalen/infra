# file01: exports the ZFS media archive (archive/media) read-only to the
# CasparCG playout hosts over NFSv4. Client hostnames resolve via the
# dc1.frikanalen.no search domain set up by roles/common.
nfs_exports:
  - path: /archive/media
    clients: "caspar1(ro,sync,no_subtree_check) caspar-sw1(ro,sync,no_subtree_check)"
