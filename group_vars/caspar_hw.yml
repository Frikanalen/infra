# Mount file01's live media archive read-only; see roles/nfs_client and
# roles/nfs_server, and group_vars/storage.yml for the export side. caspar_hw
# is the production hardware playout host, so it watches the real archive --
# unlike caspar_sw (group_vars/caspar_sw.yml), which is staging and watches a
# weekly-reset clone instead.
nfs_client_mounts:
  - src: "file01:/archive/media"
    path: /mnt/media
